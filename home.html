<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D Pharma Portal - Home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #05241f 0%, #020f0d 100%);
      color: #ffffff;
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
      position: relative;
    }

    /* Falling Medicines Rain */
    .rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .medicine-drop {
      position: absolute;
      top: -90px;
      animation: slowRain linear infinite;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
    }

    @keyframes slowRain {
      0% { transform: translateY(-90px) rotate(0deg); opacity: 0; }
      12% { opacity: 0.85; }
      88% { opacity: 0.85; }
      100% { transform: translateY(112vh) rotate(360deg); opacity: 0; }
    }

    .app-wrapper {
      position: relative;
      z-index: 2;
      max-width: 720px;
      margin: 0 auto;
      padding: 15px;
    }

    /* Top Bar */
    .top-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(6, 43, 37, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 20px;
      padding: 10px 14px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .app-logo-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.95rem;
      color: #34d399;
      cursor: pointer;
    }

    .search-container {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(3, 20, 17, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 30px;
      padding: 8px 14px;
      color: #ffffff;
      font-size: 0.86rem;
      outline: none;
      transition: 0.3s;
      -webkit-user-select: text;
      user-select: text;
    }

    .search-input:focus {
      border-color: #34d399;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
    }

    /* Protected Profile Avatar */
    .profile-nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #34d399;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
      background: #021a15;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .protected-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      -webkit-touch-callout: none;
    }

    /* Search Results */
    .search-results-box {
      display: none;
      background: rgba(6, 43, 37, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid rgba(52, 211, 153, 0.15);
    }

    .user-card:last-child {
      border-bottom: none;
    }

    .user-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar-sm {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #34d399;
      background: #031411;
      pointer-events: none;
    }

    .action-btns {
      display: flex;
      gap: 6px;
    }

    .btn-action {
      background: rgba(16, 185, 129, 0.25);
      border: 1px solid #34d399;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-action:hover {
      background: rgba(16, 185, 129, 0.45);
    }

    .btn-partner {
      background: rgba(245, 158, 11, 0.25);
      border: 1px solid #f59e0b;
      color: #fbbf24;
    }

    /* Notice Creator Panel */
    .glass-card {
      background: rgba(6, 43, 37, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 20px;
      padding: 20px 18px;
      margin-bottom: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    #createNoticePanel {
      display: none;
      margin-bottom: 20px;
    }

    .input-field-custom {
      width: 100%;
      background: rgba(3, 20, 17, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 10px;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 0.85rem;
      margin-bottom: 8px;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    /* WHATSAPP STORY STYLE NOTICE VIEWER */
    .story-card-wrapper {
      position: relative;
      background: linear-gradient(180deg, rgba(8, 48, 41, 0.95) 0%, rgba(2, 20, 17, 0.98) 100%);
      border: 1.5px solid rgba(52, 211, 153, 0.4);
      border-radius: 24px;
      padding: 18px;
      min-height: 480px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .story-progress-bar {
      display: flex;
      gap: 5px;
      margin-bottom: 14px;
    }

    .story-progress-segment {
      height: 3.5px;
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    .story-progress-segment.active {
      background: #34d399;
    }

    .story-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .story-author {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .story-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid #34d399;
      object-fit: cover;
      pointer-events: none;
      background: #021a15;
    }

    .story-author-details h4 {
      font-size: 0.95rem;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .story-author-details span {
      font-size: 0.72rem;
      color: #34d399;
      display: block;
    }

    .btn-delete-notice {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-delete-notice:hover {
      background: rgba(239, 68, 68, 0.45);
      color: #ffffff;
    }

    .story-content-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 10px 4px;
    }

    .story-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #34d399;
      margin-bottom: 10px;
    }

    .story-desc {
      font-size: 0.9rem;
      color: #e2e8f0;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 14px;
      padding: 0 10px;
    }

    .story-image-full {
      max-width: 100%;
      max-height: 260px;
      border-radius: 14px;
      border: 1px solid rgba(52, 211, 153, 0.35);
      object-fit: contain;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .story-footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid rgba(52, 211, 153, 0.15);
    }

    .arrow-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #34d399;
      color: #34d399;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .arrow-btn:hover {
      background: rgba(16, 185, 129, 0.45);
      color: #ffffff;
      transform: scale(1.05);
    }

    .arrow-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    /* Read-Only Profile View Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: rgba(6, 43, 37, 0.95);
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .modal-photo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #34d399;
      margin-bottom: 12px;
      background: #021a15;
      pointer-events: none;
    }

    .profile-field {
      text-align: left;
      background: rgba(3, 20, 17, 0.6);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      border: 1px solid rgba(52, 211, 153, 0.15);
    }

    .profile-field span {
      color: #34d399;
      font-weight: 600;
    }

    .modal-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }

    /* Fixed Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 62px;
      background: rgba(3, 20, 17, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(52, 211, 153, 0.3);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      gap: 3px;
    }

    .nav-item.active, .nav-item:hover {
      color: #34d399;
    }

    .fullscreen-hint {
      text-align: center;
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body oncontextmenu="return false;">

  <!-- Falling Medicines Background Animation -->
  <div class="rain-container" id="rainContainer"></div>

  <div class="app-wrapper">
    <!-- Top Nav Bar -->
    <div class="top-navbar">
      <div class="app-logo-badge" onclick="window.location.reload()">
        <span>℞</span> D-PHARMA
      </div>
      <div class="search-container">
        <input type="text" id="userSearchInput" class="search-input" placeholder="Search registered students (Name/Enroll)..." autocomplete="off" />
      </div>
      <div class="profile-nav-btn" onclick="openProfileModal()">
        <img id="navProfilePic" class="protected-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Profile" />
      </div>
    </div>

    <!-- Search Results View (Clears automatically when input is empty) -->
    <div id="searchResultsBox" class="search-results-box">
      <div style="font-size: 0.8rem; color: #a7f3d0; margin-bottom: 8px;">SEARCH RESULTS:</div>
      <div id="usersList"></div>
    </div>

    <!-- Protected Notice Creation Area (ONLY Developer & Teachers can post) -->
    <div id="createNoticePanel" class="glass-card">
      <h3 style="color:#34d399; font-size:1rem; margin-bottom:10px;">📢 Post Official Notice (WhatsApp Status View)</h3>
      <input type="text" id="noticeTitle" class="input-field-custom" placeholder="Notice Title / Topic..." />
      <textarea id="noticeContent" class="input-field-custom" rows="3" placeholder="Full notice description / notes..."></textarea>
      <input type="text" id="noticeLink" class="input-field-custom" placeholder="Optional external link (https://...)" />
      
      <label style="font-size:0.8rem; color:#a7f3d0; display:block; margin:6px 0 2px;">Attach Images (Max 10):</label>
      <input type="file" id="noticeImages" class="input-field-custom" accept="image/*" multiple />
      
      <button onclick="publishNotice()" class="btn-action" style="width:100%; padding:10px; margin-top:6px; font-weight:700; justify-content:center;">Publish Notice</button>
    </div>

    <!-- WHATSAPP STORY STYLE NOTICE SECTION -->
    <div class="story-card-wrapper" id="storyNoticeBox">
      <div class="story-progress-bar" id="storyProgress"></div>

      <div class="story-header">
        <div class="story-author">
          <img id="storyAuthorPhoto" class="story-avatar protected-img" src="" alt="Author" />
          <div class="story-author-details">
            <h4 id="storyAuthorName">Authority</h4>
            <span id="storyTime">Just now</span>
          </div>
        </div>
        <div id="devDeleteWrap"></div>
      </div>

      <div class="story-content-body">
        <div class="story-title" id="storyTitle">Notice Title</div>
        <div class="story-desc" id="storyDesc">Loading announcement details...</div>
        <div id="storyImageWrap"></div>
        <div id="storyLinkWrap" style="margin-top:10px;"></div>
      </div>

      <div class="story-footer-nav">
        <button class="arrow-btn" id="prevStoryBtn" onclick="navigateStory(-1)">◀</button>
        <span id="storyCounter" style="font-size:0.8rem; color:#94a3b8; font-weight:600;">1 / 1</span>
        <button class="arrow-btn" id="nextStoryBtn" onclick="navigateStory(1)">▶</button>
      </div>
    </div>

    <div class="fullscreen-hint">📱 Double tap / click anywhere on screen for Fullscreen mode</div>
  </div>

  <!-- Read-Only Profile View Modal -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-content">
      <img id="modalProfileImg" class="modal-photo protected-img" src="" alt="Profile" />
      <h3 id="modalName" style="margin-bottom: 4px;">Student Name</h3>
      <p id="modalRoleBadge" style="font-size: 0.75rem; color: #34d399; margin-bottom: 14px;">PROTECTED ID (READ ONLY)</p>
      
      <div class="profile-field"><span>Enrollment:</span> <span id="modalEnroll" style="color:#fff;">-</span></div>
      <div class="profile-field"><span>Email:</span> <span id="modalEmail" style="color:#fff;">-</span></div>
      <div class="profile-field"><span>Phone:</span> <span id="modalPhone" style="color:#fff;">-</span></div>

      <div class="modal-btn-row">
        <button onclick="closeProfileModal()" class="btn-action" style="flex:1; justify-content:center; padding:10px;">Close</button>
        <button onclick="logoutUser()" class="btn-logout">Log Out</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      HOME
    </div>
    <div class="nav-item" onclick="window.location.href='dpg.html'">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
      D.P.G
    </div>
    <div class="nav-item" onclick="window.location.href='chats.html'">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      CHATS
    </div>
  </div>

  <script>
    // 1. STRICT AUTH GUARD
    const isLoggedIn = localStorage.getItem('isLoggedIn');
    const loggedAccount = (localStorage.getItem('userAccount') || '').trim().toLowerCase();
    const loggedRole = localStorage.getItem('userRole') || 'student';
    const DEVELOPER_ID = "karanrathoure6271@gmail.com";

    if (isLoggedIn !== 'true' || !loggedAccount) {
      window.location.replace('login.html');
    }

    // 2. FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyCQ2XpoeeKwVmIZ2wp8H3D2xzTY49nhxAI",
      authDomain: "d-pharma-class-group.firebaseapp.com",
      projectId: "d-pharma-class-group",
      storageBucket: "d-pharma-class-group.firebasestorage.app",
      messagingSenderId: "870561978483",
      appId: "1:870561978483:web:095681d6185f43cd6d7206",
      measurementId: "G-VQ12Y4NLRJ"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUserData = null;

    // 3. LOAD CURRENT USER IDENTITY
    async function initUserIdentity() {
      if (loggedAccount === DEVELOPER_ID.toLowerCase()) {
        currentUserData = {
          name: "Karan Rathoure (Dev)",
          email: DEVELOPER_ID.toLowerCase(),
          role: "developer",
          enroll: "DEV-ROOT",
          phone: "Verified Admin",
          photo: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"
        };
        document.getElementById('createNoticePanel').style.display = 'block';
      } else {
        const snapshot = await db.collection('students').where('email', '==', loggedAccount).get();
        if (!snapshot.empty) {
          currentUserData = snapshot.docs[0].data();
          currentUserData.id = snapshot.docs[0].id;
          
          if (currentUserData.photo) {
            document.getElementById('navProfilePic').src = currentUserData.photo;
            document.getElementById('modalProfileImg').src = currentUserData.photo;
          }
          if (currentUserData.role === 'teacher' || loggedRole === 'teacher') {
            document.getElementById('createNoticePanel').style.display = 'block';
          }
        }
      }
    }
    initUserIdentity();

    // 4. SEARCH SYSTEM (FIXED EMAIL PASSING & REALTIME REQ)
    const searchInput = document.getElementById('userSearchInput');
    const searchResultsBox = document.getElementById('searchResultsBox');
    const usersList = document.getElementById('usersList');

    searchInput.addEventListener('input', async (e) => {
      const query = e.target.value.trim().toLowerCase();
      
      if (query === '' || query.length === 0) {
        usersList.innerHTML = '';
        searchResultsBox.style.display = 'none';
        return;
      }

      const snapshot = await db.collection('students').get();
      usersList.innerHTML = '';
      let matches = 0;

      snapshot.forEach((doc) => {
        const data = doc.data();
        const name = (data.name || '').toLowerCase();
        const enroll = (data.enroll || '').toLowerCase();
        const email = (data.email || '').toLowerCase();

        // Apne aap ko search results se hide karein
        if (email === loggedAccount) return;

        if (name.includes(query) || enroll.includes(query)) {
          matches++;
          const card = document.createElement('div');
          card.className = 'user-card';

          const photo = data.photo || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

          const isDev = loggedAccount === DEVELOPER_ID.toLowerCase();
          let partnerBtn = '';
          if (isDev) {
            partnerBtn = `<button class="btn-action btn-partner" onclick="toggleMainPartner('${doc.id}', ${!data.isMainPartner})">
              ${data.isMainPartner ? 'Revoke Partner' : '★ Make Main Partner'}
            </button>`;
          }

          // FIX: data.email aur data.name dono safely pass kiye ja rahe hain
          card.innerHTML = `
            <div class="user-info-left">
              <img class="user-avatar-sm protected-img" src="${photo}" alt="User Photo" />
              <div>
                <strong style="font-size:0.88rem;">${data.name}</strong>
              </div>
            </div>
            <div class="action-btns">
              <button class="btn-action" onclick="sendChatRequest('${doc.id}', '${data.name.replace(/'/g, "\\'")}', '${email}')">Chat Request</button>
              ${partnerBtn}
            </div>
          `;
          usersList.appendChild(card);
        }
      });

      searchResultsBox.style.display = matches > 0 ? 'block' : 'none';
    });

    // 100% WORKING CHAT REQUEST DISPATCHER
    async function sendChatRequest(targetUserId, targetName, targetEmail) {
      const isSpecial = loggedAccount === DEVELOPER_ID.toLowerCase() || (currentUserData && currentUserData.isMainPartner);
      
      if (isSpecial) {
        window.location.href = `chats.html?to=${encodeURIComponent(targetEmail)}`;
        return;
      }

      const myName = currentUserData ? currentUserData.name : loggedAccount;

      try {
        // Pehle check karein kya request already pending hai
        const existing = await db.collection('chatRequests')
          .where('fromEmail', '==', loggedAccount)
          .where('toEmail', '==', targetEmail.toLowerCase())
          .where('status', '==', 'pending')
          .get();

        if (!existing.empty) {
          alert(`You have already sent a pending request to ${targetName}!`);
          return;
        }

        // Firestore me save (Email + Name + ID)
        await db.collection('chatRequests').add({
          from: loggedAccount,
          fromEmail: loggedAccount,
          fromName: myName,
          toId: targetUserId,
          toEmail: targetEmail.toLowerCase(),
          toName: targetName,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert(`Chat request successfully sent to ${targetName}! They will receive it on their Chats page.`);
      } catch (err) {
        console.error("Error sending chat request:", err);
        alert("Failed to send request: " + err.message);
      }
    }

    async function toggleMainPartner(docId, status) {
      if (loggedAccount !== DEVELOPER_ID.toLowerCase()) return;
      await db.collection('students').doc(docId).update({ isMainPartner: status });
      alert(`User partner status changed to: ${status}`);
    }

    // 5. POST NOTICE
    async function publishNotice() {
      const isAllowed = loggedAccount === DEVELOPER_ID.toLowerCase() || loggedRole === 'teacher';
      if (!isAllowed) {
        alert("Unauthorized! Only Verified Teachers & Developers can publish notices.");
        return;
      }

      const title = document.getElementById('noticeTitle').value.trim();
      const content = document.getElementById('noticeContent').value.trim();
      const link = document.getElementById('noticeLink').value.trim();
      const files = document.getElementById('noticeImages').files;

      if (!title || !content) {
        alert("Please enter Title and Description.");
        return;
      }

      if (files.length > 10) {
        alert("Limit reached: Only 10 images allowed!");
        return;
      }

      const compressedImages = [];
      for (let i = 0; i < files.length; i++) {
        const b64 = await toBase64Compressed(files[i]);
        compressedImages.push(b64);
      }

      const now = new Date();
      const expiresAt = new Date(now.getTime() + 24 * 60 * 60 * 1000);

      await db.collection('notices').add({
        title,
        content,
        link,
        images: compressedImages,
        postedBy: currentUserData ? currentUserData.name : 'Authority',
        authorPhoto: currentUserData && currentUserData.photo ? currentUserData.photo : '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        expiresAt: firebase.firestore.Timestamp.fromDate(expiresAt)
      });

      alert("Notice posted in Status view! Auto-expires in 24h.");
      document.getElementById('noticeTitle').value = '';
      document.getElementById('noticeContent').value = '';
      document.getElementById('noticeLink').value = '';
      document.getElementById('noticeImages').value = '';
    }

    function toBase64Compressed(file) {
      return new Promise((res) => {
        const r = new FileReader();
        r.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const max = 800;
            let w = img.width, h = img.height;
            if (w > h && w > max) { h *= max / w; w = max; }
            else if (h > max) { w *= max / h; h = max; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            res(canvas.toDataURL('image/jpeg', 0.72));
          };
          img.src = e.target.result;
        };
        r.readAsDataURL(file);
      });
    }

    // 6. WHATSAPP STORY STATUS ENGINE (WITH REALTIME DELETE)
    let activeNotices = [];
    let currentStoryIndex = 0;

    function loadStoryNotices() {
      db.collection('notices').orderBy('createdAt', 'desc').onSnapshot((snap) => {
        const currentTime = new Date().getTime();
        activeNotices = [];

        snap.forEach((doc) => {
          const data = doc.data();
          data.id = doc.id;
          
          if (data.expiresAt) {
            const expTime = data.expiresAt.toDate().getTime();
            if (currentTime > expTime) return;
          }
          activeNotices.push(data);
        });

        if (currentStoryIndex >= activeNotices.length) {
          currentStoryIndex = Math.max(0, activeNotices.length - 1);
        }
        renderCurrentStory();
      });
    }
    loadStoryNotices();

    function renderCurrentStory() {
      const isDev = loggedAccount === DEVELOPER_ID.toLowerCase();

      if (activeNotices.length === 0) {
        document.getElementById('storyProgress').innerHTML = '<div class="story-progress-segment active"></div>';
        document.getElementById('storyAuthorName').innerText = "Notice Board";
        document.getElementById('storyTime').innerText = "No updates";
        document.getElementById('storyAuthorPhoto').src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
        document.getElementById('storyTitle').innerText = "No Active Notices";
        document.getElementById('storyDesc').innerText = "There are no active notices at this moment.";
        document.getElementById('storyImageWrap').innerHTML = '';
        document.getElementById('storyLinkWrap').innerHTML = '';
        document.getElementById('devDeleteWrap').innerHTML = '';
        document.getElementById('storyCounter').innerText = "0 / 0";
        document.getElementById('prevStoryBtn').disabled = true;
        document.getElementById('nextStoryBtn').disabled = true;
        return;
      }

      const notice = activeNotices[currentStoryIndex];

      let bars = '';
      for (let i = 0; i < activeNotices.length; i++) {
        bars += `<div class="story-progress-segment ${i <= currentStoryIndex ? 'active' : ''}"></div>`;
      }
      document.getElementById('storyProgress').innerHTML = bars;

      document.getElementById('storyAuthorName').innerText = notice.postedBy || "Authority";
      document.getElementById('storyTime').innerText = "Official Update";
      document.getElementById('storyAuthorPhoto').src = notice.authorPhoto || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

      if (isDev) {
        document.getElementById('devDeleteWrap').innerHTML = `<button class="btn-delete-notice" onclick="deleteNoticeDirect('${notice.id}')">🗑 Delete Notice</button>`;
      } else {
        document.getElementById('devDeleteWrap').innerHTML = '';
      }

      document.getElementById('storyTitle').innerText = notice.title || "";
      document.getElementById('storyDesc').innerText = notice.content || "";

      if (notice.images && notice.images.length > 0) {
        document.getElementById('storyImageWrap').innerHTML = `
          <img src="${notice.images[0]}" class="story-image-full" alt="Notice Image" onclick="window.open('${notice.images[0]}')" />
          ${notice.images.length > 1 ? `<div style="font-size:0.75rem; color:#6ee7b7; margin-top:4px;">+${notice.images.length - 1} more images</div>` : ''}
        `;
      } else {
        document.getElementById('storyImageWrap').innerHTML = '';
      }

      if (notice.link) {
        document.getElementById('storyLinkWrap').innerHTML = `<a href="${notice.link}" target="_blank" style="color:#38bdf8; font-size:0.82rem; text-decoration:none;">🔗 Open Attached Link</a>`;
      } else {
        document.getElementById('storyLinkWrap').innerHTML = '';
      }

      document.getElementById('storyCounter').innerText = `${currentStoryIndex + 1} / ${activeNotices.length}`;
      document.getElementById('prevStoryBtn').disabled = currentStoryIndex === 0;
      document.getElementById('nextStoryBtn').disabled = currentStoryIndex === activeNotices.length - 1;
    }

    function navigateStory(dir) {
      const newIndex = currentStoryIndex + dir;
      if (newIndex >= 0 && newIndex < activeNotices.length) {
        currentStoryIndex = newIndex;
        renderCurrentStory();
      }
    }

    async function deleteNoticeDirect(noticeId) {
      if (loggedAccount !== DEVELOPER_ID.toLowerCase()) return;
      if (confirm("Are you sure you want to permanently remove this notice?")) {
        try {
          await db.collection('notices').doc(noticeId).delete();
          alert("Notice successfully deleted!");
        } catch (err) {
          alert("Error deleting notice: " + err.message);
        }
      }
    }

    // 7. PROFILE MODAL & LOGOUT
    function openProfileModal() {
      if (!currentUserData) return;
      document.getElementById('modalName').innerText = currentUserData.name || 'Student';
      document.getElementById('modalEnroll').innerText = currentUserData.enroll || 'N/A';
      document.getElementById('modalEmail').innerText = currentUserData.email || 'N/A';
      document.getElementById('modalPhone').innerText = currentUserData.phone || 'N/A';
      if (currentUserData.photo) {
        document.getElementById('modalProfileImg').src = currentUserData.photo;
      }
      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() {
      document.getElementById('profileModal').style.display = 'none';
    }

    function logoutUser() {
      localStorage.clear();
      sessionStorage.clear();
      window.location.replace('login.html');
    }

      drop.style.height = size + 'px';
      drop.style.left = Math.random() * 95 + '%';

    // 9. DOUBLE-CLICK FULLSCREEN API
    document.addEventListener('dblclick', function(e) {
      if (['INPUT', 'BUTTON', 'TEXTAREA', 'A'].includes(e.target.tagName)) return;
      const doc = window.document;
      const docEl = doc.documentElement;
      const req = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      const exit = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (req) req.call(docEl).catch(() => {});
      } else {
        if (exit) exit.call(doc);
      }
    });
  </script>
