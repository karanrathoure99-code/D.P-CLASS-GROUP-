<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D Pharma Portal - Home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #05241f 0%, #020f0d 100%);
      color: #ffffff;
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
      position: relative;
    }

    /* Falling Medicines Rain */
    .rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .medicine-drop {
      position: absolute;
      top: -90px;
      animation: slowRain linear infinite;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
    }

    @keyframes slowRain {
      0% { transform: translateY(-90px) rotate(0deg); opacity: 0; }
      12% { opacity: 0.85; }
      88% { opacity: 0.85; }
      100% { transform: translateY(112vh) rotate(360deg); opacity: 0; }
    }

    .app-wrapper {
      position: relative;
      z-index: 2;
      max-width: 720px;
      margin: 0 auto;
      padding: 15px;
    }

    /* Top Bar: Logo, Search, Real Profile Pic */
    .top-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(6, 43, 37, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 20px;
      padding: 10px 14px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .app-logo-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.95rem;
      color: #34d399;
      cursor: pointer;
    }

    .search-container {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(3, 20, 17, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 30px;
      padding: 8px 14px;
      color: #ffffff;
      font-size: 0.86rem;
      outline: none;
      transition: 0.3s;
    }

    .search-input:focus {
      border-color: #34d399;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
    }

    .profile-nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #34d399;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
      background: #021a15;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-nav-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Search Results */
    .search-results-box {
      display: none;
      background: rgba(6, 43, 37, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid rgba(52, 211, 153, 0.15);
    }

    .user-card:last-child {
      border-bottom: none;
    }

    .user-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar-sm {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #34d399;
      background: #031411;
    }

    .action-btns {
      display: flex;
      gap: 6px;
    }

    .btn-action {
      background: rgba(16, 185, 129, 0.25);
      border: 1px solid #34d399;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-action:hover {
      background: rgba(16, 185, 129, 0.45);
    }

    .btn-partner {
      background: rgba(245, 158, 11, 0.25);
      border: 1px solid #f59e0b;
      color: #fbbf24;
    }

    /* Cards */
    .glass-card {
      background: rgba(6, 43, 37, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 20px;
      padding: 20px 18px;
      margin-bottom: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(52, 211, 153, 0.2);
      padding-bottom: 8px;
    }

    .notice-item {
      background: rgba(3, 20, 17, 0.75);
      border: 1px solid rgba(52, 211, 153, 0.2);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .notice-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .notice-img-wrap {
      position: relative;
    }

    .notice-gallery img {
      width: 100%;
      height: 85px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(52, 211, 153, 0.3);
      cursor: pointer;
    }

    .img-dl-btn {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #34d399;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      text-decoration: none;
      border: 1px solid #34d399;
    }

    #createNoticePanel {
      display: none; /* Only visible to Developer/Teacher */
      margin-bottom: 20px;
    }

    .input-field-custom {
      width: 100%;
      background: rgba(3, 20, 17, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 10px;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 0.85rem;
      margin-bottom: 8px;
      outline: none;
    }

    /* Modal Overlay (Profile) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: rgba(6, 43, 37, 0.95);
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .modal-photo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #34d399;
      margin-bottom: 12px;
      background: #021a15;
    }

    .profile-field {
      text-align: left;
      background: rgba(3, 20, 17, 0.6);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      border: 1px solid rgba(52, 211, 153, 0.15);
    }

    .profile-field span {
      color: #34d399;
      font-weight: 600;
    }

    .modal-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.45);
      color: #ffffff;
    }

    /* Fixed Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 62px;
      background: rgba(3, 20, 17, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(52, 211, 153, 0.3);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      gap: 3px;
    }

    .nav-item.active, .nav-item:hover {
      color: #34d399;
    }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Falling Medicines Background Animation -->
  <div class="rain-container" id="rainContainer"></div>

  <div class="app-wrapper">
    <!-- Top Nav Bar -->
    <div class="top-navbar">
      <div class="app-logo-badge" onclick="window.location.reload()">
        <span>℞</span> D-PHARMA
      </div>
      <div class="search-container">
        <input type="text" id="userSearchInput" class="search-input" placeholder="Search registered students (Name/Enroll)..." />
      </div>
      <div class="profile-nav-btn" onclick="openProfileModal()">
        <img id="navProfilePic" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Profile" />
      </div>
    </div>

    <!-- Search Results View -->
    <div id="searchResultsBox" class="search-results-box">
      <div style="font-size: 0.8rem; color: #a7f3d0; margin-bottom: 8px;">ALL MATCHING USERS:</div>
      <div id="usersList"></div>
    </div>

    <!-- Protected Notice Creation Area (Visible ONLY to Developer & Teachers) -->
    <div id="createNoticePanel" class="glass-card">
      <h3 style="color:#34d399; font-size:1rem; margin-bottom:10px;">📢 Post Official Notice (Auto-Expires in 24h)</h3>
      <input type="text" id="noticeTitle" class="input-field-custom" placeholder="Notice Title / Topic..." />
      <textarea id="noticeContent" class="input-field-custom" rows="3" placeholder="Full notice description / notes..."></textarea>
      <input type="text" id="noticeLink" class="input-field-custom" placeholder="Optional external link (https://...)" />
      
      <label style="font-size:0.8rem; color:#a7f3d0; display:block; margin:6px 0 2px;">Attach Images (Max 10):</label>
      <input type="file" id="noticeImages" class="input-field-custom" accept="image/*" multiple />
      
      <button onclick="publishNotice()" id="btnPublishNotice" class="btn-action" style="width:100%; padding:10px; margin-top:6px; font-weight:700; justify-content:center;">Publish Notice</button>
    </div>

    <!-- Notice Board (Visible to EVERYONE) -->
    <div class="glass-card">
      <div class="board-header">
        <h2 style="font-size:1.1rem; color:#34d399; display:flex; align-items:center; gap:6px;">
          📌 D. PHARMA NOTICE BOARD
        </h2>
        <span style="font-size:0.75rem; color:#94a3b8;">Active (Last 24 Hours)</span>
      </div>
      <div id="noticesContainer">Loading official announcements...</div>
    </div>
  </div>

  <!-- Read-Only Profile View Modal with Logout -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-content">
      <img id="modalProfileImg" class="modal-photo" src="" alt="Profile" />
      <h3 id="modalName" style="margin-bottom: 4px;">Student Name</h3>
      <p id="modalRoleBadge" style="font-size: 0.75rem; color: #34d399; margin-bottom: 14px;">VERIFIED ID (READ ONLY)</p>
      
      <div class="profile-field"><span>Enrollment:</span> <span id="modalEnroll" style="color:#fff;">-</span></div>
      <div class="profile-field"><span>Email:</span> <span id="modalEmail" style="color:#fff;">-</span></div>
      <div class="profile-field"><span>Phone:</span> <span id="modalPhone" style="color:#fff;">-</span></div>

      <div class="modal-btn-row">
        <button onclick="closeProfileModal()" class="btn-action" style="flex:1; justify-content:center; padding:10px;">Close</button>
        <button onclick="logoutUser()" class="btn-logout">Log Out</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      HOME
    </div>
    <div class="nav-item" onclick="window.location.href='dpg.html'">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
      D.P.G
    </div>
    <div class="nav-item" onclick="window.location.href='chats.html'">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      CHATS
    </div>
  </div>

  <script>
    // 1. STRICT AUTH GUARD
    const isLoggedIn = localStorage.getItem('isLoggedIn');
    const loggedAccount = localStorage.getItem('userAccount');
    const loggedRole = localStorage.getItem('userRole') || 'student';
    const DEVELOPER_ID = "karanrathoure6271@gmail.com";

    if (isLoggedIn !== 'true' || !loggedAccount) {
      window.location.replace('login.html');
    }

    // 2. FIREBASE INITIALIZATION
    const firebaseConfig = {
      apiKey: "AIzaSyCQ2XpoeeKwVmIZ2wp8H3D2xzTY49nhxAI",
      authDomain: "d-pharma-class-group.firebaseapp.com",
      projectId: "d-pharma-class-group",
      storageBucket: "d-pharma-class-group.firebasestorage.app",
      messagingSenderId: "870561978483",
      appId: "1:870561978483:web:095681d6185f43cd6d7206",
      measurementId: "G-VQ12Y4NLRJ"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUserData = null;

    // 3. LOAD PROFILE & ACCESS CHECK
    async function initUserIdentity() {
      if (loggedAccount.toLowerCase() === DEVELOPER_ID.toLowerCase()) {
        currentUserData = {
          name: "Karan Rathoure (Dev)",
          email: DEVELOPER_ID,
          role: "developer",
          enroll: "DEV-ROOT",
          phone: "Verified Admin",
          photo: ""
        };
        document.getElementById('createNoticePanel').style.display = 'block';
      } else {
        const snapshot = await db.collection('students').where('email', '==', loggedAccount.toLowerCase()).get();
        if (!snapshot.empty) {
          currentUserData = snapshot.docs[0].data();
          currentUserData.id = snapshot.docs[0].id;
          
          if (currentUserData.photo) {
            document.getElementById('navProfilePic').src = currentUserData.photo;
            document.getElementById('modalProfileImg').src = currentUserData.photo;
          }
          if (currentUserData.role === 'teacher' || loggedRole === 'teacher') {
            document.getElementById('createNoticePanel').style.display = 'block';
          }
        } else if (loggedRole === 'teacher') {
          document.getElementById('createNoticePanel').style.display = 'block';
        }
      }
    }
    initUserIdentity();

    // 4. GLOBAL SEARCH FOR REGISTERED USERS
    const searchInput = document.getElementById('userSearchInput');
    const searchResultsBox = document.getElementById('searchResultsBox');
    const usersList = document.getElementById('usersList');

    searchInput.addEventListener('input', async (e) => {
      const query = e.target.value.trim().toLowerCase();
      if (query.length < 1) {
        searchResultsBox.style.display = 'none';
        return;
      }

      const snapshot = await db.collection('students').get();
      usersList.innerHTML = '';
      let matches = 0;

      snapshot.forEach((doc) => {
        const data = doc.data();
        const name = (data.name || '').toLowerCase();
        const enroll = (data.enroll || '').toLowerCase();

        if (name.includes(query) || enroll.includes(query)) {
          matches++;
          const card = document.createElement('div');
          card.className = 'user-card';

          const photo = data.photo || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

          const isDev = loggedAccount.toLowerCase() === DEVELOPER_ID.toLowerCase();
          let partnerBtn = '';
          if (isDev) {
            partnerBtn = `<button class="btn-action btn-partner" onclick="toggleMainPartner('${doc.id}', ${!data.isMainPartner})">
              ${data.isMainPartner ? 'Revoke Partner' : '★ Make Main Partner'}
            </button>`;
          }

          card.innerHTML = `
            <div class="user-info-left">
              <img class="user-avatar-sm" src="${photo}" alt="Student Photo" />
              <div>
                <strong style="font-size:0.88rem;">${data.name}</strong>
              </div>
            </div>
            <div class="action-btns">
              <button class="btn-action" onclick="sendChatRequest('${doc.id}', '${data.name}')">Chat Request</button>
              ${partnerBtn}
            </div>
          `;
          usersList.appendChild(card);
        }
      });

      searchResultsBox.style.display = matches > 0 ? 'block' : 'none';
    });

    async function sendChatRequest(targetUserId, targetName) {
      const isSpecial = loggedAccount.toLowerCase() === DEVELOPER_ID.toLowerCase() || (currentUserData && currentUserData.isMainPartner);
      if (isSpecial) {
        window.location.href = `chats.html?to=${targetUserId}`;
      } else {
        await db.collection('chatRequests').add({
          from: loggedAccount,
          toId: targetUserId,
          toName: targetName,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert(`Chat request sent to ${targetName}!`);
      }
    }

    async function toggleMainPartner(docId, status) {
      if (loggedAccount.toLowerCase() !== DEVELOPER_ID.toLowerCase()) return;
      await db.collection('students').doc(docId).update({ isMainPartner: status });
      alert(`User partner status changed to: ${status}`);
    }

    // 5. NOTICE PUBLISHING & 24-HOUR AUTO-EXPIRY LOGIC
    async function publishNotice() {
      const isAllowed = loggedAccount.toLowerCase() === DEVELOPER_ID.toLowerCase() || loggedRole === 'teacher';
      if (!isAllowed) {
        alert("Unauthorized! Only Verified Teachers & Developers can publish notices.");
        return;
      }

      const title = document.getElementById('noticeTitle').value.trim();
      const content = document.getElementById('noticeContent').value.trim();
      const link = document.getElementById('noticeLink').value.trim();
      const files = document.getElementById('noticeImages').files;
      const btn = document.getElementById('btnPublishNotice');

      if (!title || !content) {
        alert("Please enter Title and Description.");
        return;
      }

      if (files.length > 10) {
        alert("Limit reached: Only 10 images allowed!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Publishing to Board...";

      try {
        const compressedImages = [];
        for (let i = 0; i < files.length; i++) {
          const b64 = await toBase64Compressed(files[i]);
          compressedImages.push(b64);
        }

        const now = new Date();
        const expiresAt = new Date(now.getTime() + 24 * 60 * 60 * 1000);

        await db.collection('notices').add({
          title,
          content,
          link,
          images: compressedImages,
          postedBy: currentUserData ? currentUserData.name : 'Authority',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          expiresAt: firebase.firestore.Timestamp.fromDate(expiresAt)
        });

        alert("Notice published successfully! It is now live for all users.");
        document.getElementById('noticeTitle').value = '';
        document.getElementById('noticeContent').value = '';
        document.getElementById('noticeLink').value = '';
        document.getElementById('noticeImages').value = '';
      } catch (err) {
        alert("Error publishing notice: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Publish Notice";
      }
    }

    function toBase64Compressed(file) {
      return new Promise((res) => {
        const r = new FileReader();
        r.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const max = 700;
            let w = img.width, h = img.height;
            if (w > h && w > max) { h *= max / w; w = max; }
            else if (h > max) { w *= max / h; h = max; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            res(canvas.toDataURL('image/jpeg', 0.65));
          };
          img.src = e.target.result;
        };
        r.readAsDataURL(file);
      });
    }

    // REALTIME LOAD ALL NOTICES FOR EVERY USER
    function loadActiveNotices() {
      db.collection('notices').orderBy('createdAt', 'desc').onSnapshot((snap) => {
        const container = document.getElementById('noticesContainer');
        const currentTime = new Date().getTime();
        let count = 0;
        container.innerHTML = '';

        snap.forEach((doc) => {
          const n = doc.data();
          
          // Auto filter: Check if 24 hours have passed
          if (n.expiresAt) {
            const expTime = n.expiresAt.toDate().getTime();
            if (currentTime > expTime) return; // Expired, skip display
          }

          count++;
          const item = document.createElement('div');
          item.className = 'notice-item';

          let galleryHtml = '';
          if (n.images && n.images.length > 0) {
            galleryHtml = '<div class="notice-gallery">' + 
              n.images.map((img, idx) => `
                <div class="notice-img-wrap">
                  <img src="${img}" alt="Notice" onclick="window.open('${img}')" />
                  <a href="${img}" download="Notice_Doc_${idx+1}.jpg" class="img-dl-btn">⬇ Save</a>
                </div>
              `).join('') + 
            '</div>';
          }

          let linkHtml = n.link ? `<div style="margin-top:6px;"><a href="${n.link}" target="_blank" style="color:#38bdf8; font-size:0.8rem;">🔗 Open Attached Link</a></div>` : '';

          item.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h4 style="color:#34d399; font-size:0.95rem;">${n.title}</h4>
              <span style="font-size:0.7rem; color:#6ee7b7;">By: ${n.postedBy || 'Admin'}</span>
            </div>
            <p style="font-size:0.84rem; color:#cbd5e1; margin-top:6px; white-space:pre-wrap;">${n.content}</p>
            ${galleryHtml}
            ${linkHtml}
          `;
          container.appendChild(item);
        });

        if (count === 0) {
          container.innerHTML = "<p style='color:#94a3b8; font-size:0.85rem;'>No active notices in the last 24 hours.</p>";
        }
      }, (err) => {
        console.error("Notice fetch error:", err);
      });
    }
    loadActiveNotices();

    // 6. READ-ONLY PROFILE MODAL & LOGOUT
    function openProfileModal() {
      if (!currentUserData) return;
      document.getElementById('modalName').innerText = currentUserData.name || 'Student';
      document.getElementById('modalEnroll').innerText = currentUserData.enroll || 'N/A';
      document.getElementById('modalEmail').innerText = currentUserData.email || 'N/A';
      document.getElementById('modalPhone').innerText = currentUserData.phone || 'N/A';
      if (currentUserData.photo) {
        document.getElementById('modalProfileImg').src = currentUserData.photo;
      }
      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() {
      document.getElementById('profileModal').style.display = 'none';
    }

    function logoutUser() {
      localStorage.clear();
      sessionStorage.clear();
      window.location.replace('login.html');
    }

    // 7. MEDICINE RAIN ANIMATION
    const colorfulMedicines = [
      `<svg viewBox="0 0 32 32"><g transform="rotate(-30 16 16)"><path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#ef4444" opacity="0.65"/><path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#ffffff" opacity="0.65"/><rect x="9.5" y="15" width="13" height="2" fill="#b91c1c" opacity="0.6" rx="1"/></g></svg>`,
      `<svg viewBox="0 0 32 32"><g transform="rotate(25 16 16)"><path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#0f172a" opacity="0.75"/><path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#10b981" opacity="0.7"/><rect x="9.5" y="15" width="13" height="2" fill="#34d399" opacity="0.7" rx="1"/></g></svg>`,
      `<svg viewBox="0 0 32 32"><path d="M16 26 s-9-5.5-9-12 a5.5 5.5 0 0 1 10-3.2 a5.5 5.5 0 0 1 10 3.2 c0 6.5-9 12-9 12 z" fill="#f43f5e" opacity="0.55" stroke="#fda4af" stroke-width="1.2"/></svg>`,
      `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="#0ea5e9" opacity="0.5" stroke="#38bdf8" stroke-width="1.5"/><line x1="8" y1="16" x2="24" y2="16" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8"/></svg>`,
      `<svg viewBox="0 0 32 32"><rect x="13" y="3" width="6" height="3" fill="#ffffff" opacity="0.8" rx="1"/><path d="M10 9 C8.5 9 8 10 8 11.5 V25 C8 26.5 9.5 28 11 28 H21 C22.5 28 24 26.5 24 25 V11.5 C24 10 23.5 9 22 9 Z" fill="#0284c7" opacity="0.45" stroke="#38bdf8" stroke-width="1.2"/></svg>`
    ];

    const rainContainer = document.getElementById('rainContainer');
    for (let i = 0; i < 28; i++) {
      const drop = document.createElement('div');
      drop.className = 'medicine-drop';
      drop.innerHTML = colorfulMedicines[Math.floor(Math.random() * colorfulMedicines.length)];
      const size = Math.floor(Math.random() * 24) + 26;
      drop.style.width = size + 'px';
      drop.style.height = size + 'px';
      drop.style.left = Math.random() * 95 + '%';
      drop.style.animationDuration = (Math.random() * 8 + 12) + 's';
      drop.style.animationDelay = '-' + (Math.random() * 12) + 's';
      rainContainer.appendChild(drop);
    }
  </script>
</body>
</html>
