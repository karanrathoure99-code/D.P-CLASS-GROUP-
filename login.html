<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D Pharma Portal - Login</title>
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #05241f 0%, #020f0d 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Falling Medicines Rain */
    .rain-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .medicine-drop {
      position: absolute;
      top: -90px;
      animation: slowRain linear infinite;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
    }

    @keyframes slowRain {
      0% {
        transform: translateY(-90px) rotate(0deg);
        opacity: 0;
      }
      12% {
        opacity: 0.85;
      }
      88% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(112vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Glassmorphism Login Card */
    .login-card {
      background: rgba(6, 43, 37, 0.68);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 28px;
      padding: 35px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 25px rgba(16, 185, 129, 0.18);
      position: relative;
      z-index: 2;
      transition: transform 0.3s ease;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .rx-tag {
      display: inline-block;
      color: #34d399;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.35);
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 1.65rem;
      font-weight: 800;
      background: linear-gradient(90deg, #34d399, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #a7f3d0;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-field {
      width: 100%;
      background: rgba(3, 20, 17, 0.8);
      border: 1px solid rgba(52, 211, 153, 0.28);
      border-radius: 14px;
      padding: 13px 16px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: #34d399;
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
      background: rgba(6, 43, 37, 0.9);
    }

    /* इनपुट एरर शेक क्लास */
    .input-field.input-error {
      border-color: #ef4444 !important;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.45) !important;
      animation: fieldShake 0.35s ease-in-out;
    }

    @keyframes fieldShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .error-msg {
      display: none;
      color: #f87171;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.45);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .glass-btn {
      width: 100%;
      background: rgba(16, 185, 129, 0.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(52, 211, 153, 0.65);
      border-radius: 14px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.28);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 6px;
    }

    .glass-btn:hover {
      background: rgba(16, 185, 129, 0.5);
      border-color: #34d399;
      box-shadow: 0 12px 35px rgba(16, 185, 129, 0.5);
      transform: translateY(-2px);
    }

    .glass-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .about-link-container {
      text-align: center;
      margin-top: 18px;
    }

    .about-btn-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #22d3ee;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.3);
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .about-btn-link:hover {
      background: rgba(34, 211, 238, 0.22);
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.3);
      transform: translateY(-1px);
    }

    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 18px;
    }

    /* ========================================== */
    /* एनिमेटेड इन-ऐप नोटिफिकेशन (Toast Popup)    */
    /* ========================================== */
    .top-toast-alert {
      position: fixed;
      top: -130px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(10, 28, 24, 0.96);
      border: 1.5px solid #ef4444;
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75), 0 0 25px rgba(239, 68, 68, 0.35);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 99999;
      pointer-events: none;
      transition: top 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .top-toast-alert.active {
      top: 25px;
      pointer-events: auto;
      animation: dropVibrate 0.45s ease-in-out;
    }

    .toast-inner-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toast-bell-icon {
      font-size: 1.6rem;
      filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6));
    }

    .toast-texts h4 {
      font-size: 0.95rem;
      color: #f87171;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .toast-texts p {
      font-size: 0.82rem;
      color: #e2e8f0;
      margin-top: 2px;
    }

    @keyframes dropVibrate {
      0% { transform: translate(-50%, -10px); }
      30% { transform: translate(calc(-50% - 6px), 0); }
      50% { transform: translate(calc(-50% + 6px), 0); }
      70% { transform: translate(calc(-50% - 3px), 0); }
      100% { transform: translate(-50%, 0); }
    }
  </style>

  <!-- Firebase App, Auth & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body oncontextmenu="return false;">

  <!-- टॉप इन-ऐप नोटिफिकेशन बैनर -->
  <div id="toastNotification" class="top-toast-alert">
    <div class="toast-inner-box">
      <span class="toast-bell-icon">🔔</span>
      <div class="toast-texts">
        <h4>Authentication Alert</h4>
        <p id="toastBodyText">Please re-enter your right details!</p>
      </div>
    </div>
  </div>

  <!-- Falling Medicine Animation Container -->
  <div class="rain-container" id="rainContainer"></div>

  <div class="login-card">
    <div class="brand-header">
      <span class="rx-tag">℞ PHARMACY VAULT</span>
      <h1 class="brand-title">D Pharma Login</h1>
      <p class="brand-subtitle">Student & Developer Secure Authentication</p>
    </div>

    <!-- Error Message with Emoji -->
    <div class="error-msg" id="errorMsg">❌ 🔐 Wrong Password or ID! Please try again. 💊</div>

    <form id="loginForm">
      <div class="input-group">
        <label for="userIdentifier">Enrollment No. / Gmail / Phone</label>
        <input 
          type="text" 
          id="userIdentifier" 
          class="input-field" 
          placeholder="Enrollment, Gmail, or Dev ID" 
          required 
        />
      </div>

      <div class="input-group">
        <label for="userPassword">Password</label>
        <input 
          type="password" 
          id="userPassword" 
          class="input-field" 
          placeholder="••••••••" 
          required 
        />
      </div>

      <button type="submit" id="loginBtn" class="glass-btn">Log In</button>
    </form>

    <!-- About Page Link -->
    <div class="about-link-container">
      <a href="about.html" class="about-btn-link">📖 About D Pharma Hub</a>
    </div>

    <div class="security-badge">
      <span>🔒</span> E2E Verified & Cloud Secured
    </div>
  </div>

  <script>
    // ==========================================
    // SECURITY GUARDS (Anti-Inspect / F12 Block)
    // ==========================================
    document.addEventListener('keydown', function (e) {
      if (
        e.keyCode === 123 ||
        (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
        (e.ctrlKey && e.keyCode === 85)
      ) {
        e.preventDefault();
        return false;
      }
    });

    // Debugger Loop Trap
    setInterval(function () {
      (function () { return false; }['constructor']('debugger')['call']());
    }, 1000);

    // ==========================================
    // 0. सिस्टम नोटिफिकेशन परमिशन
    // ==========================================
    window.addEventListener('load', () => {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    });

    // ==========================================
    // आईफ़ोन स्टाइल साउंड और हैप्टिक फ़ीडबैक
    // ==========================================
    let audioCtx = null;

    function playIPhoneClickSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.type = 'sine';
        // iPhone Taptic इंजन जैसा क्रिस्प लो-पिच टैप साउंड
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.07);

        gainNode.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.07);
      } catch (e) {
        console.log("Audio not allowed yet:", e);
      }
    }

    function triggerIPhoneHaptic() {
      if ('vibrate' in navigator) {
        // iPhone जैसा अल्ट्रा-शॉर्ट 12ms क्रिस्प टैप
        navigator.vibrate(12);
      }
    }

    let toastDismissTimer;

    // 3-चरणीय एरर हैंडलर फ़ंक्शन
    function triggerThreeStepError(boxMessage, notificationMessage = "Please re-enter your right details!") {
      const errorMsg = document.getElementById('errorMsg');
      const userInput = document.getElementById('userIdentifier');
      const passInput = document.getElementById('userPassword');
      const toast = document.getElementById('toastNotification');
      const toastBody = document.getElementById('toastBodyText');

      // 🔊 तुरंत आईफ़ोन स्टाइल साउंड और अल्ट्रा-शॉर्ट हैप्टिक वाइब्रेशन
      playIPhoneClickSound();
      triggerIPhoneHaptic();

      // स्टेप 1: उसी जगह तुरंत एरर दिखाना + इनपुट शेक
      errorMsg.innerHTML = boxMessage;
      errorMsg.style.display = 'block';

      userInput.classList.add('input-error');
      passInput.classList.add('input-error');
      setTimeout(() => {
        userInput.classList.remove('input-error');
        passInput.classList.remove('input-error');
      }, 500);

      // स्टेप 2: 0.6 सेकंड बाद स्क्रीन पर एनीमेशन टोस्ट आना
      setTimeout(() => {
        if (toast) {
          toastBody.innerText = notificationMessage;
          toast.classList.add('active');

          // टोस्ट ड्रॉप होते समय भी एक हल्का सा आईफ़ोन माइक्रोटैप
          triggerIPhoneHaptic();

          clearTimeout(toastDismissTimer);
          toastDismissTimer = setTimeout(() => {
            toast.classList.remove('active');
          }, 4000);
        }
      }, 600);

      // स्टेप 3: 1.5 सेकंड बाद असली फ़ोन/पीसी का सिस्टम नोटिफिकेशन ट्रिगर होना
      setTimeout(() => {
        if ('Notification' in window && Notification.permission === 'granted') {
          const options = {
            body: notificationMessage,
            icon: './logo.png',
            badge: './logo.png',
            vibrate: [15, 60, 15] // क्रिस्प डबल-टैप वाइब्रेशन
          };

          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            navigator.serviceWorker.ready.then(reg => reg.showNotification("D.Pharma Portal Alert", options));
          } else {
            new Notification("D.Pharma Portal Alert", options);
          }
        }
      }, 1500);
    }

    // 1. Firebase Initialization
    const firebaseConfig = {
      apiKey: "AIzaSyCQ2XpoeeKwVmIZ2wp8H3D2xzTY49nhxAI",
      authDomain: "d-pharma-class-group.firebaseapp.com",
      projectId: "d-pharma-class-group",
      storageBucket: "d-pharma-class-group.firebasestorage.app",
      messagingSenderId: "870561978483",
      appId: "1:870561978483:web:095681d6185f43cd6d7206",
      measurementId: "G-VQ12Y4NLRJ"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 2. High-Quality Colorful Transparent Medicines
    const colorfulMedicines = [
      `<svg viewBox="0 0 32 32">
        <g transform="rotate(-30 16 16)">
          <path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#ef4444" opacity="0.65" />
          <path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#ffffff" opacity="0.65" />
          <rect x="9.5" y="15" width="13" height="2" fill="#b91c1c" opacity="0.6" rx="1" />
        </g>
      </svg>`,
      `<svg viewBox="0 0 32 32">
        <g transform="rotate(25 16 16)">
          <path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#0f172a" opacity="0.75" />
          <path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#10b981" opacity="0.7" />
          <rect x="9.5" y="15" width="13" height="2" fill="#34d399" opacity="0.7" rx="1" />
        </g>
      </svg>`,
      `<svg viewBox="0 0 32 32">
        <path d="M16 26 s-9-5.5-9-12 a5.5 5.5 0 0 1 10-3.2 a5.5 5.5 0 0 1 10 3.2 c0 6.5-9 12-9 12 z" fill="#f43f5e" opacity="0.55" stroke="#fda4af" stroke-width="1.2" />
      </svg>`,
      `<svg viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="11" fill="#0ea5e9" opacity="0.5" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="8" y1="16" x2="24" y2="16" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8" />
      </svg>`,
      `<svg viewBox="0 0 32 32">
        <rect x="13" y="3" width="6" height="3" fill="#ffffff" opacity="0.8" rx="1" />
        <path d="M10 9 C8.5 9 8 10 8 11.5 V25 C8 26.5 9.5 28 11 28 H21 C22.5 28 24 26.5 24 25 V11.5 C24 10 23.5 9 22 9 Z" fill="#0284c7" opacity="0.45" stroke="#38bdf8" stroke-width="1.2" />
      </svg>`
    ];

    const container = document.getElementById('rainContainer');
    for (let i = 0; i < 28; i++) {
      const drop = document.createElement('div');
      drop.className = 'medicine-drop';
      drop.innerHTML = colorfulMedicines[Math.floor(Math.random() * colorfulMedicines.length)];
      const size = Math.floor(Math.random() * 24) + 26;
      drop.style.width = size + 'px';
      drop.style.height = size + 'px';
      drop.style.left = Math.random() * 95 + '%';
      drop.style.animationDuration = (Math.random() * 8 + 12) + 's';
      drop.style.animationDelay = '-' + (Math.random() * 12) + 's';
      container.appendChild(drop);
    }

    // 3. Developer Master Credentials
    const DEVELOPER_ID = "karanrathoure6271@gmail.com";
    const DEVELOPER_PASS = "KARAN#255075@";

    // 4. Form Authentication
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const identifier = document.getElementById('userIdentifier').value.trim();
      const password = document.getElementById('userPassword').value;
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');

      errorMsg.style.display = 'none';

      // (A) Developer Login
      if (identifier.toLowerCase() === DEVELOPER_ID.toLowerCase()) {
        if (password === DEVELOPER_PASS) {
          loginBtn.disabled = true;
          loginBtn.innerText = "Authenticating Developer...";
          try {
            try {
              await auth.signInWithEmailAndPassword(DEVELOPER_ID, DEVELOPER_PASS);
            } catch (authErr) {
              if (authErr.code === 'auth/user-not-found') {
                await auth.createUserWithEmailAndPassword(DEVELOPER_ID, DEVELOPER_PASS);
              } else {
                throw authErr;
              }
            }

            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userRole', 'developer');
            localStorage.setItem('userAccount', DEVELOPER_ID);
            window.location.replace('create.html');
            return;
          } catch (devErr) {
            console.error("Developer Auth Error:", devErr);
            triggerThreeStepError(
              `❌ 🔐 <b>Developer Auth Failed:</b> ${devErr.message}`,
              "Please re-enter your right details!"
            );
            loginBtn.disabled = false;
            loginBtn.innerText = "Log In";
            return;
          }
        } else {
          triggerThreeStepError(
            "❌ 🔐 <b>Wrong Password!</b> Developer access denied. 🛑",
            "Please re-enter your right details!"
          );
          return;
        }
      }

      // (B) Student Secure Login
      loginBtn.disabled = true;
      loginBtn.innerText = "Authenticating...";

      try {
        let targetEmail = "";
        let studentData = null;

        // If identifier is directly an email
        if (identifier.includes("@")) {
          targetEmail = identifier.toLowerCase();
        } else {
          // Resolve Email by Enrollment or Phone
          let snap = await db.collection("students")
            .where("enroll", "==", identifier.toUpperCase())
            .get();

          if (snap.empty) {
            snap = await db.collection("students")
              .where("phone", "==", identifier)
              .get();
          }

          if (!snap.empty) {
            studentData = snap.docs[0].data();
            targetEmail = studentData.email ? studentData.email.toLowerCase() : "";
          }
        }

        if (!targetEmail) {
          triggerThreeStepError(
            "❌ 👤 <b>Student ID not registered!</b> Contact class developer. 🚫",
            "Please re-enter your right details!"
          );
          loginBtn.disabled = false;
          loginBtn.innerText = "Log In";
          return;
        }

        // Firebase Auth Verification
        const userCredential = await auth.signInWithEmailAndPassword(targetEmail, password);
        const user = userCredential.user;

        // Fetch profile details if not already fetched
        if (!studentData) {
          const docSnap = await db.collection("students").doc(user.uid).get();
          if (docSnap.exists) {
            studentData = docSnap.data();
          } else {
            const querySnap = await db.collection("students").where("email", "==", targetEmail).get();
            if (!querySnap.empty) {
              studentData = querySnap.docs[0].data();
            }
          }
        }

        // Persist session
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userRole', 'student');
        localStorage.setItem('userAccount', targetEmail);
        localStorage.setItem('studentName', studentData ? studentData.name : targetEmail);
        localStorage.setItem('studentEnroll', studentData ? studentData.enroll : '');
        localStorage.setItem('studentPhoto', studentData ? (studentData.photo || '') : '');

        window.location.replace('home.html');
      } catch (err) {
        console.error("Auth error:", err);
        let errorBoxText = "";
        
        if (err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential' || err.code === 'auth/invalid-login-credentials') {
          errorBoxText = "❌ 🔐 <b>Wrong Password or ID!</b> Please check and re-enter. 💊";
        } else if (err.code === 'auth/network-request-failed') {
          errorBoxText = "⚠️ 🌐 <b>Network error!</b> Please check your internet connection. 📡";
        } else {
          errorBoxText = `⚠️ 🌐 <b>Authentication error!</b> (${err.message}) 📡`;
        }

        // 3-चरणीय फ़्लो ट्रिगर करें
        triggerThreeStepError(errorBoxText, "Please re-enter your right details!");
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = "Log In";
      }
    });

    // 5. Double-Click Fullscreen API
    document.addEventListener('dblclick', (e) => {
      if (['INPUT', 'BUTTON', 'A'].includes(e.target.tagName)) return;
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
