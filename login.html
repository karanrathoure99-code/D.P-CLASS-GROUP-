<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D Pharma Portal - Login</title>
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #05241f 0%, #020f0d 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Falling Medicines Rain */
    .rain-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .medicine-drop {
      position: absolute;
      top: -90px;
      animation: slowRain linear infinite;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
    }

    @keyframes slowRain {
      0% {
        transform: translateY(-90px) rotate(0deg);
        opacity: 0;
      }
      12% {
        opacity: 0.85;
      }
      88% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(112vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Glassmorphism Login Card */
    .login-card {
      background: rgba(6, 43, 37, 0.68);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 28px;
      padding: 28px 26px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 25px rgba(16, 185, 129, 0.18);
      position: relative;
      z-index: 2;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 20px;
    }

    /* Resized Logo Wrapper (~22% smaller) */
    .logo-wrapper {
      width: 74px;
      height: 74px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.85), rgba(13, 148, 136, 0.95));
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.38), inset 0 0 12px rgba(255, 255, 255, 0.3);
      margin-bottom: 14px;
      animation: bounceIn 1.3s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards, pulseGreen 2.5s infinite ease-in-out;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      fill: #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.3) rotate(-20deg); }
      60% { opacity: 1; transform: scale(1.1) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes pulseGreen {
      0%, 100% { box-shadow: 0 10px 24px rgba(16, 185, 129, 0.4), 0 0 16px rgba(13, 148, 136, 0.2); }
      50% { box-shadow: 0 15px 36px rgba(16, 185, 129, 0.65), 0 0 28px rgba(34, 211, 238, 0.4); }
    }

    .rx-tag {
      display: inline-block;
      color: #34d399;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.35);
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 1.55rem;
      font-weight: 800;
      background: linear-gradient(90deg, #34d399, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #a7f3d0;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-field {
      width: 100%;
      background: rgba(3, 20, 17, 0.8);
      border: 1px solid rgba(52, 211, 153, 0.28);
      border-radius: 14px;
      padding: 13px 16px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: #34d399;
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
      background: rgba(6, 43, 37, 0.9);
    }

    /* Error Shake on Input */
    .input-field.input-error {
      border-color: #ef4444 !important;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.45) !important;
      animation: fieldShake 0.35s ease-in-out;
    }

    @keyframes fieldShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .glass-btn {
      width: 100%;
      background: rgba(16, 185, 129, 0.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(52, 211, 153, 0.65);
      border-radius: 14px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.28);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 6px;
    }

    .glass-btn:hover {
      background: rgba(16, 185, 129, 0.5);
      border-color: #34d399;
      box-shadow: 0 12px 35px rgba(16, 185, 129, 0.5);
      transform: translateY(-2px);
    }

    .glass-btn:active {
      transform: scale(0.97);
    }

    .glass-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .about-link-container {
      text-align: center;
      margin-top: 18px;
    }

    .about-btn-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #22d3ee;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.3);
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .about-btn-link:hover {
      background: rgba(34, 211, 238, 0.22);
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.3);
      transform: translateY(-1px);
    }

    .about-btn-link:active {
      transform: scale(0.96);
    }

    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 18px;
    }

    /* Top Animated Toast for wrong login attempt */
    .top-toast-alert {
      position: fixed;
      top: -130px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(10, 28, 24, 0.96);
      border: 1.5px solid #ef4444;
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75), 0 0 25px rgba(239, 68, 68, 0.35);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 99999;
      pointer-events: none;
      transition: top 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .top-toast-alert.active {
      top: 25px;
      pointer-events: auto;
      animation: dropVibrate 0.45s ease-in-out;
    }

    .toast-inner-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toast-bell-icon {
      font-size: 1.6rem;
      filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6));
    }

    .toast-texts h4 {
      font-size: 0.95rem;
      color: #f87171;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .toast-texts p {
      font-size: 0.82rem;
      color: #e2e8f0;
      margin-top: 2px;
    }

    @keyframes dropVibrate {
      0% { transform: translate(-50%, -10px); }
      30% { transform: translate(calc(-50% - 6px), 0); }
      50% { transform: translate(calc(-50% + 6px), 0); }
      70% { transform: translate(calc(-50% - 3px), 0); }
      100% { transform: translate(-50%, 0); }
    }
  </style>

  <!-- Firebase App, Auth & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- EmailJS Browser SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body oncontextmenu="return false;">

  <!-- Top Toast Alert (Failure Only) -->
  <div id="toastNotification" class="top-toast-alert">
    <div class="toast-inner-box">
      <span class="toast-bell-icon">🔔</span>
      <div class="toast-texts">
        <h4>Authentication Alert</h4>
        <p id="toastBodyText">Please re-enter your right details!</p>
      </div>
    </div>
  </div>

  <!-- Falling Medicine Animation Container -->
  <div class="rain-container" id="rainContainer"></div>

  <div class="login-card">
    <div class="brand-header">
      <!-- Resized Logo Wrapper -->
      <div class="logo-wrapper">
        <svg class="logo-icon" viewBox="0 0 24 24">
          <path d="M21 7.2l-2.1-2.1c-.4-.4-1-.4-1.4 0l-3.3 3.3c-1.3-.6-2.7-.9-4.2-.9-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8c0-1.5-.3-2.9-.9-4.2l3.3-3.3c.4-.4.4-1 0-1.4l-1.4-.4zM12 20c-3.3 0-6-2.7-6-6s2.7-6 6-6c1.1 0 2.2.3 3.1.8l-1.9 1.9c-.4.4-.4 1 0 1.4s1 .4 1.4 0l2.6-2.6c.5.9.8 2 .8 3.5 0 3.3-2.7 6-6 6zm-1-9h2v2h-2zm-3 3h8v2H8zm2 3h4v2h-4z"/>
        </svg>
      </div>

      <span class="rx-tag">℞ PHARMACY VAULT</span>
      <h1 class="brand-title">D Pharma Login</h1>
      <p class="brand-subtitle">Student & Developer Secure Authentication</p>
    </div>

    <!-- Clean Input Form -->
    <form id="loginForm">
      <div class="input-group">
        <label for="userIdentifier">Enrollment No. / Gmail / Phone</label>
        <input 
          type="text" 
          id="userIdentifier" 
          class="input-field" 
          placeholder="Enrollment, Gmail, or Dev ID" 
          required 
        />
      </div>

      <div class="input-group">
        <label for="userPassword">Password</label>
        <input 
          type="password" 
          id="userPassword" 
          class="input-field" 
          placeholder="••••••••" 
          required 
        />
      </div>

      <button type="submit" id="loginBtn" class="glass-btn">Log In</button>
    </form>

    <!-- About Page Link -->
    <div class="about-link-container">
      <a href="about.html" id="aboutBtn" class="about-btn-link">📖 About D Pharma Hub</a>
    </div>

    <div class="security-badge">
      <span>🔒</span> E2E Verified & Cloud Secured
    </div>
  </div>

  <script>
    // ==========================================
    // EmailJS Initialized with User Public Key
    // ==========================================
    (function() {
      emailjs.init("sndo4my0KbtJNNZYC");
    })();

    const EMAILJS_SERVICE_ID = "service_lvy3wv7";
    const EMAILJS_TEMPLATE_ID = "template_eqhw8mx";

    // Send Security Alert to the Logged-in User
    async function sendLoginAlertEmail(userEmail, userName) {
      try {
        const loginTime = new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" });
        const deviceInfo = navigator.userAgent;

        const templateParams = {
          to_email: userEmail,
          to_name: userName || "Student",
          login_time: loginTime,
          device_info: deviceInfo
        };

        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
        console.log("Real-time security alert sent to:", userEmail);
      } catch (err) {
        console.error("EmailJS Security Alert Failed:", err);
      }
    }

    // ==========================================
    // Security Guards (Anti-Inspect / F12 Block)
    // ==========================================
    document.addEventListener('keydown', function (e) {
      if (
        e.keyCode === 123 ||
        (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) ||
        (e.ctrlKey && e.keyCode === 85)
      ) {
        e.preventDefault();
        return false;
      }
    });

    setInterval(function () {
      (function () { return false; }['constructor']('debugger')['call']());
    }, 1000);

    // ==========================================
    // iPhone Haptics & Sounds (Web Audio API)
    // ==========================================
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function triggerIPhoneHaptic() {
      if ('vibrate' in navigator) {
        navigator.vibrate(12);
      }
    }

    function playTapSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.05);

        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch (e) {}
    }

    // Two-tone Low Pitch Alert Sound (iPhone Battery Low style)
    function playLowBatterySound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        // Note 1: 440Hz
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(440, now);
        gain1.gain.setValueAtTime(0.35, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.12);

        // Note 2: 330Hz (Drop Note)
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(330, now + 0.14);
        gain2.gain.setValueAtTime(0.35, now + 0.14);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.14);
        osc2.stop(now + 0.3);
      } catch (e) {}
    }

    // Tap on About Button
    document.getElementById('aboutBtn').addEventListener('click', () => {
      triggerIPhoneHaptic();
      playTapSound();
    });

    let toastDismissTimer;

    // Failure Handler: Shows Toast & Plays Low Battery Sound
    function triggerFailureAlert(notificationMessage = "Please re-enter your right details!") {
      const userInput = document.getElementById('userIdentifier');
      const passInput = document.getElementById('userPassword');
      const toast = document.getElementById('toastNotification');
      const toastBody = document.getElementById('toastBodyText');

      playLowBatterySound();
      triggerIPhoneHaptic();

      userInput.classList.add('input-error');
      passInput.classList.add('input-error');
      setTimeout(() => {
        userInput.classList.remove('input-error');
        passInput.classList.remove('input-error');
      }, 500);

      if (toast) {
        toastBody.innerText = notificationMessage;
        toast.classList.add('active');

        clearTimeout(toastDismissTimer);
        toastDismissTimer = setTimeout(() => {
          toast.classList.remove('active');
        }, 4000);
      }
    }

    // Firebase Initialization
    const firebaseConfig = {
      apiKey: "AIzaSyCQ2XpoeeKwVmIZ2wp8H3D2xzTY49nhxAI",
      authDomain: "d-pharma-class-group.firebaseapp.com",
      projectId: "d-pharma-class-group",
      storageBucket: "d-pharma-class-group.firebasestorage.app",
      messagingSenderId: "870561978483",
      appId: "1:870561978483:web:095681d6185f43cd6d7206",
      measurementId: "G-VQ12Y4NLRJ"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Falling Medicine Rain Animation
    const colorfulMedicines = [
      `<svg viewBox="0 0 32 32">
        <g transform="rotate(-30 16 16)">
          <path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#ef4444" opacity="0.65" />
          <path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#ffffff" opacity="0.65" />
          <rect x="9.5" y="15" width="13" height="2" fill="#b91c1c" opacity="0.6" rx="1" />
        </g>
      </svg>`,
      `<svg viewBox="0 0 32 32">
        <g transform="rotate(25 16 16)">
          <path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#0f172a" opacity="0.75" />
          <path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#10b981" opacity="0.7" />
          <rect x="9.5" y="15" width="13" height="2" fill="#34d399" opacity="0.7" rx="1" />
        </g>
      </svg>`,
      `<svg viewBox="0 0 32 32">
        <path d="M16 26 s-9-5.5-9-12 a5.5 5.5 0 0 1 10-3.2 a5.5 5.5 0 0 1 10 3.2 c0 6.5-9 12-9 12 z" fill="#f43f5e" opacity="0.55" stroke="#fda4af" stroke-width="1.2" />
      </svg>`,
      `<svg viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="11" fill="#0ea5e9" opacity="0.5" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="8" y1="16" x2="24" y2="16" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8" />
      </svg>`,
      `<svg viewBox="0 0 32 32">
        <rect x="13" y="3" width="6" height="3" fill="#ffffff" opacity="0.8" rx="1" />
        <path d="M10 9 C8.5 9 8 10 8 11.5 V25 C8 26.5 9.5 28 11 28 H21 C22.5 28 24 26.5 24 25 V11.5 C24 10 23.5 9 22 9 Z" fill="#0284c7" opacity="0.45" stroke="#38bdf8" stroke-width="1.2" />
      </svg>`
    ];

    const container = document.getElementById('rainContainer');
    for (let i = 0; i < 28; i++) {
      const drop = document.createElement('div');
      drop.className = 'medicine-drop';
      drop.innerHTML = colorfulMedicines[Math.floor(Math.random() * colorfulMedicines.length)];
      const size = Math.floor(Math.random() * 24) + 26;
      drop.style.width = size + 'px';
      drop.style.height = size + 'px';
      drop.style.left = Math.random() * 95 + '%';
      drop.style.animationDuration = (Math.random() * 8 + 12) + 's';
      drop.style.animationDelay = '-' + (Math.random() * 12) + 's';
      container.appendChild(drop);
    }

    // Developer Master Credentials
    const DEVELOPER_ID = "karanrathoure6271@gmail.com";
    const DEVELOPER_PASS = "KARAN#255075@";

    // Form Authentication
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      triggerIPhoneHaptic();
      playTapSound();

      const identifier = document.getElementById('userIdentifier').value.trim();
      const password = document.getElementById('userPassword').value;
      const loginBtn = document.getElementById('loginBtn');

      // (A) Developer Login Path
      if (identifier.toLowerCase() === DEVELOPER_ID.toLowerCase()) {
        if (password === DEVELOPER_PASS) {
          loginBtn.disabled = true;
          loginBtn.innerText = "Authenticating Developer...";
          try {
            try {
              await auth.signInWithEmailAndPassword(DEVELOPER_ID, DEVELOPER_PASS);
            } catch (authErr) {
              if (authErr.code === 'auth/user-not-found') {
                await auth.createUserWithEmailAndPassword(DEVELOPER_ID, DEVELOPER_PASS);
              } else {
                throw authErr;
              }
            }

            // Real-Time Alert to Developer's Gmail
            await sendLoginAlertEmail(DEVELOPER_ID, "Master Developer");

            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userRole', 'developer');
            localStorage.setItem('userAccount', DEVELOPER_ID);
            window.location.replace('create.html');
            return;
          } catch (devErr) {
            console.error("Developer Auth Error:", devErr);
            triggerFailureAlert("Developer access failed. Re-enter details!");
            loginBtn.disabled = false;
            loginBtn.innerText = "Log In";
            return;
          }
        } else {
          triggerFailureAlert("Wrong Password! Please re-enter.");
          return;
        }
      }

      // (B) Student Login Path
      loginBtn.disabled = true;
      loginBtn.innerText = "Authenticating...";

      try {
        let targetEmail = "";
        let studentData = null;

        if (identifier.includes("@")) {
          targetEmail = identifier.toLowerCase();
        } else {
          let snap = await db.collection("students")
            .where("enroll", "==", identifier.toUpperCase())
            .get();

          if (snap.empty) {
            snap = await db.collection("students")
              .where("phone", "==", identifier)
              .get();
          }

          if (!snap.empty) {
            studentData = snap.docs[0].data();
            targetEmail = studentData.email ? studentData.email.toLowerCase() : "";
          }
        }

        if (!targetEmail) {
          triggerFailureAlert("Student ID not found! Please check again.");
          loginBtn.disabled = false;
          loginBtn.innerText = "Log In";
          return;
        }

        const userCredential = await auth.signInWithEmailAndPassword(targetEmail, password);
        const user = userCredential.user;

        if (!studentData) {
          const docSnap = await db.collection("students").doc(user.uid).get();
          if (docSnap.exists) {
            studentData = docSnap.data();
          } else {
            const querySnap = await db.collection("students").where("email", "==", targetEmail).get();
            if (!querySnap.empty) {
              studentData = querySnap.docs[0].data();
            }
          }
        }

        // Real-Time Security Email to Student's Gmail
        const studentName = studentData ? studentData.name : "Student";
        await sendLoginAlertEmail(targetEmail, studentName);

        // Success: Store Session and Direct Redirect
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userRole', 'student');
        localStorage.setItem('userAccount', targetEmail);
        localStorage.setItem('studentName', studentName);
        localStorage.setItem('studentEnroll', studentData ? studentData.enroll : '');
        localStorage.setItem('studentPhoto', studentData ? (studentData.photo || '') : '');

        window.location.replace('home.html');
      } catch (err) {
        console.error("Auth error:", err);
        triggerFailureAlert("Please re-enter your right details!");
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = "Log In";
      }
    });

    // Double-Click Fullscreen
    document.addEventListener('dblclick', (e) => {
      if (['INPUT', 'BUTTON', 'A'].includes(e.target.tagName)) return;
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
