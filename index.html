<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D Pharma Class Group - Welcome</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #05241f 0%, #020f0d 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Falling Pharmacy Items Container */
    .falling-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .falling-item {
      position: absolute;
      top: -60px;
      opacity: 0.22;
      animation: fallDown linear infinite;
    }

    @keyframes fallDown {
      0% {
        transform: translateY(-60px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.25;
      }
      90% {
        opacity: 0.25;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Splash Screen Container */
    .splash-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      padding: 20px;
      animation: fadeIn 1.2s ease-out forwards;
    }

    /* Rx Badge */
    .rx-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #34d399;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 6px 18px;
      border-radius: 50px;
      margin-bottom: 22px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(16, 185, 129, 0.15);
      opacity: 0;
      animation: fadeIn 1s ease forwards 0.2s;
    }

    /* Logo Wrapper */
    .logo-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.85), rgba(13, 148, 136, 0.95));
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.3);
      margin-bottom: 25px;
      animation: bounceIn 1.3s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards, pulseGreen 2.5s infinite ease-in-out;
    }

    .logo-icon {
      width: 68px;
      height: 68px;
      fill: #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    /* Titles */
    .welcome-text {
      font-size: 0.95rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #6ee7b7;
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(15px);
      animation: slideUp 0.8s ease forwards 0.6s;
    }

    .app-title {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #34d399, #22d3ee, #a7f3d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: translateY(15px);
      letter-spacing: 0.5px;
      animation: slideUp 0.8s ease forwards 0.8s;
    }

    .tagline {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-top: 10px;
      opacity: 0;
      letter-spacing: 1.5px;
      animation: fadeIn 1s ease forwards 1.1s;
    }

    /* Pulse wave */
    .pulse-container {
      margin-top: 25px;
      width: 140px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 1.3s;
    }

    .ecg-svg {
      width: 100%;
      height: 100%;
      stroke: #34d399;
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: ecgDash 2s linear infinite;
    }

    .fullscreen-hint {
      position: absolute;
      bottom: 15px;
      font-size: 0.72rem;
      color: #64748b;
      letter-spacing: 1px;
    }

    /* Keyframes */
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.3) rotate(-20deg); }
      60% { opacity: 1; transform: scale(1.1) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    @keyframes pulseGreen {
      0%, 100% { box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4), 0 0 20px rgba(13, 148, 136, 0.2); }
      50% { box-shadow: 0 18px 45px rgba(16, 185, 129, 0.7), 0 0 35px rgba(34, 211, 238, 0.4); }
    }
    @keyframes ecgDash {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>

  <!-- Falling Background Elements Container -->
  <div class="falling-container" id="fallingContainer"></div>

  <div class="splash-container">
    <div class="rx-badge">
      <span>℞</span> D.PHARMACY NETWORK
    </div>

    <div class="logo-wrapper">
      <svg class="logo-icon" viewBox="0 0 24 24">
        <path d="M21 7.2l-2.1-2.1c-.4-.4-1-.4-1.4 0l-3.3 3.3c-1.3-.6-2.7-.9-4.2-.9-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8c0-1.5-.3-2.9-.9-4.2l3.3-3.3c.4-.4.4-1 0-1.4l-1.4-.4zM12 20c-3.3 0-6-2.7-6-6s2.7-6 6-6c1.1 0 2.2.3 3.1.8l-1.9 1.9c-.4.4-.4 1 0 1.4s1 .4 1.4 0l2.6-2.6c.5.9.8 2 .8 3.5 0 3.3-2.7 6-6 6zm-1-9h2v2h-2zm-3 3h8v2H8zm2 3h4v2h-4z"/>
      </svg>
    </div>

    <div class="welcome-text">WELCOME TO</div>
    <div class="app-title">D Pharma Class Group</div>
    <div class="tagline">PHARMACIST VAULT • E2E ENCRYPTED • STUDY HUB</div>

    <div class="pulse-container">
      <svg class="ecg-svg" viewBox="0 0 100 20">
        <path d="M0 10 H30 L35 2 L42 18 L48 5 L53 14 L58 10 H100"/>
      </svg>
    </div>
  </div>

  <div class="fullscreen-hint">Double tap/click anywhere for Fullscreen</div>

  <script>
    // 1. Falling Items Generator (Capsules, Tablets, Ampoules)
    const icons = [
      `<svg viewBox="0 0 24 24" fill="#34d399"><path d="M4.5 10.5C3.67 10.5 3 11.17 3 12s.67 1.5 1.5 1.5h3v3c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-3h3c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5h-3v-3c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v3h-3zM18.5 3c-1.93 0-3.5 1.57-3.5 3.5 0 .58.15 1.12.4 1.6L12.7 10.8c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l2.7-2.7c.48.25 1.02.4 1.6.4 1.93 0 3.5-1.57 3.5-3.5S20.43 3 18.5 3z"/></svg>`,
      `<svg viewBox="0 0 24 24" fill="#22d3ee"><circle cx="12" cy="12" r="9" stroke="#22d3ee" stroke-width="2" fill="none"/><line x1="7" y1="12" x2="17" y2="12" stroke="#22d3ee" stroke-width="2"/></svg>`,
      `<svg viewBox="0 0 24 24" fill="#6ee7b7"><path d="M6 3h12v2H6zm11 3H7c-.55 0-1 .45-1 1v1.18c0 .37.15.73.42 1L10 12.82V19c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-6.18l3.58-3.64c.27-.27.42-.63.42-1V7c0-.55-.45-1-1-1z"/></svg>`
    ];

    const container = document.getElementById('fallingContainer');
    const totalItems = 22;

    for (let i = 0; i < totalItems; i++) {
      const item = document.createElement('div');
      item.className = 'falling-item';
      item.innerHTML = icons[Math.floor(Math.random() * icons.length)];

      const size = Math.floor(Math.random() * 26) + 20;
      const left = Math.random() * 96;
      const duration = Math.random() * 7 + 6;
      const delay = Math.random() * 5;

      item.style.width = size + 'px';
      item.style.height = size + 'px';
      item.style.left = left + '%';
      item.style.animationDuration = duration + 's';
      item.style.animationDelay = delay + 's';

      container.appendChild(item);
    }

    // 2. Double-Click Fullscreen API
    document.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // 3. हमेशा 3 सेकंड का एनीमेशन पूरा होने के बाद ही रीडायरेक्ट होगा
    setTimeout(function() {
      const isLoggedIn = localStorage.getItem('isLoggedIn');
      if (isLoggedIn === 'true') {
        window.location.replace('home.html');
      } else {
        window.location.replace('login.html');
      }
    }, 3000);
  </script>
</body>
</html>
