<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D Pharma Class Group - Pharmacy Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #062b25 0%, #031411 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Pharmacy Hexagon Pattern Background */
    .chem-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(rgba(16, 185, 129, 0.08) 2px, transparent 2px),
        linear-gradient(rgba(20, 184, 166, 0.04) 1px, transparent 1px);
      background-size: 32px 32px, 64px 64px;
      z-index: 0;
    }

    /* Floating Medical Icons in Background */
    .floating-pill {
      position: absolute;
      opacity: 0.15;
      animation: floatAround 8s infinite ease-in-out alternate;
    }
    .pill-1 { top: 12%; left: 15%; width: 50px; animation-duration: 7s; }
    .pill-2 { bottom: 18%; right: 12%; width: 60px; animation-duration: 9s; }
    .pill-3 { top: 20%; right: 18%; width: 45px; animation-duration: 8s; }

    @keyframes floatAround {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-25px) rotate(20deg); }
    }

    /* Splash Screen Container */
    .splash-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      padding: 20px;
    }

    /* Rx Pharmacy Badge */
    .rx-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 6px 16px;
      border-radius: 50px;
      margin-bottom: 22px;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
      animation: fadeIn 1s ease forwards 0.2s;
      opacity: 0;
    }

    /* Animated Pharmacist Logo Wrapper */
    .logo-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 32px;
      background: linear-gradient(145deg, #10b981, #0d9488);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.3);
      margin-bottom: 25px;
      position: relative;
      animation: bounceIn 1.3s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards, pulseGreen 2.5s infinite ease-in-out;
    }

    /* Mortar & Pestle + Capsule SVG */
    .logo-icon {
      width: 68px;
      height: 68px;
      fill: #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    /* Text Animations */
    .welcome-text {
      font-size: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #6ee7b7;
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(15px);
      animation: slideUp 0.8s ease forwards 0.6s;
    }

    .app-title {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #34d399, #22d3ee, #a7f3d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: translateY(15px);
      letter-spacing: 0.5px;
      animation: slideUp 0.8s ease forwards 0.8s;
    }

    .tagline {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 10px;
      opacity: 0;
      letter-spacing: 1.5px;
      animation: fadeIn 1s ease forwards 1.1s;
    }

    /* Medical ECG Pulse Wave Line */
    .pulse-container {
      margin-top: 25px;
      width: 140px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 1.3s;
    }

    .ecg-svg {
      width: 100%;
      height: 100%;
      stroke: #34d399;
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: ecgDash 2s linear infinite;
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-20deg);
      }
      60% {
        opacity: 1;
        transform: scale(1.1) rotate(5deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes pulseGreen {
      0%, 100% {
        box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4), 0 0 20px rgba(13, 148, 136, 0.2);
      }
      50% {
        box-shadow: 0 18px 45px rgba(16, 185, 129, 0.7), 0 0 35px rgba(34, 211, 238, 0.4);
      }
    }

    @keyframes ecgDash {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>

  <!-- Pharmacy Molecule & Chemistry Background Pattern -->
  <div class="chem-grid"></div>

  <!-- Subtle Floating Medical Icons -->
  <svg class="floating-pill pill-1" viewBox="0 0 24 24" fill="#34d399">
    <path d="M4.5 10.5C3.67 10.5 3 11.17 3 12s.67 1.5 1.5 1.5h3v3c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-3h3c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5h-3v-3c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v3h-3z"/>
  </svg>
  <svg class="floating-pill pill-2" viewBox="0 0 24 24" fill="#22d3ee">
    <path d="M6 3h12v2H6zm11 3H7c-.55 0-1 .45-1 1v1.18c0 .37.15.73.42 1L10 12.82V19c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-6.18l3.58-3.64c.27-.27.42-.63.42-1V7c0-.55-.45-1-1-1z"/>
  </svg>
  <svg class="floating-pill pill-3" viewBox="0 0 24 24" fill="#10b981">
    <path d="M19.5 3.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5z"/>
  </svg>

  <div class="splash-container">
    <!-- Rx Professional Tag -->
    <div class="rx-badge">
      <span>℞</span> D.PHARMACY NETWORK
    </div>

    <!-- Authentic Pharmacist Logo (Mortar, Pestle & Cross) -->
    <div class="logo-wrapper">
      <svg class="logo-icon" viewBox="0 0 24 24">
        <!-- Medical Mortar, Pestle & Plus Design -->
        <path d="M21 7.2l-2.1-2.1c-.4-.4-1-.4-1.4 0l-3.3 3.3c-1.3-.6-2.7-.9-4.2-.9-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8c0-1.5-.3-2.9-.9-4.2l3.3-3.3c.4-.4.4-1 0-1.4l-1.4-.4zM12 20c-3.3 0-6-2.7-6-6s2.7-6 6-6c1.1 0 2.2.3 3.1.8l-1.9 1.9c-.4.4-.4 1 0 1.4s1 .4 1.4 0l2.6-2.6c.5.9.8 2 .8 3.5 0 3.3-2.7 6-6 6zm-1-9h2v2h-2zm-3 3h8v2H8zm2 3h4v2h-4z"/>
      </svg>
    </div>

    <!-- Welcome & Brand Headings -->
    <div class="welcome-text">WELCOME TO</div>
    <div class="app-title">D Pharma Class Group</div>
    <div class="tagline">PHARMACIST VAULT • E2E ENCRYPTED • STUDY HUB</div>

    <!-- Medical ECG Heartbeat Animation -->
    <div class="pulse-container">
      <svg class="ecg-svg" viewBox="0 0 100 20">
        <path d="M0 10 H30 L35 2 L42 18 L48 5 L53 14 L58 10 H100"/>
      </svg>
    </div>
  </div>

  <script>
    // 3 Second tak splash animation dikhayega, fir automatically redirect karega
    setTimeout(function() {
      const isLoggedIn = localStorage.getItem('isLoggedIn');

      if (isLoggedIn === 'true') {
        window.location.href = 'home.html';
      } else {
        window.location.href = 'login.html';
      }
    }, 3000); // 3000ms = 3 Seconds
  </script>

</body>
</html>
