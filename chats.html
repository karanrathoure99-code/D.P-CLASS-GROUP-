<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>D Pharma Portal - Direct Chat</title>

  <!-- 1. IMMEDIATE AUTH GUARD -->
  <script>
    (function () {
      const role = localStorage.getItem('userRole');
      const account = localStorage.getItem('userAccount');
      if (!role || !account) {
        window.location.replace('login.html');
      }
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #05241f 0%, #020f0d 100%);
      color: #ffffff;
    }

    /* Falling Medicines Rain (Slow Motion) */
    .rain-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .medicine-drop {
      position: absolute;
      top: -90px;
      animation: slowRain linear infinite;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
    }

    @keyframes slowRain {
      0% { transform: translateY(-90px) rotate(0deg); opacity: 0; }
      12% { opacity: 0.85; }
      88% { opacity: 0.85; }
      100% { transform: translateY(112vh) rotate(360deg); opacity: 0; }
    }

    #secureAppWrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
    }

    /* Top Nav */
    .top-navbar {
      height: 60px;
      background: rgba(6, 43, 37, 0.85);
      border-bottom: 1px solid rgba(52, 211, 153, 0.3);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .nav-btn {
      color: #34d399;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rx-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #34d399;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .btn-emerald {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }
    .btn-emerald:hover { opacity: 0.92; transform: translateY(-1px); }

    .input-field {
      width: 100%;
      background: rgba(3, 20, 17, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      -webkit-user-select: auto;
      user-select: auto;
    }
    .input-field:focus {
      border-color: #34d399;
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.35);
    }

    /* Chat Messages Viewport */
    .chat-container {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-wrapper {
      display: flex;
      gap: 10px;
      max-width: 80%;
      align-items: flex-end;
    }
    .msg-wrapper.mine {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #34d399;
      flex-shrink: 0;
    }
    .msg-bubble {
      background: #064e3b;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      border: 1px solid rgba(52, 211, 153, 0.3);
      -webkit-user-select: text;
      user-select: text;
      word-break: break-word;
    }
    .msg-wrapper.mine .msg-bubble {
      background: #047857;
      border-color: #34d399;
    }
    .msg-img-preview {
      max-width: 260px;
      max-height: 260px;
      border-radius: 10px;
      margin-top: 6px;
      display: block;
      cursor: pointer;
    }
    .msg-time {
      font-size: 0.68rem;
      color: #a7f3d0;
      margin-top: 4px;
      text-align: right;
    }

    /* Input Bar */
    .chat-input-bar {
      min-height: 64px;
      background: rgba(3, 20, 17, 0.9);
      border-top: 1px solid rgba(52, 211, 153, 0.25);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #34d399;
      font-size: 1.35rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #imagePreviewBox {
      display: none;
      background: rgba(6, 43, 37, 0.95);
      padding: 8px 16px;
      border-top: 1px solid #10b981;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Security Loader */
    #securityLoader {
      position: fixed;
      inset: 0;
      background: #020f0d;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #34d399;
      font-weight: 600;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(52, 211, 153, 0.2);
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Firebase Auth & Firestore SDKs (Only for Text Messages) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body oncontextmenu="return false;">

  <!-- Fullscreen Security Shield Loader -->
  <div id="securityLoader">
    <div class="spinner"></div>
    <span>Securing Environment...</span>
  </div>

  <!-- Slow Motion Medicine Particles -->
  <div class="rain-container" id="rainContainer"></div>

  <!-- Main Full-Page Viewport Wrapper -->
  <div id="secureAppWrapper">
    <!-- Top Bar -->
    <header class="top-navbar">
      <a href="home.html" class="nav-btn">❮ Home</a>
      <span class="rx-badge" id="roleBadge">DIRECT CHAT</span>
      <span id="userIdentifier" style="font-size: 0.8rem; color: #94a3b8;"></span>
    </header>

    <!-- Messages Container -->
    <div id="chatMessages" class="chat-container">
      <p style="text-align:center; color:#94a3b8; font-size:0.85rem; margin:auto;">Loading messages...</p>
    </div>

    <!-- Image Preview Before Sending -->
    <div id="imagePreviewBox">
      <img id="imgPreviewTag" style="width:50px; height:50px; border-radius:8px; object-fit:cover; border:1px solid #34d399;" />
      <span style="font-size:0.8rem; color:#a7f3d0;" id="uploadStatusText">Photo selected</span>
      <button class="nav-btn" style="color:#f87171; font-size:0.8rem;" onclick="removeAttachedImage()">✕ Remove</button>
    </div>

    <!-- Chat Input Bar -->
    <div class="chat-input-bar">
      <input type="file" id="chatPhotoUpload" accept="image/*" style="display:none;" />
      <button class="icon-btn" onclick="document.getElementById('chatPhotoUpload').click()" title="Send Photo">📷</button>
      <input type="text" id="outgoingMsgInput" class="input-field" placeholder="Type a message..." />
      <button class="btn-emerald" id="btnSendMessage" onclick="dispatchMessage()">Send</button>
    </div>
  </div>

  <script>
    // ==========================================
    // CLOUDINARY CONFIGURATION (यहाँ अपनी डिटेल्स डालें)
    // ==========================================
    const CLOUDINARY_CLOUD_NAME = "YOUR_CLOUDINARY_CLOUD_NAME"; 
    const CLOUDINARY_UPLOAD_PRESET = "YOUR_UNSIGNED_UPLOAD_PRESET";

    // 1. FULLSCREEN API
    document.addEventListener('dblclick', function(e) {
      if (['INPUT', 'BUTTON', 'TEXTAREA', 'LABEL', 'A'].includes(e.target.tagName)) return;
      const doc = window.document;
      const docEl = doc.documentElement;
      const req = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      const exit = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (req) req.call(docEl).catch(() => {});
      } else {
        if (exit) exit.call(doc);
      }
    });

    // 2. ANTI-INSPECT PROTECTION
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', function (e) {
      if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && e.keyCode === 85)) {
        e.preventDefault();
        return false;
      }
    });

    setInterval(function () {
      (function () { return false; }['constructor']('debugger')['call']());
    }, 1000);

    // 3. SLOW MEDICINE RAIN ANIMATION
    const colorfulMedicines = [
      `<svg viewBox="0 0 32 32"><g transform="rotate(-30 16 16)"><path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#ef4444" opacity="0.65" /><path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#ffffff" opacity="0.65" /><rect x="9.5" y="15" width="13" height="2" fill="#b91c1c" opacity="0.6" rx="1" /></g></svg>`,
      `<svg viewBox="0 0 32 32"><g transform="rotate(25 16 16)"><path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#0f172a" opacity="0.75" /><path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#10b981" opacity="0.7" /><rect x="9.5" y="15" width="13" height="2" fill="#34d399" opacity="0.7" rx="1" /></g></svg>`,
      `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="#0ea5e9" opacity="0.5" stroke="#38bdf8" stroke-width="1.5" /><line x1="8" y1="16" x2="24" y2="16" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8" /></svg>`
    ];

    const rainContainer = document.getElementById('rainContainer');
    for (let i = 0; i < 22; i++) {
      const drop = document.createElement('div');
      drop.className = 'medicine-drop';
      drop.innerHTML = colorfulMedicines[Math.floor(Math.random() * colorfulMedicines.length)];
      const size = Math.floor(Math.random() * 22) + 26;
      drop.style.width = size + 'px';
      drop.style.height = size + 'px';
      drop.style.left = Math.random() * 95 + '%';
      drop.style.animationDuration = (Math.random() * 8 + 14) + 's';
      drop.style.animationDelay = '-' + (Math.random() * 12) + 's';
      rainContainer.appendChild(drop);
    }

    // 4. FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyCQ2XpoeeKwVmIZ2wp8H3D2xzTY49nhxAI",
      authDomain: "d-pharma-class-group.firebaseapp.com",
      projectId: "d-pharma-class-group",
      storageBucket: "d-pharma-class-group.firebasestorage.app",
      messagingSenderId: "870561978483",
      appId: "1:870561978483:web:095681d6185f43cd6d7206",
      measurementId: "G-VQ12Y4NLRJ"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const DEVELOPER_EMAIL = "karanrathoure6271@gmail.com";
    const loggedRole = localStorage.getItem('userRole');
    const loggedAccount = localStorage.getItem('userAccount');

    let isDeveloper = false;
    let currentUser = null;
    let currentStudentData = null;
    let selectedImageFile = null;

    auth.onAuthStateChanged(async (user) => {
      if (!user && !loggedAccount) {
        localStorage.clear();
        window.location.replace('login.html');
        return;
      }

      const verifiedEmail = (user && user.email) ? user.email.toLowerCase() : (loggedAccount || '').toLowerCase();

      if (loggedRole === 'developer' && verifiedEmail === DEVELOPER_EMAIL) {
        isDeveloper = true;
        document.getElementById('roleBadge').innerText = "DEVELOPER";
      } else {
        const studentSnap = await db.collection('students').where('email', '==', verifiedEmail).get();
        if (studentSnap.empty && !isDeveloper) {
          alert("Unauthorized access!");
          localStorage.clear();
          auth.signOut();
          window.location.replace('login.html');
          return;
        }

        if (!studentSnap.empty) {
          currentStudentData = studentSnap.docs[0].data();
        }
        document.getElementById('roleBadge').innerText = "STUDENT";
      }

      currentUser = user || { email: verifiedEmail };
      document.getElementById('userIdentifier').innerText = isDeveloper ? "Dev: Karan" : (currentStudentData ? (currentStudentData.enroll || currentStudentData.enrollNo) : '');

      document.getElementById('securityLoader').style.display = 'none';
      document.getElementById('secureAppWrapper').style.display = 'flex';

      listenDirectMessages();
    });

    // 5. PHOTO SELECTION (CLOUDINARY READY)
    document.getElementById('chatPhotoUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        selectedImageFile = file;
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('imgPreviewTag').src = evt.target.result;
          document.getElementById('uploadStatusText').innerText = "Photo selected (" + (file.size / 1024).toFixed(0) + " KB)";
          document.getElementById('imagePreviewBox').style.display = 'flex';
        };
        reader.readAsDataURL(file);
      }
    });

    function removeAttachedImage() {
      selectedImageFile = null;
      document.getElementById('chatPhotoUpload').value = '';
      document.getElementById('imagePreviewBox').style.display = 'none';
    }

    // 6. REALTIME DIRECT MESSAGES (FIRESTORE)
    function listenDirectMessages() {
      const box = document.getElementById('chatMessages');

      db.collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot((snap) => {
          box.innerHTML = '';
          if (snap.empty) {
            box.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:0.85rem; margin:auto;">No messages posted yet.</p>';
            return;
          }

          snap.forEach((doc) => {
            const m = doc.data();
            const isMine = (m.senderEmail || '').toLowerCase() === (currentUser.email || '').toLowerCase();
            const senderPhoto = m.senderPhoto || 'https://via.placeholder.com/150';
            const timeStr = m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${isMine ? 'mine' : ''}`;

            // Image loads from Cloudinary URL (Database never bloats)
            let imageHtml = m.image ? `<img src="${m.image}" class="msg-img-preview" onclick="window.open('${m.image}')" loading="lazy" />` : '';

            wrapper.innerHTML = `
              <img src="${senderPhoto}" class="msg-avatar" alt="User" />
              <div class="msg-bubble">
                <div style="font-size:0.72rem; color:#34d399; font-weight:700; margin-bottom:2px;">${escapeHtml(m.senderName || 'Member')}</div>
                ${m.text ? `<div>${escapeHtml(m.text)}</div>` : ''}
                ${imageHtml}
                <div class="msg-time">${timeStr}</div>
              </div>
            `;
            box.appendChild(wrapper);
          });
          box.scrollTop = box.scrollHeight;
        });
    }

    // 7. DISPATCH MESSAGE (UPLOAD TO CLOUDINARY + SAVE TEXT/LINK TO FIRESTORE)
    async function dispatchMessage() {
      const input = document.getElementById('outgoingMsgInput');
      const sendBtn = document.getElementById('btnSendMessage');
      const text = input.value.trim();

      if (!text && !selectedImageFile) return;

      sendBtn.disabled = true;
      sendBtn.innerText = "...";

      let cloudinaryUrl = null;

      try {
        // Step 1: अगर फोटो है तो वह सीधे Cloudinary में अपलोड होगी
        if (selectedImageFile) {
          document.getElementById('uploadStatusText').innerText = "Uploading photo to Cloudinary...";

          const formData = new FormData();
          formData.append("file", selectedImageFile);
          formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
            method: "POST",
            body: formData
          });

          const data = await res.json();
          if (data.secure_url) {
            cloudinaryUrl = data.secure_url; // Cloudinary से मिला सुरक्षित लिंक
          } else {
            throw new Error(data.error ? data.error.message : "Cloudinary Upload Failed");
          }
        }

        // Step 2: केवल टेक्स्ट और Cloudinary का यूआरएल Firestore डेटाबेस में जाएगा
        const senderName = isDeveloper ? 'Developer Karan' : ((currentStudentData && currentStudentData.name) || 'Student');
        const senderPhoto = isDeveloper ? 'https://via.placeholder.com/150' : ((currentStudentData && currentStudentData.photo) || 'https://via.placeholder.com/150');

        await db.collection('messages').add({
          text: text,
          image: cloudinaryUrl, // सिर्फ 1 लाइन का वेब लिंक जाएगा, भारी इमेज नहीं
          senderEmail: currentUser.email || DEVELOPER_EMAIL,
          senderName: senderName,
          senderPhoto: senderPhoto,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        input.value = '';
        removeAttachedImage();
      } catch (err) {
        console.error(err);
        alert("Upload/Send failed: " + err.message);
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "Send";
      }
    }

    // XSS Sanitizer
    function escapeHtml(string) {
      return String(string).replace(/[&<>"'`=\/]/g, function (s) {
        return ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
          '/': '&#x2F;',
          '`': '&#x60;',
          '=': '&#x3D;'
        })[s];
      });
    }
  </script>
</body>
</html>
