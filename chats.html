<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>D Pharma Portal - Secure Chats</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at center, #05241f 0%, #020f0d 100%);
      color: #ffffff;
      position: relative;
    }

    /* Falling Medicines Rain */
    .rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .medicine-drop {
      position: absolute;
      top: -90px;
      animation: slowRain linear infinite;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
    }

    @keyframes slowRain {
      0% { transform: translateY(-90px) rotate(0deg); opacity: 0; }
      12% { opacity: 0.85; }
      88% { opacity: 0.85; }
      100% { transform: translateY(112vh) rotate(360deg); opacity: 0; }
    }

    /* Screen-locked container */
    .app-container {
      position: relative;
      z-index: 2;
      max-width: 720px;
      margin: 0 auto;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Header */
    .chat-header {
      flex-shrink: 0;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(6, 43, 37, 0.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(52, 211, 153, 0.25);
    }

    .user-profile-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #34d399;
      object-fit: cover;
      background: #031411;
      pointer-events: none;
    }

    .header-icons {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #34d399;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .icon-btn:hover {
      background: rgba(16, 185, 129, 0.45);
      color: #fff;
    }

    /* Main View Area */
    .main-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Incoming Requests Box */
    .requests-box {
      flex-shrink: 0;
      background: rgba(16, 185, 129, 0.15);
      border-bottom: 1px solid rgba(52, 211, 153, 0.35);
      padding: 10px 14px;
      display: none;
      max-height: 140px;
      overflow-y: auto;
    }

    .req-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(3, 20, 17, 0.9);
      border: 1px solid rgba(52, 211, 153, 0.4);
      padding: 8px 12px;
      border-radius: 12px;
      margin-top: 6px;
    }

    .btn-accept {
      background: #10b981;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Conversations List */
    .chat-list-view {
      flex: 1;
      min-height: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .chat-user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(6, 43, 37, 0.75);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 14px;
      padding: 10px 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .chat-user-item:hover {
      background: rgba(16, 185, 129, 0.25);
      border-color: #34d399;
    }

    /* Active Conversation Area */
    .active-chat-view {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .messages-area {
      flex: 1;
      min-height: 0;
      padding: 12px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .e2e-badge-wrap {
      text-align: center;
      margin: 4px 0;
    }

    .e2e-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #a7f3d0;
    }

    .msg-bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 0.86rem;
      line-height: 1.35;
      word-break: break-word;
      position: relative;
    }

    .msg-incoming {
      align-self: flex-start;
      background: rgba(6, 43, 37, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.25);
      color: #e2e8f0;
      border-bottom-left-radius: 3px;
    }

    .msg-outgoing {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.45), rgba(5, 150, 105, 0.55));
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #ffffff;
      border-bottom-right-radius: 3px;
    }

    /* Bottom Input Bar - Strictly Fixed at Viewport Bottom */
    .chat-input-bar {
      flex-shrink: 0;
      padding: 8px 12px;
      background: rgba(3, 20, 17, 0.98);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(52, 211, 153, 0.25);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      height: 40px;
      background: rgba(6, 43, 37, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 22px;
      padding: 0 14px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .chat-input:focus {
      border-color: #34d399;
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.3);
    }

    .send-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Calling Overlay Modal */
    .call-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: radial-gradient(circle at center, #05241f 0%, #010a08 100%);
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px;
    }

    .calling-avatar-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #34d399;
      padding: 4px;
    }

    .calling-avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .end-call-btn {
      background: #ef4444;
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body oncontextmenu="return false;">

  <!-- Background Rain -->
  <div class="rain-container" id="rainContainer"></div>

  <div class="app-container">
    <!-- Top Header -->
    <div class="chat-header">
      <div class="user-profile-meta" id="headerProfileBlock" onclick="handleHeaderNav()">
        <span style="font-size: 1.2rem; color: #34d399; margin-right: 2px;">❮</span>
        <img id="chatTargetAvatar" class="chat-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Chat User" />
        <div>
          <h3 id="chatTargetName" style="font-size: 0.9rem; line-height: 1.2;">Secure Chats</h3>
          <span id="chatTargetStatus" style="font-size: 0.68rem; color: #34d399;">🔒 Device-Bound Encrypted</span>
        </div>
      </div>
      <div class="header-icons" id="headerCallActions" style="display: none;">
        <button class="icon-btn" onclick="startCall('Audio')">
          <svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
        <button class="icon-btn" onclick="startCall('Video')">
          <svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        </button>
      </div>
    </div>

    <!-- Main Dynamic Body -->
    <div class="main-body">
      <!-- 1. Incoming Requests Box -->
      <div id="requestsWrap" class="requests-box">
        <span style="font-size: 0.75rem; font-weight: 700; color: #34d399;">📥 INCOMING CHAT REQUESTS:</span>
        <div id="requestsList"></div>
      </div>

      <!-- 2. Accepted Conversations List -->
      <div id="chatListView" class="chat-list-view">
        <h4 style="font-size: 0.8rem; color: #a7f3d0;">ACCEPTED CONVERSATIONS:</h4>
        <div id="friendsList">Loading chats...</div>
      </div>

      <!-- 3. Active Chat Window -->
      <div id="activeChatView" class="active-chat-view">
        <div class="messages-area" id="messagesBox">
          <div class="e2e-badge-wrap">
            <span class="e2e-badge">
              🛡️ Messages are end-to-end encrypted to this specific physical device only.
            </span>
          </div>
        </div>

        <form class="chat-input-bar" id="sendMsgForm">
          <input type="text" id="msgInput" class="chat-input" placeholder="Type an encrypted message..." autocomplete="off" required />
          <button type="submit" class="send-btn">
            <svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Calling Modal -->
  <div class="call-modal" id="callModal">
    <div style="text-align: center; margin-top: 20px;">
      <h2 id="callingStatus" style="font-size: 1.2rem; color: #34d399; margin-bottom: 4px;">Calling...</h2>
      <p id="callingTarget" style="font-size: 0.85rem; color: #94a3b8;">User Name</p>
    </div>

    <div class="calling-avatar-ring">
      <img id="callingAvatar" src="" alt="Calling User" />
    </div>

    <button class="end-call-btn" onclick="endCall()">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 010-1.41C2.51 9.4 6.99 8 12 8s9.49 1.4 11.71 3.67c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
    </button>
  </div>

  <script>
    // 1. AUTH GUARD
    const loggedAccount = (localStorage.getItem('userAccount') || '').trim().toLowerCase();
    const isLoggedIn = localStorage.getItem('isLoggedIn');

    if (isLoggedIn !== 'true' || !loggedAccount) {
      window.location.replace('login.html');
    }

    // 2. FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyCQ2XpoeeKwVmIZ2wp8H3D2xzTY49nhxAI",
      authDomain: "d-pharma-class-group.firebaseapp.com",
      projectId: "d-pharma-class-group",
      storageBucket: "d-pharma-class-group.firebasestorage.app",
      messagingSenderId: "870561978483",
      appId: "1:870561978483:web:095681d6185f43cd6d7206",
      measurementId: "G-VQ12Y4NLRJ"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let myStudentDocId = "";
    db.collection('students').where('email', '==', loggedAccount).get().then(snap => {
      if (!snap.empty) {
        myStudentDocId = snap.docs[0].id;
      }
      listenIncomingRequests();
      loadConversations();
    });

    // 3. DEVICE-BOUND E2EE ENGINE
    function getDeviceKey() {
      let key = localStorage.getItem('_dp_device_e2e_key');
      if (!key) {
        key = 'DPKEY_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('_dp_device_e2e_key', key);
      }
      return key;
    }
    const currentDeviceKey = getDeviceKey();

    function encryptText(text, dKey) {
      let result = '';
      for (let i = 0; i < text.length; i++) {
        const charCode = text.charCodeAt(i) ^ dKey.charCodeAt(i % dKey.length);
        result += String.fromCharCode(charCode);
      }
      return btoa(encodeURIComponent(result));
    }

    function decryptText(cipher, dKey) {
      try {
        const decoded = decodeURIComponent(atob(cipher));
        let result = '';
        for (let i = 0; i < decoded.length; i++) {
          const charCode = decoded.charCodeAt(i) ^ dKey.charCodeAt(i % dKey.length);
          result += String.fromCharCode(charCode);
        }
        return result;
      } catch (e) {
        return null;
      }
    }

    // 4. REALTIME REQUEST LISTENER
    function listenIncomingRequests() {
      db.collection('chatRequests')
        .where('status', '==', 'pending')
        .onSnapshot((snap) => {
          const wrap = document.getElementById('requestsWrap');
          const list = document.getElementById('requestsList');
          list.innerHTML = '';
          let count = 0;

          snap.forEach((doc) => {
            const req = doc.data();
            const toE = (req.toEmail || req.to || '').toLowerCase();
            const toId = req.toId || '';

            if (toE === loggedAccount || toId === loggedAccount || (myStudentDocId && toId === myStudentDocId)) {
              count++;
              const senderEmail = (req.fromEmail || req.from || '').toLowerCase();
              const senderName = req.fromName || senderEmail;

              const div = document.createElement('div');
              div.className = 'req-item';
              div.innerHTML = `
                <div>
                  <strong style="font-size:0.85rem; color:#fff;">${senderName}</strong>
                  <div style="font-size:0.7rem; color:#94a3b8;">${senderEmail} sent request</div>
                </div>
                <button class="btn-accept" onclick="acceptChatRequest('${doc.id}', '${senderEmail}')">Accept</button>
              `;
              list.appendChild(div);
            }
          });

          wrap.style.display = count > 0 ? 'block' : 'none';
        });
    }

    async function acceptChatRequest(reqDocId, senderAccount) {
      try {
        await db.collection('chatRequests').doc(reqDocId).update({
          status: 'accepted'
        });

        const cleanA = loggedAccount.replace(/[^a-zA-Z0-9]/g, '_');
        const cleanB = senderAccount.replace(/[^a-zA-Z0-9]/g, '_');
        const roomId = [cleanA, cleanB].sort().join('___');

        await db.collection('friendships').doc(roomId).set({
          user1: loggedAccount,
          user2: senderAccount,
          roomId: roomId,
          establishedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        alert("Chat Request Accepted!");
        loadConversations();
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    // 5. LOAD ACCEPTED CONVERSATIONS
    let activeChatRoomId = null;
    let targetUserData = null;
    let msgListenerUnsub = null;

    async function loadConversations() {
      const friendsList = document.getElementById('friendsList');

      const q1 = await db.collection('friendships').where('user1', '==', loggedAccount).get();
      const q2 = await db.collection('friendships').where('user2', '==', loggedAccount).get();

      const peerAccounts = new Set();
      q1.forEach(d => peerAccounts.add(d.data().user2));
      q2.forEach(d => peerAccounts.add(d.data().user1));

      const urlParams = new URLSearchParams(window.location.search);
      const directTarget = urlParams.get('to');
      if (directTarget) {
        peerAccounts.add(directTarget.toLowerCase());
      }

      if (peerAccounts.size === 0) {
        friendsList.innerHTML = "<p style='color:#94a3b8; font-size:0.8rem; padding:10px;'>No accepted conversations yet.</p>";
        return;
      }

      friendsList.innerHTML = '';
      for (let peer of peerAccounts) {
        let name = peer;
        let photo = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

        let sSnap = await db.collection('students').where('email', '==', peer).get();
        if (sSnap.empty && peer.length > 15) {
          try {
            const byDoc = await db.collection('students').doc(peer).get();
            if (byDoc.exists) sSnap = { empty: false, docs: [byDoc] };
          } catch(e) {}
        }

        if (!sSnap.empty) {
          const sData = sSnap.docs[0].data();
          name = sData.name || peer;
          if (sData.photo) photo = sData.photo;
        }

        const item = document.createElement('div');
        item.className = 'chat-user-item';
        item.onclick = () => openActiveChat(peer, name, photo);
        item.innerHTML = `
          <img src="${photo}" class="chat-avatar" alt="Avatar" />
          <div style="flex:1;">
            <strong style="font-size:0.88rem;">${name}</strong>
            <div style="font-size:0.7rem; color:#34d399;">Tap to chat</div>
          </div>
        `;
        friendsList.appendChild(item);
      }

      if (directTarget && !activeChatRoomId) {
        const firstItem = friendsList.querySelector('.chat-user-item');
        if (firstItem) firstItem.click();
      }
    }

    // 6. OPEN ACTIVE CHAT WINDOW
    function openActiveChat(peerAccount, peerName, peerPhoto) {
      targetUserData = {
        email: peerAccount,
        name: peerName,
        photo: peerPhoto
      };

      const idA = loggedAccount.replace(/[^a-zA-Z0-9]/g, '_');
      const idB = peerAccount.replace(/[^a-zA-Z0-9]/g, '_');
      activeChatRoomId = [idA, idB].sort().join('___');

      document.getElementById('chatTargetName').innerText = peerName;
      document.getElementById('chatTargetStatus').innerText = "● Online";
      document.getElementById('chatTargetAvatar').src = peerPhoto;
      document.getElementById('headerCallActions').style.display = 'flex';

      document.getElementById('chatListView').style.display = 'none';
      document.getElementById('requestsWrap').style.display = 'none';
      document.getElementById('activeChatView').style.display = 'flex';

      listenMessages();
    }

    function handleHeaderNav() {
      if (activeChatRoomId) {
        if (msgListenerUnsub) msgListenerUnsub();
        activeChatRoomId = null;
        targetUserData = null;
        document.getElementById('activeChatView').style.display = 'none';
        document.getElementById('headerCallActions').style.display = 'none';
        document.getElementById('chatTargetName').innerText = "Secure Chats";
        document.getElementById('chatTargetStatus').innerText = "🔒 Device-Bound Encrypted";
        document.getElementById('chatTargetAvatar').src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
        document.getElementById('chatListView').style.display = 'flex';
        listenIncomingRequests();
        loadConversations();
      } else {
        window.location.href = 'home.html';
      }
    }

    // 7. SEND MESSAGE
    document.getElementById('sendMsgForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !activeChatRoomId) return;

      const encryptedContent = encryptText(text, currentDeviceKey);

      await db.collection('chats').doc(activeChatRoomId).collection('messages').add({
        sender: loggedAccount,
        receiver: targetUserData.email,
        cipher: encryptedContent,
        deviceKey: currentDeviceKey,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      input.value = '';
    });

    // 8. REALTIME MESSAGES (Auto scroll bottom)
    function listenMessages() {
      if (msgListenerUnsub) msgListenerUnsub();

      msgListenerUnsub = db.collection('chats').doc(activeChatRoomId).collection('messages')
        .orderBy('createdAt', 'asc')
        .onSnapshot((snap) => {
          const box = document.getElementById('messagesBox');
          box.innerHTML = `
            <div class="e2e-badge-wrap">
              <span class="e2e-badge">
                🛡️ Messages are encrypted to this physical device only.
              </span>
            </div>
          `;

          snap.forEach((doc) => {
            const m = doc.data();
            const isMe = m.sender === loggedAccount;
            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${isMe ? 'msg-outgoing' : 'msg-incoming'}`;

            let clearText = null;
            if (isMe) {
              if (m.deviceKey === currentDeviceKey) {
                clearText = decryptText(m.cipher, currentDeviceKey);
              }
            } else {
              clearText = decryptText(m.cipher, m.deviceKey);
            }

            if (!clearText) {
              bubble.innerHTML = `<span style="font-size:0.75rem; color:#fca5a5;">🔒 Encrypted on another device</span>`;
            } else {
              bubble.innerText = clearText;
            }

            box.appendChild(bubble);
          });

          // Smooth scroll to latest bottom message
          box.scrollTop = box.scrollHeight;
        });
    }

    // 9. CALLING MODAL
    function startCall(type) {
      if (!targetUserData) return;
      document.getElementById('callingStatus').innerText = `${type} Calling...`;
      document.getElementById('callingTarget').innerText = targetUserData.name;
      document.getElementById('callingAvatar').src = targetUserData.photo || document.getElementById('chatTargetAvatar').src;
      document.getElementById('callModal').style.display = 'flex';
    }

    function endCall() {
      document.getElementById('callModal').style.display = 'none';
    }

    // 10. BACKGROUND RAIN
    const colorfulMedicines = [
      `<svg viewBox="0 0 32 32"><g transform="rotate(-30 16 16)"><path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#ef4444" opacity="0.65"/><path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#ffffff" opacity="0.65"/><rect x="9.5" y="15" width="13" height="2" fill="#b91c1c" opacity="0.6" rx="1"/></g></svg>`,
      `<svg viewBox="0 0 32 32"><g transform="rotate(25 16 16)"><path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#0f172a" opacity="0.75"/><path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#10b981" opacity="0.7"/><rect x="9.5" y="15" width="13" height="2" fill="#34d399" opacity="0.7" rx="1"/></g></svg>`,
      `<svg viewBox="0 0 32 32"><path d="M16 26 s-9-5.5-9-12 a5.5 5.5 0 0 1 10-3.2 a5.5 5.5 0 0 1 10 3.2 c0 6.5-9 12-9 12 z" fill="#f43f5e" opacity="0.55" stroke="#fda4af" stroke-width="1.2"/></svg>`,
      `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="#0ea5e9" opacity="0.5" stroke="#38bdf8" stroke-width="1.5"/><line x1="8" y1="16" x2="24" y2="16" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8"/></svg>`,
      `<svg viewBox="0 0 32 32"><rect x="13" y="3" width="6" height="3" fill="#ffffff" opacity="0.8" rx="1"/><path d="M10 9 C8.5 9 8 10 8 11.5 V25 C8 26.5 9.5 28 11 28 H21 C22.5 28 24 26.5 24 25 V11.5 C24 10 23.5 9 22 9 Z" fill="#0284c7" opacity="0.45" stroke="#38bdf8" stroke-width="1.2"/></svg>`
    ];

    const rainContainer = document.getElementById('rainContainer');
    for (let i = 0; i < 28; i++) {
      const drop = document.createElement('div');
      drop.className = 'medicine-drop';
      drop.innerHTML = colorfulMedicines[Math.floor(Math.random() * colorfulMedicines.length)];
      const size = Math.floor(Math.random() * 24) + 26;
      drop.style.width = size + 'px';
      drop.style.height = size + 'px';
      drop.style.left = Math.random() * 95 + '%';
      drop.style.animationDuration = (Math.random() * 8 + 12) + 's';
      drop.style.animationDelay = '-' + (Math.random() * 12) + 's';
      rainContainer.appendChild(drop);
    }
  </script>
</body>
