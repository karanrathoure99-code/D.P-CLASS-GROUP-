<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>D Pharma Portal - Secure Chats</title>
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at center, #05241f 0%, #020f0d 100%);
      color: #ffffff;
      position: relative;
    }

    /* ==========================================
       JS CONTROLLED 3D CAPSULE SPLASH OVERLAY
       ========================================== */
    #capsuleSplashOverlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #062b25 0%, #010a08 100%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
      pointer-events: auto;
    }

    .capsule-wrapper-3d {
      position: relative;
      width: 240px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 800px;
    }

    .capsule-energy-core {
      position: absolute;
      width: 16px;
      height: 60px;
      background: #34d399;
      border-radius: 8px;
      box-shadow: 0 0 35px 15px #10b981, 0 0 60px 30px rgba(52, 211, 153, 0.6);
      opacity: 0;
      transform: scale(0.2);
      z-index: 1;
      transition: all 0.5s ease-out;
    }

    .capsule-energy-core.burst {
      opacity: 1;
      transform: scale(14);
    }

    .capsule-half-shell {
      width: 95px;
      height: 74px;
      position: absolute;
      top: 13px;
      box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.4), 0 10px 25px rgba(0, 0, 0, 0.7);
      z-index: 2;
      transition: transform 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.5s ease;
    }

    .capsule-shell-left {
      left: 25px;
      background: linear-gradient(145deg, #10b981 0%, #064e3b 100%);
      border-top-left-radius: 45px;
      border-bottom-left-radius: 45px;
      border: 2px solid #34d399;
      border-right: 1px dashed rgba(255, 255, 255, 0.3);
      transform-origin: left center;
    }

    .capsule-shell-left.open {
      transform: translateX(-100px) translateY(-10px) rotate(-35deg) scale(0.85);
      opacity: 0;
    }

    .capsule-shell-right {
      right: 25px;
      background: linear-gradient(145deg, #ffffff 0%, #94a3b8 100%);
      border-top-right-radius: 45px;
      border-bottom-right-radius: 45px;
      border: 2px solid #ffffff;
      border-left: 1px dashed rgba(0, 0, 0, 0.2);
      transform-origin: right center;
    }

    .capsule-shell-right.open {
      transform: translateX(100px) translateY(10px) rotate(35deg) scale(0.85);
      opacity: 0;
    }

    .capsule-badge-label {
      margin-top: 30px;
      font-size: 0.82rem;
      color: #34d399;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: rgba(16, 185, 129, 0.12);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(52, 211, 153, 0.35);
      transition: opacity 0.3s ease;
    }

    /* Falling Medicines Rain */
    .rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .medicine-drop {
      position: absolute;
      top: -90px;
      animation: slowRain linear infinite;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
    }

    @keyframes slowRain {
      0% { transform: translateY(-90px) rotate(0deg); opacity: 0; }
      12% { opacity: 0.85; }
      88% { opacity: 0.85; }
      100% { transform: translateY(112vh) rotate(360deg); opacity: 0; }
    }

    .app-container {
      position: relative;
      z-index: 2;
      max-width: 720px;
      margin: 0 auto;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ==========================================
       TOP NOTIFICATION BANNER (HOME & DPG STYLE)
       ========================================== */
    #topNotificationBanner {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 440px;
      background: rgba(4, 34, 28, 0.96);
      border: 1.5px solid #34d399;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85), 0 0 20px rgba(52, 211, 153, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10000;
      transition: top 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
    }

    #topNotificationBanner.show {
      top: 90px;
      opacity: 1;
      pointer-events: auto;
    }

    .banner-avatar-cluster {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .banner-user-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid #34d399;
      object-fit: cover;
      background: #021a15;
    }

    .banner-logo-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #10b981, #0d9488);
      border-radius: 6px;
      border: 1.5px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
    }

    .banner-text-wrap {
      flex: 1;
      min-width: 0;
    }

    .banner-text-title {
      font-size: 0.84rem;
      font-weight: 800;
      color: #34d399;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .banner-text-sub {
      font-size: 0.76rem;
      color: #e2e8f0;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==========================================
       FIXED TOP FLOATING NAVBAR DOCK
       ========================================== */
    .top-navbar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 720px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(4, 28, 23, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid #34d399;
      border-radius: 35px;
      padding: 8px 16px;
      z-index: 95;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(52, 211, 153, 0.35);
    }

    .app-logo-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.92rem;
      color: #34d399;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      padding: 6px 10px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .app-logo-badge:active {
      transform: scale(0.92);
      background: rgba(16, 185, 129, 0.15);
    }

    .top-logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #10b981, #0d9488);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.55);
      flex-shrink: 0;
    }

    .search-container {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(2, 18, 14, 0.85);
      border: 1.2px solid rgba(52, 211, 153, 0.5);
      border-radius: 25px;
      padding: 9px 16px;
      color: #ffffff;
      font-size: 0.86rem;
      outline: none;
      transition: all 0.3s ease;
      -webkit-user-select: text;
      user-select: text;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .search-input:focus {
      border-color: #34d399;
      box-shadow: 0 0 16px rgba(52, 211, 153, 0.5), inset 0 2px 6px rgba(0, 0, 0, 0.5);
      background: rgba(3, 24, 19, 0.95);
    }

    .profile-nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid #34d399;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.45), rgba(6, 78, 59, 0.65));
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.6);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .profile-nav-btn:active {
      transform: scale(0.90);
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
    }

    .protected-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Main View Area */
    .main-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: 88px;
      padding-bottom: 84px;
    }

    /* Incoming Requests Box */
    .requests-box {
      flex-shrink: 0;
      background: rgba(16, 185, 129, 0.15);
      border-bottom: 1.5px solid rgba(52, 211, 153, 0.35);
      padding: 10px 14px;
      display: none;
      max-height: 140px;
      overflow-y: auto;
    }

    .req-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(3, 20, 17, 0.9);
      border: 1px solid rgba(52, 211, 153, 0.4);
      padding: 8px 12px;
      border-radius: 12px;
      margin-top: 6px;
    }

    .btn-accept {
      background: #10b981;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Conversations List */
    .chat-list-view {
      flex: 1;
      min-height: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .chat-user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(6, 43, 37, 0.75);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 14px;
      padding: 10px 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .chat-user-item:hover {
      background: rgba(16, 185, 129, 0.25);
      border-color: #34d399;
    }

    .chat-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #34d399;
      object-fit: cover;
      background: #031411;
      pointer-events: none;
      flex-shrink: 0;
    }

    /* Active Conversation View */
    .active-chat-view {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .active-chat-header-bar {
      height: 54px;
      background: rgba(4, 28, 23, 0.95);
      border-bottom: 1px solid rgba(52, 211, 153, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
    }

    .messages-area {
      flex: 1;
      min-height: 0;
      padding: 12px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .e2e-badge-wrap {
      text-align: center;
      margin: 4px 0;
    }

    .e2e-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #a7f3d0;
    }

    .msg-bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 0.86rem;
      line-height: 1.35;
      word-break: break-word;
      position: relative;
      cursor: pointer;
    }

    .msg-incoming {
      align-self: flex-start;
      background: rgba(6, 43, 37, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.25);
      color: #e2e8f0;
      border-bottom-left-radius: 3px;
    }

    .msg-outgoing {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.45), rgba(5, 150, 105, 0.55));
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #ffffff;
      border-bottom-right-radius: 3px;
    }

    /* Message Reactions Badge */
    .msg-reaction-tag {
      position: absolute;
      bottom: -9px;
      right: 8px;
      background: rgba(3, 20, 17, 0.95);
      border: 1px solid #34d399;
      border-radius: 12px;
      padding: 1px 5px;
      font-size: 0.72rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      display: inline-flex;
      align-items: center;
      gap: 2px;
      z-index: 5;
    }

    .chat-media-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      margin-top: 4px;
      border: 1px solid rgba(52, 211, 153, 0.4);
      display: block;
      cursor: pointer;
    }

    .chat-media-video {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      margin-top: 4px;
      outline: none;
      background: #000;
      cursor: pointer;
    }

    /* IN-APP FULLSCREEN MEDIA VIEWER MODAL */
    .fullscreen-media-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .fullscreen-media-modal img, .fullscreen-media-modal video {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    /* ==========================================
       LONG PRESS CONTEXT MENU & EMOJI BAR
       ========================================== */
    .context-menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 2100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(6px);
    }

    .context-menu-box {
      background: rgba(6, 43, 37, 0.98);
      border: 1.5px solid #34d399;
      border-radius: 22px;
      width: 100%;
      max-width: 380px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9);
    }

    .emoji-reaction-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(3, 20, 17, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 30px;
      padding: 6px 10px;
      margin-bottom: 4px;
    }

    .emoji-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    .emoji-btn:active {
      transform: scale(1.3);
    }

    .context-actions-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .context-menu-btn {
      background: rgba(3, 20, 17, 0.9);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #ffffff;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .context-menu-btn:hover {
      background: rgba(16, 185, 129, 0.35);
      border-color: #34d399;
    }

    .shared-id-card {
      background: rgba(3, 20, 17, 0.8);
      border: 1px solid #34d399;
      border-radius: 10px;
      padding: 8px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Bottom Input Bar */
    .chat-input-bar {
      flex-shrink: 0;
      padding: 8px 12px;
      background: rgba(3, 20, 17, 0.98);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(52, 211, 153, 0.25);
      display: flex;
      gap: 8px;
      align-items: center;
      position: relative;
    }

    .chat-input {
      flex: 1;
      height: 40px;
      background: rgba(6, 43, 37, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 22px;
      padding: 0 14px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .chat-input:focus {
      border-color: #34d399;
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.3);
    }

    .send-btn, .attach-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .send-btn {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .attach-btn {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #34d399;
    }

    /* Attach Menu Popup */
    .attach-menu {
      position: absolute;
      bottom: 58px;
      left: 12px;
      background: rgba(6, 43, 37, 0.95);
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 16px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      z-index: 50;
    }

    .attach-option {
      background: rgba(3, 20, 17, 0.6);
      border: none;
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .attach-option:hover {
      background: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    /* ==========================================
       FLOATING BOTTOM NAVIGATION DOCK
       ========================================== */
    .bottom-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 480px;
      height: 66px;
      background: rgba(4, 28, 23, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid #34d399;
      border-radius: 35px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 90;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(52, 211, 153, 0.35);
      padding: 0 10px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      gap: 4px;
      padding: 6px 18px;
      border-radius: 20px;
      transition: all 0.25s ease;
    }

    .nav-item:active {
      transform: scale(0.92);
    }

    .nav-item.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.45), rgba(6, 78, 59, 0.65));
      border: 1px solid #34d399;
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.5);
    }

    .nav-item:not(.active):hover {
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body oncontextmenu="return false;">

  <!-- 3D CAPSULE CRACK OVERLAY (JS CONTROLLED) -->
  <div id="capsuleSplashOverlay">
    <div class="capsule-wrapper-3d">
      <div class="capsule-half-shell capsule-shell-left" id="capShellLeft"></div>
      <div class="capsule-energy-core" id="capEnergyCore"></div>
      <div class="capsule-half-shell capsule-shell-right" id="capShellRight"></div>
    </div>
    <div class="capsule-badge-label" id="capBadgeLabel">D-PHARMA PORTAL</div>
  </div>

  <!-- Background Rain -->
  <div class="rain-container" id="rainContainer"></div>

  <!-- REALTIME SMART NOTIFICATION BANNER (HOME & DPG STYLE) -->

    // ==========================================

          clients.matchAll({ type: 'window', includeUncontrolled: true }).then(function(clientList) {
            for (let i = 0; i < clientList.length; i++) {

            }
            if (clients.openWindow) {
              return clients.openWindow(event.notification.data ? event.notification.data.url : 'chats.html');
            }
          })
        );
      });
    `;

    if ('serviceWorker' in navigator) {

    // ==========================================

    window.addEventListener('DOMContentLoaded', triggerCapsuleIntroAnimation);

    // ==========================================

    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // Fullscreen API (Double click/tap toggle)
    document.addEventListener('dblclick', function(e) {
      if (['INPUT', 'BUTTON', 'TEXTAREA', 'A', 'VIDEO'].includes(e.target.tagName)) return;
      
      const doc = window.document;
      const docEl = doc.documentElement;

      const req = docEl.requestFullscreen || 
                  docEl.mozRequestFullScreen || 
                  docEl.webkitRequestFullScreen || 
                  docEl.msRequestFullscreen;

      const exit = doc.exitFullscreen || 
                   doc.mozCancelFullScreen || 
                   doc.webkitExitFullscreen || 
                   doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (req) req.call(docEl).catch(() => {});
      } else {
        if (exit) exit.call(doc);
      }
    });

    // ==========================================
    // 0. CLOUDINARY CONFIGURATION
    // ==========================================
    const CLOUDINARY_CLOUD_NAME = "glkgivxq"; 
    const CLOUDINARY_UPLOAD_PRESET = "mnyrwkag";

    // 1. FIREBASE CONFIG
    const firebaseConfig = {

    // ==========================================

    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    ['touchstart', 'click', 'keydown'].forEach(evt => window.addEventListener(evt, initAudioContext, { once: true }));

    function playBeepSound(frequency = 1200, duration = 0.2) {
      try {
        initAudioContext();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function triggerNotificationAlert() {
      try {
        if (navigator.vibrate) navigator.vibrate([40, 60, 100]);
      } catch (e) {}

      try {
        initAudioContext();
        const playTone = (freq, start, duration) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.connect(audioCtx.destination);
          osc.connect(gain);
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.35, start + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
          osc.start(start);
          osc.stop(start + duration);
        };

        const t = audioCtx.currentTime;
        playTone(880, t, 0.18);
        playTone(1318.5, t + 0.09, 0.35);
      } catch (e) {}
    }

    function sendSmartNotification({ title, message, photo, redirectUrl = 'chats.html' }) {
      const defaultPhoto = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

      if (document.hidden) {
        if ('Notification' in window && Notification.permission === 'granted') {
          navigator.serviceWorker.ready.then(registration => {
            registration.showNotification(title, {
              body: message,
              icon: photo || defaultPhoto,
              badge: photo || defaultPhoto,
              vibrate: [100, 50, 100],
              data: { url: redirectUrl }
            });
          }).catch(() => {
            new Notification(title, { body: message, icon: photo || defaultPhoto });
          });
        }
        return;
      }

      const banner = document.getElementById('topNotificationBanner');
      const bannerTitle = document.getElementById('bannerTitle');
      const bannerSub = document.getElementById('bannerSub');
      const bannerPhoto = document.getElementById('bannerSenderPhoto');

      bannerTitle.innerText = title;
      bannerSub.innerText = message;
      bannerPhoto.src = photo || defaultPhoto;
      currentBannerRedirectUrl = redirectUrl;

      banner.classList.add('show');
      triggerNotificationAlert();

      clearTimeout(bannerHideTimer);
      bannerHideTimer = setTimeout(() => {
        banner.classList.remove('show');
      }, 4000);
    }

    function handleNotificationClick() {
      const banner = document.getElementById('topNotificationBanner');
      banner.classList.remove('show');
      if (currentBannerRedirectUrl) {
        window.location.href = currentBannerRedirectUrl;
      }
    }

    // 4. DEVICE-BOUND E2EE ENGINE
    function getDeviceKey() {
      let key = localStorage.getItem('_dp_device_e2e_key');
      if (!key) {
        key = 'DPKEY_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('_dp_device_e2e_key', key);
      }
      return key;
    }
    const currentDeviceKey = getDeviceKey();

    function encryptPayload(rawText, dKey) {
      let result = '';
      for (let i = 0; i < rawText.length; i++) {
        const charCode = rawText.charCodeAt(i) ^ dKey.charCodeAt(i % dKey.length);
        result += String.fromCharCode(charCode);
      }
      return btoa(encodeURIComponent(result));
    }

    function decryptPayload(cipher, dKey) {
      try {
        const decoded = decodeURIComponent(atob(cipher));
        let result = '';
        for (let i = 0; i < decoded.length; i++) {
          const charCode = decoded.charCodeAt(i) ^ dKey.charCodeAt(i % dKey.length);
          result += String.fromCharCode(charCode);
        }
        return result;
      } catch (e) {
        return null;
      }
    }

    // 5. INCOMING REQUESTS
    function listenIncomingRequests() {
      if (!loggedAccount) return;
      db.collection('chatRequests')
        .where('status', '==', 'pending')
        .onSnapshot((snap) => {
          const wrap = document.getElementById('requestsWrap');
          const list = document.getElementById('requestsList');
          list.innerHTML = '';
          let count = 0;

          snap.forEach((doc) => {
            const req = doc.data();
            const toE = (req.toEmail || req.to || '').toLowerCase();
            const toId = req.toId || '';

            if (toE === loggedAccount || toId === loggedAccount || (myStudentDocId && toId === myStudentDocId)) {
              count++;
              const senderEmail = (req.fromEmail || req.from || '').toLowerCase();
              const senderName = req.fromName || senderEmail;
              const senderUid = req.fromUid || '';

              const div = document.createElement('div');
              div.className = 'req-item';
              div.innerHTML = `
                <div>
                  <strong style="font-size:0.85rem; color:#fff;">${senderName}</strong>
                  <div style="font-size:0.7rem; color:#94a3b8;">${senderEmail} sent request</div>
                </div>
                <button class="btn-accept" onclick="acceptChatRequest('${doc.id}', '${senderEmail}', '${senderUid}')">Accept</button>
              `;
              list.appendChild(div);
            }
          });

          wrap.style.display = count > 0 ? 'block' : 'none';
        });
    }

    async function acceptChatRequest(reqDocId, senderAccount, senderUid) {
      try {
        await db.collection('chatRequests').doc(reqDocId).update({ status: 'accepted' });

        const cleanA = loggedAccount.replace(/[^a-zA-Z0-9]/g, '_');
        const cleanB = senderAccount.replace(/[^a-zA-Z0-9]/g, '_');
        const roomId = [cleanA, cleanB].sort().join('___');

        const participantsArray = [currentUser.uid, loggedAccount, senderAccount];
        if (senderUid) participantsArray.push(senderUid);

        await db.collection('friendships').doc(roomId).set({
          user1: loggedAccount,
          user2: senderAccount,
          roomId: roomId,
          participants: participantsArray,
          establishedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        await db.collection('chats').doc(roomId).set({
          participants: participantsArray,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        alert("Chat Request Accepted!");
        loadConversations();
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    // ==========================================
    // 6. CONVERSATIONS MANAGEMENT (FIREBASE REAL DATA MATCH)
    // ==========================================
    let activeChatRoomId = null;
    let targetUserData = null;
    let msgListenerUnsub = null;

    async function loadConversations() {
      const friendsList = document.getElementById('friendsList');
      if (!loggedAccount) return;

      try {
        const q1 = await db.collection('friendships').where('user1', '==', loggedAccount).get();
        const q2 = await db.collection('friendships').where('user2', '==', loggedAccount).get();

        const peerAccounts = new Set();
        q1.forEach(d => peerAccounts.add(d.data().user2));
        q2.forEach(d => peerAccounts.add(d.data().user1));

        const urlParams = new URLSearchParams(window.location.search);
        const directTarget = urlParams.get('to');
        if (directTarget) peerAccounts.add(directTarget.toLowerCase());

        const savedActivePeer = sessionStorage.getItem('activeChatPeer');
        if (savedActivePeer) peerAccounts.add(savedActivePeer.toLowerCase());

        if (peerAccounts.size === 0) {
          friendsList.innerHTML = "<p style='color:#94a3b8; font-size:0.8rem; padding:10px;'>No accepted conversations yet.</p>";
          return;
        }

        acceptedChatsListCache = [];
        const defaultPhoto = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

        for (let peer of peerAccounts) {
          let realName = peer;
          let enrollNo = "N/A";
          let photoUrl = defaultPhoto;
          let peerUid = "";

          let sSnap = await db.collection('students').where('email', '==', peer).get();
          if (!sSnap.empty) {
            const sData = sSnap.docs[0].data();
            realName = sData.name || sData.fullName || sData.realName || peer;
            enrollNo = sData.enroll || sData.enrollment || sData.enrollmentNo || sData.enrollNo || sData.rollNo || "N/A";
            if (sData.photo || sData.profilePic || sData.avatar || sData.photoURL) {
              photoUrl = sData.photo || sData.profilePic || sData.avatar || sData.photoURL;
            }
            peerUid = sData.uid || sSnap.docs[0].id;
          }

          acceptedChatsListCache.push({
            peer: peer,
            name: realName,
            enroll: enrollNo,
            photo: photoUrl,
            peerUid: peerUid
          });
        }

        renderFilteredAcceptedChats(acceptedChatsListCache);

        if (savedActivePeer) {
          const found = acceptedChatsListCache.find(x => x.peer.toLowerCase() === savedActivePeer.toLowerCase());
          if (found) openActiveChat(found.peer, found.name, found.photo, found.peerUid, found.enroll);
        } else if (directTarget) {
          const found = acceptedChatsListCache.find(x => x.peer.toLowerCase() === directTarget.toLowerCase());
          if (found) openActiveChat(found.peer, found.name, found.photo, found.peerUid, found.enroll);
        }
      } catch (err) {
        console.error("Error loading conversations:", err);
      }
    }

    function renderFilteredAcceptedChats(list) {
      const friendsList = document.getElementById('friendsList');
      friendsList.innerHTML = '';

      if (list.length === 0) {
        friendsList.innerHTML = "<p style='color:#94a3b8; font-size:0.8rem; padding:10px;'>No matching accepted chats found.</p>";
        return;
      }

      const defaultPhoto = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

      list.forEach(({ peer, name, enroll, photo, peerUid }) => {
        const item = document.createElement('div');
        item.className = 'chat-user-item';
        item.onclick = () => openActiveChat(peer, name, photo, peerUid, enroll);
        item.innerHTML = `
          <img src="${photo}" class="chat-avatar" alt="${name}" onerror="this.onerror=null; this.src='${defaultPhoto}';" />
          <div style="flex:1; min-width:0;">
            <strong style="font-size:0.92rem; color:#ffffff; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${name}</strong>
            <div style="font-size:0.72rem; color:#94a3b8; display:flex; align-items:center; gap:6px; margin-top:3px;">
              <span style="background:rgba(52,211,153,0.15); color:#34d399; padding:2px 7px; border-radius:6px; font-weight:700; font-size:0.68rem; border:1px solid rgba(52,211,153,0.35);">
                🪪 ${enroll}
              </span>
              <span style="color:#64748b;">•</span>
              <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#cbd5e1;">${peer}</span>
            </div>
          </div>
        `;
        friendsList.appendChild(item);
      });
    }

    function filterAcceptedChats(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        renderFilteredAcceptedChats(acceptedChatsListCache);
        return;
      }
      const filtered = acceptedChatsListCache.filter(item => {
        return item.name.toLowerCase().includes(q) || 
               item.peer.toLowerCase().includes(q) || 
               item.enroll.toLowerCase().includes(q);
      });
      renderFilteredAcceptedChats(filtered);
    }

    async function openActiveChat(peerAccount, peerName, peerPhoto, peerUid = "", peerEnroll = "") {
      sessionStorage.setItem('activeChatPeer', peerAccount);

      targetUserData = {
        email: peerAccount,
        name: peerName,
        photo: peerPhoto,
        uid: peerUid,
        enroll: peerEnroll
      };

      const idA = loggedAccount.replace(/[^a-zA-Z0-9]/g, '_');
      const idB = peerAccount.replace(/[^a-zA-Z0-9]/g, '_');
      activeChatRoomId = [idA, idB].sort().join('___');

      document.getElementById('chatTargetName').innerText = peerName;
      document.getElementById('chatTargetStatus').innerText = peerEnroll && peerEnroll !== "N/A" 
        ? `🪪 ${peerEnroll} ● Online & Encrypted` 
        : "● Online & Firebase Encrypted";
      
      const avatarEl = document.getElementById('chatTargetAvatar');
      avatarEl.src = peerPhoto;
      avatarEl.onerror = function() {
        this.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
      };

      document.getElementById('chatListView').style.display = 'none';
      document.getElementById('requestsWrap').style.display = 'none';
      document.getElementById('activeChatView').style.display = 'flex';

      const participants = [currentUser.uid, loggedAccount, peerAccount];
      if (peerUid) participants.push(peerUid);

      await db.collection('chats').doc(activeChatRoomId).set({
        participants: participants,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(() => {});

      listenMessages();
    }

    function exitActiveChat() {
      sessionStorage.removeItem('activeChatPeer');
      if (msgListenerUnsub) msgListenerUnsub();
      activeChatRoomId = null;
      targetUserData = null;
      document.getElementById('activeChatView').style.display = 'none';
      document.getElementById('chatListView').style.display = 'flex';
      listenIncomingRequests();
      loadConversations();
    }

    // 7. ATTACHMENT & MEDIA HANDLING (CLOUDINARY)
    function toggleAttachMenu() {
      const menu = document.getElementById('attachMenu');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    async function handleCloudinaryUpload(e, fileType) {
      const file = e.target.files[0];
      if (!file) return;
      toggleAttachMenu();

      if (fileType === 'video' && file.size > 50 * 1024 * 1024) {
        alert("Maximum video limit is 50MB.");
        return;
      }

      const resourceFolder = fileType === 'image' ? 'image' : (fileType === 'video' ? 'video' : 'raw');

      sendSmartNotification({
        title: "Uploading Attachment",
        message: `Uploading file to secure cloud...`,
        photo: targetUserData?.photo
      });

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceFolder}/upload`, {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        if (data.secure_url) {
          const typeToRecord = fileType === 'raw' ? 'file' : fileType;
          sendEncryptedRecord(typeToRecord, data.secure_url, file.name);
        } else {
          throw new Error(data.error?.message || "Upload failed");
        }
      } catch (err) {
        alert("Upload error: " + err.message);
      }
      e.target.value = '';
    }

    function promptSendLink() {
      toggleAttachMenu();
      const link = prompt("Enter URL link (e.g. https://...):");
      if (link && link.trim()) {
        sendEncryptedRecord('link', link.trim());
      }
    }

    async function promptShareStudentID() {
      toggleAttachMenu();
      const searchKey = prompt("Enter Student Enrollment No or Gmail:");
      if (!searchKey) return;
      let sSnap = await db.collection('students').where('enroll', '==', searchKey.trim().toUpperCase()).get();
      if (sSnap.empty) {
        sSnap = await db.collection('students').where('email', '==', searchKey.trim().toLowerCase()).get();
      }
      if (sSnap.empty) {
        alert("Student record not found!");
        return;
      }
      const s = sSnap.docs[0].data();
      const payload = JSON.stringify({
        name: s.name || s.fullName || 'Student',
        enroll: s.enroll || s.enrollment || 'N/A',
        email: s.email,
        photo: s.photo || s.profilePic || ''
      });
      sendEncryptedRecord('contact_card', payload);
    }

    async function sendEncryptedRecord(type, dataContent, extraFileName = "") {
      if (!activeChatRoomId || !targetUserData || !currentUser) return;
      const jsonPayload = JSON.stringify({ type: type, data: dataContent, fileName: extraFileName });
      const cipher = encryptPayload(jsonPayload, currentDeviceKey);

      await db.collection('chats').doc(activeChatRoomId).collection('messages').add({
        sender: loggedAccount,
        senderId: currentUser.uid,
        receiver: targetUserData.email,
        cipher: cipher,
        deviceKey: currentDeviceKey,
        reaction: "",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    document.getElementById('sendMsgForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      sendEncryptedRecord('text', text);
      input.value = '';
    });

    // ==========================================
    // LONG PRESS CONTEXT MENU & EMOJI REACTIONS
    // ==========================================
    let contextTarget = {
      docId: "",
      type: "text",
      content: "",
      isMe: false
    };

    function openUniversalContextMenu(docId, type, content, isMe) {
      playBeepSound(1200, 0.2);
      contextTarget = { docId, type, content, isMe };

      const container = document.getElementById('contextActionsContainer');
      container.innerHTML = '';

      const isMedia = ['image', 'video', 'file'].includes(type);

      if (isMedia) {
        // Media Action 1: Download
        const dlBtn = document.createElement('button');
        dlBtn.className = 'context-menu-btn';
        dlBtn.innerText = '📥 Download';
        dlBtn.onclick = () => downloadMediaContent(content);
        container.appendChild(dlBtn);

        // Media Action 2: Share
        const shBtn = document.createElement('button');
        shBtn.className = 'context-menu-btn';
        shBtn.innerText = '🔗 Share Link';
        shBtn.onclick = () => shareMediaLink(content);
        container.appendChild(shBtn);

        // Media Action 3: Unsend (Sender) or Delete (Receiver)
        const delBtn = document.createElement('button');
        delBtn.className = 'context-menu-btn';
        if (isMe) {
          delBtn.innerText = '🗑️ Unsend Message';
          delBtn.style.color = '#fca5a5';
          delBtn.style.borderColor = 'rgba(239,68,68,0.4)';
          delBtn.onclick = () => deleteOrUnsendMessage(docId, true);
        } else {
          delBtn.innerText = '🗑️ Delete Message';
          delBtn.style.color = '#fca5a5';
          delBtn.style.borderColor = 'rgba(239,68,68,0.4)';
          delBtn.onclick = () => deleteOrUnsendMessage(docId, false);
        }
        container.appendChild(delBtn);
      } else {
        // Text Action 1: Copy
        const cpBtn = document.createElement('button');
        cpBtn.className = 'context-menu-btn';
        cpBtn.innerText = '📋 Copy Text';
        cpBtn.onclick = () => copyTextContent(content);
        container.appendChild(cpBtn);

        // Text Action 2: Unsend (Sender) or Delete (Receiver)
        const delBtn = document.createElement('button');
        delBtn.className = 'context-menu-btn';
        if (isMe) {
          delBtn.innerText = '🗑️ Unsend Text';
          delBtn.style.color = '#fca5a5';
          delBtn.style.borderColor = 'rgba(239,68,68,0.4)';
          delBtn.onclick = () => deleteOrUnsendMessage(docId, true);
        } else {
          delBtn.innerText = '🗑️ Delete Text';
          delBtn.style.color = '#fca5a5';
          delBtn.style.borderColor = 'rgba(239,68,68,0.4)';
          delBtn.onclick = () => deleteOrUnsendMessage(docId, false);
        }
        container.appendChild(delBtn);
      }

      document.getElementById('contextMenuOverlay').style.display = 'flex';
    }

    function closeContextMenu() {
      document.getElementById('contextMenuOverlay').style.display = 'none';
      contextTarget = { docId: "", type: "text", content: "", isMe: false };
    }

    async function applyEmojiReaction(emoji) {
      if (!contextTarget.docId || !activeChatRoomId) return;
      try {
        await db.collection('chats').doc(activeChatRoomId).collection('messages').doc(contextTarget.docId).update({
          reaction: emoji
        });
      } catch (e) {
        console.error("Emoji error:", e);
      }
      closeContextMenu();
    }

    function copyTextContent(text) {
      navigator.clipboard.writeText(text);
      alert("Text copied to clipboard!");
      closeContextMenu();
    }

    function downloadMediaContent(url) {
      if (!url) return;
      const a = document.createElement('a');
      a.href = url;
      a.download = 'DPharma_Media_' + Date.now();
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      closeContextMenu();
    }

    function shareMediaLink(url) {
      if (!url) return;
      navigator.clipboard.writeText(url);
      alert("Link copied securely to clipboard!");
      closeContextMenu();
    }

    async function deleteOrUnsendMessage(docId, isUnsend) {
      if (!docId || !activeChatRoomId) return;
      const actionName = isUnsend ? "unsend" : "delete";
      if (!confirm(`Are you sure you want to ${actionName} this message?`)) return;

      try {
        await db.collection('chats').doc(activeChatRoomId).collection('messages').doc(docId).delete();
        alert(`Message ${actionName}ed successfully!`);
      } catch (err) {
        alert("Failed to delete message: " + err.message);
      }
      closeContextMenu();
    }

    function attachUniversalLongPress(element, docId, type, content, isMe) {
      let pressTimer = null;
      const startPress = () => {
        pressTimer = setTimeout(() => openUniversalContextMenu(docId, type, content, isMe), 1200);
      };
      const cancelPress = () => clearTimeout(pressTimer);

      element.onmousedown = startPress;
      element.onmouseup = cancelPress;
      element.onmouseleave = cancelPress;

      element.ontouchstart = startPress;
      element.ontouchend = cancelPress;
    }

    // Media Modal Functions
    function openMediaModal(url, type) {
      const container = document.getElementById('mediaModalContentContainer');
      container.innerHTML = '';
      if (type === 'image') {
        const img = document.createElement('img');
        img.src = url;
        container.appendChild(img);
      } else if (type === 'video') {
        const vid = document.createElement('video');
        vid.src = url;
        vid.controls = true;
        vid.autoplay = true;
        container.appendChild(vid);
      }
      document.getElementById('mediaModalOverlay').style.display = 'flex';
    }

    function closeMediaModal() {
      document.getElementById('mediaModalOverlay').style.display = 'none';
      document.getElementById('mediaModalContentContainer').innerHTML = '';
    }

    // ==========================================
    // 8. REALTIME MESSAGES ENGINE (FIREBASE FIRESTORE)
    // ==========================================
    let isInitialLoad = true;

    function listenMessages() {
      if (msgListenerUnsub) msgListenerUnsub();
      isInitialLoad = true;

      msgListenerUnsub = db.collection('chats').doc(activeChatRoomId).collection('messages')
        .orderBy('createdAt', 'asc')
        .onSnapshot((snap) => {
          let hasNewIncomingMsg = false;

          snap.docChanges().forEach((change) => {
            if (change.type === 'added' && !isInitialLoad) {
              const data = change.doc.data();
              const isMe = data.sender === loggedAccount || data.senderId === currentUser?.uid;
              if (!isMe) hasNewIncomingMsg = true;
            }
          });

          const box = document.getElementById('messagesBox');
          box.innerHTML = `
            <div class="e2e-badge-wrap">
              <span class="e2e-badge">
                🛡️ Messages are end-to-end encrypted in Firebase Firestore.
              </span>
            </div>
          `;

          snap.forEach((doc) => {
            const m = doc.data();
            const docId = doc.id;
            const isMe = m.sender === loggedAccount || m.senderId === currentUser?.uid;
            const messageReaction = m.reaction || "";

            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${isMe ? 'msg-outgoing' : 'msg-incoming'}`;

            let clearText = null;
            if (isMe) {
              if (m.deviceKey === currentDeviceKey) {
                clearText = decryptPayload(m.cipher, currentDeviceKey);
              }
            } else {
              clearText = decryptPayload(m.cipher, m.deviceKey);
            }

            if (!clearText) {
              bubble.innerHTML = `<span style="font-size:0.75rem; color:#fca5a5;">🔒 Encrypted on another device</span>`;
            } else {
              try {
                const parsed = JSON.parse(clearText);
                const msgType = parsed.type;
                const msgData = parsed.data;

                if (msgType === 'text') {
                  bubble.innerText = msgData;
                  attachUniversalLongPress(bubble, docId, 'text', msgData, isMe);
                } else if (msgType === 'image') {
                  const img = document.createElement('img');
                  img.src = msgData;
                  img.className = 'chat-media-img';
                  img.onclick = () => openMediaModal(msgData, 'image');
                  bubble.appendChild(img);
                  attachUniversalLongPress(bubble, docId, 'image', msgData, isMe);
                } else if (msgType === 'video') {
                  const vid = document.createElement('video');
                  vid.src = msgData;
                  vid.className = 'chat-media-video';
                  vid.controls = true;
                  bubble.appendChild(vid);
                  attachUniversalLongPress(bubble, docId, 'video', msgData, isMe);
                } else if (msgType === 'file') {
                  const fileName = parsed.fileName || "Download Document";
                  bubble.innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px;">
                      <span style="font-size:1.2rem;">📁</span>
                      <div>
                        <strong style="font-size:0.85rem; color:#ffffff;">${fileName}</strong>
                        <div style="font-size:0.7rem; color:#34d399;">Tap to view file</div>
                      </div>
                    </div>
                  `;
                  bubble.onclick = () => window.open(msgData, '_blank');
                  attachUniversalLongPress(bubble, docId, 'file', msgData, isMe);
                } else if (msgType === 'link') {
                  bubble.innerHTML = `<a href="${msgData}" target="_blank" style="color:#38bdf8; text-decoration:underline;">🔗 ${msgData}</a>`;
                  attachUniversalLongPress(bubble, docId, 'text', msgData, isMe);
                } else if (msgType === 'contact_card') {
                  const card = JSON.parse(msgData);
                  bubble.innerHTML = `
                    <div class="shared-id-card">
                      <img src="${card.photo || document.getElementById('chatTargetAvatar').src}" style="width:36px; height:36px; border-radius:50%; object-fit:cover;" />
                      <div>
                        <strong>${card.name}</strong>
                        <div style="font-size:0.7rem; color:#94a3b8;">${card.enroll} | ${card.email}</div>
                      </div>
                    </div>
                  `;
                  attachUniversalLongPress(bubble, docId, 'text', `Student Card: ${card.name} (${card.enroll})`, isMe);
                }

                // If Reaction exists, render badge
                if (messageReaction) {
                  const rBadge = document.createElement('div');
                  rBadge.className = 'msg-reaction-tag';
                  rBadge.innerText = messageReaction;
                  bubble.appendChild(rBadge);
                }

              } catch(e) {
                bubble.innerText = clearText;
                attachUniversalLongPress(bubble, docId, 'text', clearText, isMe);
              }
            }
            box.appendChild(bubble);
          });

          box.scrollTop = box.scrollHeight;

          if (hasNewIncomingMsg) {
            sendSmartNotification({
              title: targetUserData ? targetUserData.name : 'New Message',
              message: 'Sent you a new encrypted update',
              photo: targetUserData?.photo,
              redirectUrl: 'chats.html'
            });
          }

          isInitialLoad = false;
        });
    }

    // 9. BACKGROUND ANIMATION
    const colorfulMedicines = [
      `<svg viewBox="0 0 32 32"><g transform="rotate(-30 16 16)"><path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#ef4444" opacity="0.65"/><path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#ffffff" opacity="0.65"/><rect x="9.5" y="15" width="13" height="2" fill="#b91c1c" opacity="0.6" rx="1"/></g></svg>`,
      `<svg viewBox="0 0 32 32"><g transform="rotate(25 16 16)"><path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#0f172a" opacity="0.75"/><path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#10b981" opacity="0.7"/><rect x="9.5" y="15" width="13" height="2" fill="#34d399" opacity="0.7" rx="1"/></g></svg>`,
      `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="#0ea5e9" opacity="0.5" stroke="#38bdf8" stroke-width="1.5"/><line x1="8" y1="16" x2="24" y2="16" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8"/></svg>`
    ];

    const rainContainer = document.getElementById('rainContainer');
    for (let i = 0; i < 24; i++) {
      const drop = document.createElement('div');
      drop.className = 'medicine-drop';
      drop.innerHTML = colorfulMedicines[i % colorfulMedicines.length];
      const size = Math.floor(Math.random() * 20) + 24;
      drop.style.width = size + 'px';
      drop.style.height = size + 'px';
      drop.style.left = (i * 4 + Math.random() * 4) + '%';
      drop.style.animationDuration = (Math.random() * 6 + 10) + 's';
      drop.style.animationDelay = '-' + (Math.random() * 10) + 's';
      rainContainer.appendChild(drop);
    }
  </script>
