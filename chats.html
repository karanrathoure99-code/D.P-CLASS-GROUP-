<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>D Pharma Portal - Secure Chats</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at center, #05241f 0%, #020f0d 100%);
      color: #ffffff;
      position: relative;
    }

    /* Falling Medicines Rain */
    .rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .medicine-drop {
      position: absolute;
      top: -90px;
      animation: slowRain linear infinite;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
    }

    @keyframes slowRain {
      0% { transform: translateY(-90px) rotate(0deg); opacity: 0; }
      12% { opacity: 0.85; }
      88% { opacity: 0.85; }
      100% { transform: translateY(112vh) rotate(360deg); opacity: 0; }
    }

    .app-container {
      position: relative;
      z-index: 2;
      max-width: 720px;
      margin: 0 auto;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Notification Banner */
    .notif-banner {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(6, 43, 37, 0.95);
      border: 1px solid #34d399;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 300;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.3s ease;
      font-size: 0.84rem;
      max-width: 90%;
    }

    .notif-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Top Header */
    .chat-header {
      flex-shrink: 0;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(6, 43, 37, 0.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(52, 211, 153, 0.25);
    }

    .user-profile-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #34d399;
      object-fit: cover;
      background: #031411;
      pointer-events: none;
    }

    .header-icons {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #34d399;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .icon-btn:hover {
      background: rgba(16, 185, 129, 0.45);
      color: #fff;
    }

    /* Main View Area */
    .main-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Incoming Requests Box */
    .requests-box {
      flex-shrink: 0;
      background: rgba(16, 185, 129, 0.15);
      border-bottom: 1px solid rgba(52, 211, 153, 0.35);
      padding: 10px 14px;
      display: none;
      max-height: 140px;
      overflow-y: auto;
    }

    .req-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(3, 20, 17, 0.9);
      border: 1px solid rgba(52, 211, 153, 0.4);
      padding: 8px 12px;
      border-radius: 12px;
      margin-top: 6px;
    }

    .btn-accept {
      background: #10b981;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Conversations List */
    .chat-list-view {
      flex: 1;
      min-height: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .chat-user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(6, 43, 37, 0.75);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 14px;
      padding: 10px 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .chat-user-item:hover {
      background: rgba(16, 185, 129, 0.25);
      border-color: #34d399;
    }

    /* Active Conversation View */
    .active-chat-view {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .messages-area {
      flex: 1;
      min-height: 0;
      padding: 12px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .e2e-badge-wrap {
      text-align: center;
      margin: 4px 0;
    }

    .e2e-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #a7f3d0;
    }

    .msg-bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 0.86rem;
      line-height: 1.35;
      word-break: break-word;
      position: relative;
    }

    .msg-incoming {
      align-self: flex-start;
      background: rgba(6, 43, 37, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.25);
      color: #e2e8f0;
      border-bottom-left-radius: 3px;
    }

    .msg-outgoing {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.45), rgba(5, 150, 105, 0.55));
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #ffffff;
      border-bottom-right-radius: 3px;
    }

    .chat-media-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      margin-top: 4px;
      border: 1px solid rgba(52, 211, 153, 0.4);
      display: block;
      cursor: pointer;
    }

    .chat-media-video {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      margin-top: 4px;
      outline: none;
    }

    .shared-id-card {
      background: rgba(3, 20, 17, 0.8);
      border: 1px solid #34d399;
      border-radius: 10px;
      padding: 8px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Bottom Input Bar */
    .chat-input-bar {
      flex-shrink: 0;
      padding: 8px 12px;
      background: rgba(3, 20, 17, 0.98);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(52, 211, 153, 0.25);
      display: flex;
      gap: 8px;
      align-items: center;
      position: relative;
    }

    .chat-input {
      flex: 1;
      height: 40px;
      background: rgba(6, 43, 37, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 22px;
      padding: 0 14px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .chat-input:focus {
      border-color: #34d399;
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.3);
    }

    .send-btn, .attach-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .send-btn {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .attach-btn {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #34d399;
    }

    /* Attach Menu Popup */
    .attach-menu {
      position: absolute;
      bottom: 58px;
      left: 12px;
      background: rgba(6, 43, 37, 0.95);
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 16px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      z-index: 50;
    }

    .attach-option {
      background: rgba(3, 20, 17, 0.6);
      border: none;
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .attach-option:hover {
      background: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    /* Real WebRTC Call Screen */
    .call-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #010a08;
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
    }

    .video-grid {
      width: 100%;
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #remoteStreamVideo {
      width: 100%;
      height: 100%;
      max-height: 70vh;
      border-radius: 16px;
      background: #031411;
      object-fit: cover;
    }

    #localStreamVideo {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 100px;
      height: 140px;
      border-radius: 12px;
      border: 2px solid #34d399;
      background: #000;
      object-fit: cover;
    }

    .call-control-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-top: 14px;
    }

    .btn-hangup {
      background: #ef4444;
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

        <div>

  <script>
    // 1. FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyCQ2XpoeeKwVmIZ2wp8H3D2xzTY49nhxAI",
      authDomain: "d-pharma-class-group.firebaseapp.com",
      projectId: "d-pharma-class-group",
      storageBucket: "d-pharma-class-group.firebasestorage.app",
      messagingSenderId: "870561978483",
      appId: "1:870561978483:web:095681d6185f43cd6d7206",
      measurementId: "G-VQ12Y4NLRJ"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let loggedAccount = '';
    let myStudentDocId = "";

    // 2. STRICT FIREBASE AUTH GUARD (Unauthorized redirection)
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('userAccount');
        window.location.replace('login.html');
        return;
      }

      currentUser = user;
      loggedAccount = (user.email || localStorage.getItem('userAccount') || '').trim().toLowerCase();

      try {
        const snap = await db.collection('students').where('email', '==', loggedAccount).get();
        if (!snap.empty) {
          myStudentDocId = snap.docs[0].id;
        }
      } catch (err) {
        console.warn("Could not find student doc id:", err);
      }

      listenIncomingRequests();
      loadConversations();
    });

    // 3. SOUND NOTIFICATION ENGINE
    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {}
    }

    function showNotification(senderName, previewText) {
      playBeepSound();
      const banner = document.getElementById('notifBanner');
      document.getElementById('notifText').innerText = `${senderName}: ${previewText}`;
      banner.classList.add('show');
      setTimeout(() => banner.classList.remove('show'), 3500);
    }

    // 4. DEVICE-BOUND E2EE ENGINE
    function getDeviceKey() {
      let key = localStorage.getItem('_dp_device_e2e_key');
      if (!key) {
        key = 'DPKEY_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('_dp_device_e2e_key', key);
      }
      return key;
    }
    const currentDeviceKey = getDeviceKey();

    function encryptPayload(rawText, dKey) {
      let result = '';
      for (let i = 0; i < rawText.length; i++) {
        const charCode = rawText.charCodeAt(i) ^ dKey.charCodeAt(i % dKey.length);
        result += String.fromCharCode(charCode);
      }
      return btoa(encodeURIComponent(result));
    }

    function decryptPayload(cipher, dKey) {
      try {
        const decoded = decodeURIComponent(atob(cipher));
        let result = '';
        for (let i = 0; i < decoded.length; i++) {
          const charCode = decoded.charCodeAt(i) ^ dKey.charCodeAt(i % dKey.length);
          result += String.fromCharCode(charCode);
        }
        return result;
      } catch (e) {
        return null;
      }
    }

    // 5. INCOMING REQUESTS LISTENER
    function listenIncomingRequests() {
      if (!loggedAccount) return;
      db.collection('chatRequests')
        .where('status', '==', 'pending')
        .onSnapshot((snap) => {
          const wrap = document.getElementById('requestsWrap');
          const list = document.getElementById('requestsList');
          list.innerHTML = '';
          let count = 0;

          snap.forEach((doc) => {
            const req = doc.data();
            const toE = (req.toEmail || req.to || '').toLowerCase();
            const toId = req.toId || '';

            if (toE === loggedAccount || toId === loggedAccount || (myStudentDocId && toId === myStudentDocId)) {
              count++;
              const senderEmail = (req.fromEmail || req.from || '').toLowerCase();
              const senderName = req.fromName || senderEmail;
              const senderUid = req.fromUid || '';

              const div = document.createElement('div');
              div.className = 'req-item';
              div.innerHTML = `
                <div>
                  <strong style="font-size:0.85rem; color:#fff;">${senderName}</strong>
                  <div style="font-size:0.7rem; color:#94a3b8;">${senderEmail} sent request</div>
                </div>
                <button class="btn-accept" onclick="acceptChatRequest('${doc.id}', '${senderEmail}', '${senderUid}')">Accept</button>
              `;
              list.appendChild(div);
            }
          });

          wrap.style.display = count > 0 ? 'block' : 'none';
        }, (err) => {
          console.warn("Requests snapshot notice:", err.message);
        });
    }

    async function acceptChatRequest(reqDocId, senderAccount, senderUid) {
      try {
        await db.collection('chatRequests').doc(reqDocId).update({ status: 'accepted' });

        const cleanA = loggedAccount.replace(/[^a-zA-Z0-9]/g, '_');
        const cleanB = senderAccount.replace(/[^a-zA-Z0-9]/g, '_');
        const roomId = [cleanA, cleanB].sort().join('___');

        const participantsArray = [currentUser.uid, loggedAccount, senderAccount];
        if (senderUid) participantsArray.push(senderUid);

        // Save in friendships
        await db.collection('friendships').doc(roomId).set({
          user1: loggedAccount,
          user2: senderAccount,
          roomId: roomId,
          participants: participantsArray,
          establishedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        // Save in chats collection with participants for security rules
        await db.collection('chats').doc(roomId).set({
          participants: participantsArray,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        alert("Chat Request Accepted! Room created permanently.");
        loadConversations();
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    // 6. LOAD ACCEPTED CONVERSATIONS
    let activeChatRoomId = null;
    let targetUserData = null;
    let msgListenerUnsub = null;

    async function loadConversations() {
      const friendsList = document.getElementById('friendsList');
      if (!loggedAccount) return;

      try {
        const q1 = await db.collection('friendships').where('user1', '==', loggedAccount).get();
        const q2 = await db.collection('friendships').where('user2', '==', loggedAccount).get();

        const peerAccounts = new Set();
        q1.forEach(d => peerAccounts.add(d.data().user2));
        q2.forEach(d => peerAccounts.add(d.data().user1));

        const urlParams = new URLSearchParams(window.location.search);
        const directTarget = urlParams.get('to');
        if (directTarget) peerAccounts.add(directTarget.toLowerCase());

        const savedActivePeer = sessionStorage.getItem('activeChatPeer');
        if (savedActivePeer) peerAccounts.add(savedActivePeer.toLowerCase());

        if (peerAccounts.size === 0) {
          friendsList.innerHTML = "<p style='color:#94a3b8; font-size:0.8rem; padding:10px;'>No accepted conversations yet.</p>";
          return;
        }

        friendsList.innerHTML = '';
        for (let peer of peerAccounts) {
          let name = peer;
          let photo = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
          let peerUid = "";

          let sSnap = await db.collection('students').where('email', '==', peer).get();
          if (!sSnap.empty) {
            const sData = sSnap.docs[0].data();
            name = sData.name || peer;
            peerUid = sData.uid || sSnap.docs[0].id;
            if (sData.photo) photo = sData.photo;
          }

          const item = document.createElement('div');
          item.className = 'chat-user-item';
          item.onclick = () => openActiveChat(peer, name, photo, peerUid);
          item.innerHTML = `
            <img src="${photo}" class="chat-avatar" alt="Avatar" />
            <div style="flex:1;">
              <strong style="font-size:0.92rem;">${name}</strong>
              <div style="font-size:0.7rem; color:#34d399;">Tap to chat securely</div>
            </div>
          `;
          friendsList.appendChild(item);

          if ((savedActivePeer && savedActivePeer.toLowerCase() === peer.toLowerCase()) || 
              (directTarget && directTarget.toLowerCase() === peer.toLowerCase())) {
            openActiveChat(peer, name, photo, peerUid);
          }
        }
      } catch (err) {
        console.error("loadConversations Error:", err);
        friendsList.innerHTML = "<p style='color:#ef4444; font-size:0.8rem; padding:10px;'>Error loading conversations.</p>";
      }
    }

    // 7. OPEN CHAT & SESSION PERSISTENCE
    async function openActiveChat(peerAccount, peerName, peerPhoto, peerUid = "") {
      sessionStorage.setItem('activeChatPeer', peerAccount);

      targetUserData = {
        email: peerAccount,
        name: peerName,
        photo: peerPhoto,
        uid: peerUid
      };

      const idA = loggedAccount.replace(/[^a-zA-Z0-9]/g, '_');
      const idB = peerAccount.replace(/[^a-zA-Z0-9]/g, '_');
      activeChatRoomId = [idA, idB].sort().join('___');

      document.getElementById('chatTargetName').innerText = peerName;
      document.getElementById('chatTargetStatus').innerText = "● Online & Encrypted";
      document.getElementById('chatTargetAvatar').src = peerPhoto;
      document.getElementById('headerCallActions').style.display = 'flex';

      document.getElementById('chatListView').style.display = 'none';
      document.getElementById('requestsWrap').style.display = 'none';
      document.getElementById('activeChatView').style.display = 'flex';

      // Ensure room has participants setup for Firestore security rule matching
      const participants = [currentUser.uid, loggedAccount, peerAccount];
      if (peerUid) participants.push(peerUid);

      await db.collection('chats').doc(activeChatRoomId).set({
        participants: participants,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(() => {});

      listenMessages();
    }

    function handleHeaderNav() {
      if (activeChatRoomId) {
        sessionStorage.removeItem('activeChatPeer');
        if (msgListenerUnsub) msgListenerUnsub();
        activeChatRoomId = null;
        targetUserData = null;
        document.getElementById('activeChatView').style.display = 'none';
        document.getElementById('headerCallActions').style.display = 'none';
        document.getElementById('chatTargetName').innerText = "Secure Chats";
        document.getElementById('chatTargetStatus').innerText = "🔒 Device-Bound Encrypted";
        document.getElementById('chatTargetAvatar').src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
        document.getElementById('chatListView').style.display = 'flex';
        listenIncomingRequests();
        loadConversations();
      } else {
        window.location.href = 'home.html';
      }
    }

    // 8. ATTACHMENT MENU LOGIC
    function toggleAttachMenu() {
      const menu = document.getElementById('attachMenu');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    function handleSendImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      toggleAttachMenu();

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const max = 720;
          let w = img.width, h = img.height;
          if (w > h && w > max) { h *= max / w; w = max; }
          else if (h > max) { w *= max / h; h = max; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const compressedB64 = canvas.toDataURL('image/jpeg', 0.68);
          sendEncryptedRecord('image', compressedB64);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleSendVideo(e) {
      const file = e.target.files[0];
      if (!file) return;
      toggleAttachMenu();
      if (file.size > 15 * 1024 * 1024) {
        alert("Video size must be less than 15MB!");
        return;
      }
      const reader = new FileReader();
      reader.onload = (evt) => {
        sendEncryptedRecord('video', evt.target.result);
      };
      reader.readAsDataURL(file);
    }

    function promptSendLink() {
      toggleAttachMenu();
      const link = prompt("Enter complete URL link (e.g. https://...):");
      if (link && link.trim()) {
        sendEncryptedRecord('link', link.trim());
      }
    }

    async function promptShareStudentID() {
      toggleAttachMenu();
      const searchKey = prompt("Enter Student Enrollment No or Gmail to share:");
      if (!searchKey) return;
      let sSnap = await db.collection('students').where('enroll', '==', searchKey.trim().toUpperCase()).get();
      if (sSnap.empty) {
        sSnap = await db.collection('students').where('email', '==', searchKey.trim().toLowerCase()).get();
      }
      if (sSnap.empty) {
        alert("Student not found!");
        return;
      }
      const s = sSnap.docs[0].data();
      const payload = JSON.stringify({
        name: s.name,
        enroll: s.enroll,
        email: s.email,
        photo: s.photo || ''
      });
      sendEncryptedRecord('contact_card', payload);
    }

    async function sendEncryptedRecord(type, dataContent) {
      if (!activeChatRoomId || !targetUserData || !currentUser) return;
      const jsonPayload = JSON.stringify({ type: type, data: dataContent });
      const cipher = encryptPayload(jsonPayload, currentDeviceKey);

      await db.collection('chats').doc(activeChatRoomId).collection('messages').add({
        sender: loggedAccount,
        senderId: currentUser.uid,
        receiver: targetUserData.email,
        cipher: cipher,
        deviceKey: currentDeviceKey,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    document.getElementById('sendMsgForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      sendEncryptedRecord('text', text);
      input.value = '';
    });

    // 9. REALTIME MESSAGES & NOTIFICATION ENGINE
    let isInitialLoad = true;

    function listenMessages() {
      if (msgListenerUnsub) msgListenerUnsub();
      isInitialLoad = true;

      msgListenerUnsub = db.collection('chats').doc(activeChatRoomId).collection('messages')
        .orderBy('createdAt', 'asc')
        .onSnapshot((snap) => {
          const box = document.getElementById('messagesBox');
          box.innerHTML = `
            <div class="e2e-badge-wrap">
              <span class="e2e-badge">
                🛡️ Messages are end-to-end encrypted to this specific physical device only.
              </span>
            </div>
          `;

          let lastDoc = null;
          snap.forEach((doc) => {
            const m = doc.data();
            const isMe = m.sender === loggedAccount || m.senderId === currentUser?.uid;
            lastDoc = m;

            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${isMe ? 'msg-outgoing' : 'msg-incoming'}`;

            let clearText = null;
            if (isMe) {
              if (m.deviceKey === currentDeviceKey) {
                clearText = decryptPayload(m.cipher, currentDeviceKey);
              }
            } else {
              clearText = decryptPayload(m.cipher, m.deviceKey);
            }

            if (!clearText) {
              bubble.innerHTML = `<span style="font-size:0.75rem; color:#fca5a5;">🔒 Encrypted on another device</span>`;
            } else {
              try {
                const parsed = JSON.parse(clearText);
                if (parsed.type === 'text') {
                  bubble.innerText = parsed.data;
                } else if (parsed.type === 'image') {
                  bubble.innerHTML = `<img src="${parsed.data}" class="chat-media-img" onclick="window.open('${parsed.data}')" />`;
                } else if (parsed.type === 'video') {
                  bubble.innerHTML = `<video src="${parsed.data}" controls class="chat-media-video"></video>`;
                } else if (parsed.type === 'link') {
                  bubble.innerHTML = `<a href="${parsed.data}" target="_blank" style="color:#38bdf8; text-decoration:underline;">🔗 ${parsed.data}</a>`;
                } else if (parsed.type === 'contact_card') {
                  const card = JSON.parse(parsed.data);
                  bubble.innerHTML = `
                    <div class="shared-id-card">
                      <img src="${card.photo || document.getElementById('chatTargetAvatar').src}" style="width:36px; height:36px; border-radius:50%; object-fit:cover;" />
                      <div>
                        <strong>${card.name}</strong>
                        <div style="font-size:0.7rem; color:#94a3b8;">${card.enroll} | ${card.email}</div>
                      </div>
                    </div>
                  `;
                }
              } catch(e) {
                bubble.innerText = clearText;
              }
            }
            box.appendChild(bubble);
          });

          if (!isInitialLoad && lastDoc && lastDoc.sender !== loggedAccount && lastDoc.senderId !== currentUser?.uid) {
            showNotification(targetUserData ? targetUserData.name : 'Incoming', 'New Message / Attachment');
          }
          isInitialLoad = false;
          box.scrollTop = box.scrollHeight;
        }, (err) => {
          console.error("Messages snapshot error:", err);
        });
    }

    // 10. WEBRTC LIVE CALLS
    let localStream = null;
    let peerConnection = null;
    let callSignalUnsub = null;

    const iceServers = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    async function startWebRTCCall(callType) {
      if (!targetUserData || !activeChatRoomId || !currentUser) return;

      document.getElementById('callModal').style.display = 'flex';
      document.getElementById('callingStatusLabel').innerText = `Calling (${callType})...`;
      document.getElementById('callingTargetLabel').innerText = targetUserData.name;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: callType === 'Video'
        });
        document.getElementById('localStreamVideo').srcObject = localStream;

        peerConnection = new RTCPeerConnection(iceServers);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => {
          document.getElementById('remoteStreamVideo').srcObject = event.streams[0];
          document.getElementById('callingStatusLabel').innerText = "Connected (Live)";
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await db.collection('liveCalls').doc(activeChatRoomId).set({
          caller: loggedAccount,
          callerUid: currentUser.uid,
          receiver: targetUserData.email,
          type: callType,
          status: 'calling',
          offer: { sdp: offer.sdp, type: offer.type },
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        callSignalUnsub = db.collection('liveCalls').doc(activeChatRoomId).onSnapshot(async (snap) => {
          if (!snap.exists) return;
          const data = snap.data();
          if (data.answer && !peerConnection.currentRemoteDescription) {
            const answerDesc = new RTCSessionDescription(data.answer);
            await peerConnection.setRemoteDescription(answerDesc);
          }
        });

      } catch (err) {
        alert("Camera / Mic Permission Error: " + err.message);
        endWebRTCCall();
      }
    }

    async function endWebRTCCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      if (peerConnection) {
        peerConnection.close();
      }
      if (callSignalUnsub) callSignalUnsub();
      if (activeChatRoomId) {
        await db.collection('liveCalls').doc(activeChatRoomId).delete().catch(() => {});
      }
      document.getElementById('callModal').style.display = 'none';
      document.getElementById('remoteStreamVideo').srcObject = null;
      document.getElementById('localStreamVideo').srcObject = null;
    }

    // 11. MEDICINE RAIN ANIMATION
    const colorfulMedicines = [
      `<svg viewBox="0 0 32 32"><g transform="rotate(-30 16 16)"><path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#ef4444" opacity="0.65"/><path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#ffffff" opacity="0.65"/><rect x="9.5" y="15" width="13" height="2" fill="#b91c1c" opacity="0.6" rx="1"/></g></svg>`,
      `<svg viewBox="0 0 32 32"><g transform="rotate(25 16 16)"><path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#0f172a" opacity="0.75"/><path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#10b981" opacity="0.7"/><rect x="9.5" y="15" width="13" height="2" fill="#34d399" opacity="0.7" rx="1"/></g></svg>`,
      `<svg viewBox="0 0 32 32"><path d="M16 26 s-9-5.5-9-12 a5.5 5.5 0 0 1 10-3.2 a5.5 5.5 0 0 1 10 3.2 c0 6.5-9 12-9 12 z" fill="#f43f5e" opacity="0.55" stroke="#fda4af" stroke-width="1.2"/></svg>`,
      `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="#0ea5e9" opacity="0.5" stroke="#38bdf8" stroke-width="1.5"/><line x1="8" y1="16" x2="24" y2="16" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8"/></svg>`,
      `<svg viewBox="0 0 32 32"><rect x="13" y="3" width="6" height="3" fill="#ffffff" opacity="0.8" rx="1"/><path d="M10 9 C8.5 9 8 10 8 11.5 V25 C8 26.5 9.5 28 11 28 H21 C22.5 28 24 26.5 24 25 V11.5 C24 10 23.5 9 22 9 Z" fill="#0284c7" opacity="0.45" stroke="#38bdf8" stroke-width="1.2"/></svg>`
    ];

    const rainContainer = document.getElementById('rainContainer');
    for (let i = 0; i < 28; i++) {
      const drop = document.createElement('div');
      drop.className = 'medicine-drop';
      drop.innerHTML = colorfulMedicines[Math.floor(Math.random() * colorfulMedicines.length)];
      const size = Math.floor(Math.random() * 24) + 26;
      drop.style.width = size + 'px';
      drop.style.height = size + 'px';
      drop.style.left = Math.random() * 95 + '%';
      drop.style.animationDuration = (Math.random() * 8 + 12) + 's';
      drop.style.animationDelay = '-' + (Math.random() * 12) + 's';
      rainContainer.appendChild(drop);
    }
  </script>
