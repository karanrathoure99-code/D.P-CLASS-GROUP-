<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>D Pharma Portal - Secure Chats</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at center, #05241f 0%, #020f0d 100%);
      color: #ffffff;
      position: relative;
    }

    /* Falling Medicines Rain */
    .rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .medicine-drop {
      position: absolute;
      top: -90px;
      animation: slowRain linear infinite;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
    }

    @keyframes slowRain {
      0% { transform: translateY(-90px) rotate(0deg); opacity: 0; }
      12% { opacity: 0.85; }
      88% { opacity: 0.85; }
      100% { transform: translateY(112vh) rotate(360deg); opacity: 0; }
    }

    .app-container {
      position: relative;
      z-index: 2;
      max-width: 720px;
      margin: 0 auto;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Notification Banner */
    .notif-banner {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(6, 43, 37, 0.95);
      border: 1px solid #34d399;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 300;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.3s ease;
      font-size: 0.84rem;
      max-width: 90%;
    }

    .notif-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Incoming Call Banner Modal */
    .incoming-call-alert {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(6, 43, 37, 0.98);
      border: 2px solid #10b981;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      z-index: 400;
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    /* Top Header */
    .chat-header {
      flex-shrink: 0;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(6, 43, 37, 0.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(52, 211, 153, 0.25);
    }

    .user-profile-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #34d399;
      object-fit: cover;
      background: #031411;
      pointer-events: none;
    }

    .header-icons {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #34d399;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .icon-btn:hover {
      background: rgba(16, 185, 129, 0.45);
      color: #fff;
    }

    /* Main View Area */
    .main-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Incoming Requests Box */
    .requests-box {
      flex-shrink: 0;
      background: rgba(16, 185, 129, 0.15);
      border-bottom: 1px solid rgba(52, 211, 153, 0.35);
      padding: 10px 14px;
      display: none;
      max-height: 140px;
      overflow-y: auto;
    }

    .req-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(3, 20, 17, 0.9);
      border: 1px solid rgba(52, 211, 153, 0.4);
      padding: 8px 12px;
      border-radius: 12px;
      margin-top: 6px;
    }

    .btn-accept {
      background: #10b981;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Conversations List */
    .chat-list-view {
      flex: 1;
      min-height: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .chat-user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(6, 43, 37, 0.75);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 14px;
      padding: 10px 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .chat-user-item:hover {
      background: rgba(16, 185, 129, 0.25);
      border-color: #34d399;
    }

    /* Active Conversation View */
    .active-chat-view {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .messages-area {
      flex: 1;
      min-height: 0;
      padding: 12px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .e2e-badge-wrap {
      text-align: center;
      margin: 4px 0;
    }

    .e2e-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #a7f3d0;
    }

    .msg-bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 0.86rem;
      line-height: 1.35;
      word-break: break-word;
      position: relative;
      touch-action: pan-y;
    }

    .msg-incoming {
      align-self: flex-start;
      background: rgba(6, 43, 37, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.25);
      color: #e2e8f0;
      border-bottom-left-radius: 3px;
    }

    .msg-outgoing {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.45), rgba(5, 150, 105, 0.55));
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #ffffff;
      border-bottom-right-radius: 3px;
    }

    .chat-media-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      margin-top: 4px;
      border: 1px solid rgba(52, 211, 153, 0.4);
      display: block;
      cursor: pointer;
    }

    .chat-media-video {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      margin-top: 4px;
      outline: none;
      background: #000;
    }

    /* Shared ID Card Card Box */
    .shared-id-card {
      background: rgba(3, 20, 17, 0.95);
      border: 1.5px solid #34d399;
      border-radius: 14px;
      padding: 12px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 210px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .shared-id-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-send-req-card {
      background: linear-gradient(135deg, #10b981, #059669);
      border: 1px solid #34d399;
      color: #ffffff;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
    }

    .btn-send-req-card:hover {
      background: #34d399;
      color: #021a15;
    }

    /* Bottom Input Bar */
    .chat-input-bar {
      flex-shrink: 0;
      padding: 8px 12px;
      background: rgba(3, 20, 17, 0.98);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(52, 211, 153, 0.25);
      display: flex;
      gap: 8px;
      align-items: center;
      position: relative;
    }

    .chat-input {
      flex: 1;
      height: 40px;
      background: rgba(6, 43, 37, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 22px;
      padding: 0 14px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .chat-input:focus {
      border-color: #34d399;
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.3);
    }

    .send-btn, .attach-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .send-btn {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .attach-btn {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #34d399;
    }

    /* Attach Menu Popup */
    .attach-menu {
      position: absolute;
      bottom: 58px;
      left: 12px;
      background: rgba(6, 43, 37, 0.95);
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 16px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      z-index: 50;
    }

    .attach-option {
      background: rgba(3, 20, 17, 0.6);
      border: none;
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .attach-option:hover {
      background: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    /* WebRTC Call Screen */
    .call-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #010a08;
      z-index: 500;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
    }

    .video-grid {
      width: 100%;
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #remoteStreamVideo {
      width: 100%;
      height: 100%;
      max-height: 70vh;
      border-radius: 16px;
      background: #031411;
      object-fit: cover;
    }

    #localStreamVideo {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 100px;
      height: 140px;
      border-radius: 12px;
      border: 2px solid #34d399;
      background: #000;
      object-fit: cover;
    }

    .call-control-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-top: 14px;
    }

    .btn-hangup {
      background: #ef4444;
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
    }

    /* Action Modal */
    .action-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 600;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .action-modal-box {
      background: rgba(6, 43, 37, 0.98);
      border: 1.5px solid rgba(52, 211, 153, 0.5);
      border-radius: 20px;
      width: 100%;
      max-width: 320px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      text-align: center;
    }

    .action-modal-btn {
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-download-act {
      background: rgba(16, 185, 129, 0.25);
      border: 1px solid #34d399;
      color: #34d399;
    }

    .btn-delete-me-act {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid #f59e0b;
      color: #fbbf24;
    }

    .btn-unsend-act {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .btn-cancel-act {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body oncontextmenu="return false;">

  <!-- Background Rain -->
  <div class="rain-container" id="rainContainer"></div>

  <!-- Realtime Notification Banner -->
  <div class="notif-banner" id="notifBanner">
    <span>🔔</span>
    <div id="notifText">New message received</div>
  </div>

  <!-- Incoming Call Popup Modal -->
  <div class="incoming-call-alert" id="incomingCallModal">
    <div style="font-size: 2rem;">📞</div>
    <h3 id="incomingCallerName" style="color: #34d399; font-size: 1.1rem;">Incoming Call...</h3>
    <p id="incomingCallType" style="font-size: 0.8rem; color: #94a3b8;">Video Call</p>
    <div style="display: flex; gap: 14px; width: 100%; justify-content: center; margin-top: 6px;">
      <button onclick="acceptIncomingCall()" style="background:#10b981; border:none; color:#fff; padding:10px 22px; border-radius:12px; font-weight:700; cursor:pointer;">Accept</button>
      <button onclick="rejectIncomingCall()" style="background:#ef4444; border:none; color:#fff; padding:10px 22px; border-radius:12px; font-weight:700; cursor:pointer;">Reject</button>
    </div>
  </div>

  <!-- 3-Second Long Press Message Context Action Modal -->
  <div class="action-modal-overlay" id="actionModal" onclick="closeActionModal(event)">
    <div class="action-modal-box" onclick="event.stopPropagation()">
      <h4 style="color:#a7f3d0; font-size:0.92rem; margin-bottom:4px;">Message Options</h4>
      
      <button class="action-modal-btn btn-download-act" id="btnActDownload" onclick="triggerActionDownload()">
        📥 Download File / Image
      </button>

      <button class="action-modal-btn btn-delete-me-act" onclick="triggerActionDeleteForMe()">
        🗑️ Delete for Me
      </button>

      <button class="action-modal-btn btn-unsend-act" id="btnActUnsend" onclick="triggerActionUnsend()">
        🚫 Unsend (Delete for Everyone)
      </button>

      <button class="action-modal-btn btn-cancel-act" onclick="closeActionModal()">
        Cancel
      </button>
    </div>
  </div>

  <div class="app-container">
    <!-- Top Header -->
    <div class="chat-header">
      <div class="user-profile-meta" id="headerProfileBlock" onclick="handleHeaderNav()">
        <span style="font-size: 1.2rem; color: #34d399; margin-right: 2px;">❮</span>
        <img id="chatTargetAvatar" class="chat-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Chat User" />
        <div>
          <h3 id="chatTargetName" style="font-size: 0.9rem; line-height: 1.2;">Secure Chats</h3>
          <span id="chatTargetStatus" style="font-size: 0.68rem; color: #34d399;">🔒 Device-Bound Encrypted</span>
        </div>
      </div>
      <div class="header-icons" id="headerCallActions" style="display: none;">
        <button class="icon-btn" onclick="startWebRTCCall('Audio')">
          <svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
        <button class="icon-btn" onclick="startWebRTCCall('Video')">
          <svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        </button>
      </div>
    </div>

    <!-- Main Dynamic Body -->
    <div class="main-body">
      <!-- 1. Incoming Requests Box -->
      <div id="requestsWrap" class="requests-box">
        <span style="font-size: 0.75rem; font-weight: 700; color: #34d399;">📥 INCOMING CHAT REQUESTS:</span>
        <div id="requestsList"></div>
      </div>

      <!-- 2. Accepted Conversations List -->
      <div id="chatListView" class="chat-list-view">
        <h4 style="font-size: 0.8rem; color: #a7f3d0;">ACCEPTED CONVERSATIONS:</h4>
        <div id="friendsList">Loading chats...</div>
      </div>

      <!-- 3. Active Chat Window -->
      <div id="activeChatView" class="active-chat-view">
        <div class="messages-area" id="messagesBox">
          <div class="e2e-badge-wrap">
            <span class="e2e-badge">
              🛡️ Messages are end-to-end encrypted to this specific physical device only.
            </span>
          </div>
        </div>

        <!-- Attachment Menu -->
        <div class="attach-menu" id="attachMenu">
          <button class="attach-option" onclick="document.getElementById('cameraCaptureInput').click()">📷 Open Camera & Snap</button>
          <button class="attach-option" onclick="document.getElementById('filePhotoInput').click()">🖼️ Choose from Gallery</button>
          <button class="attach-option" onclick="document.getElementById('fileVideoInput').click()">🎥 Send Cloud Video</button>
          <button class="attach-option" onclick="promptSendLink()">🔗 Send Web Link</button>
          <button class="attach-option" onclick="promptShareStudentID()">🪪 Share Student ID Card</button>
        </div>

        <!-- Inputs for Photos and Videos -->
        <input type="file" id="cameraCaptureInput" accept="image/*" capture="environment" style="display:none;" onchange="handleCloudinaryUpload(event, 'image')" />
        <input type="file" id="filePhotoInput" accept="image/*" style="display:none;" onchange="handleCloudinaryUpload(event, 'image')" />
        <input type="file" id="fileVideoInput" accept="video/*" style="display:none;" onchange="handleCloudinaryUpload(event, 'video')" />

        <form class="chat-input-bar" id="sendMsgForm">
          <button type="button" class="attach-btn" onclick="toggleAttachMenu()">📎</button>
          <input type="text" id="msgInput" class="chat-input" placeholder="Type encrypted message..." autocomplete="off" />
          <button type="submit" class="send-btn">
            <svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Real WebRTC Call Screen Modal -->
  <div class="call-modal" id="callModal">
    <div style="text-align: center;">
      <h2 id="callingStatusLabel" style="font-size: 1.2rem; color: #34d399; margin-bottom: 4px;">Live Call</h2>
      <p id="callingTargetLabel" style="font-size: 0.85rem; color: #94a3b8;">Connecting...</p>
    </div>

    <div class="video-grid">
      <video id="remoteStreamVideo" autoplay playsinline></video>
      <video id="localStreamVideo" autoplay playsinline muted></video>
    </div>

    <div class="call-control-bar">
      <button class="btn-hangup" onclick="endWebRTCCall()">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 010-1.41C2.51 9.4 6.99 8 12 8s9.49 1.4 11.71 3.67c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
      </button>
    </div>
  </div>

  <script>
    // 1. CLOUDINARY CONFIGURATION
    const CLOUDINARY_CLOUD_NAME = "glkgivxq";
    const CLOUDINARY_UPLOAD_PRESET = "mnyrwkag";

    // 2. FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyCQ2XpoeeKwVmIZ2wp8H3D2xzTY49nhxAI",
      authDomain: "d-pharma-class-group.firebaseapp.com",
      projectId: "d-pharma-class-group",

    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {}
    }

    // 5. DEVICE-BOUND E2EE ENGINE
    function getDeviceKey() {

        key = 'DPKEY_' + Math.random().toString(36).substring(2) + Date.now().toString(36);

      return key;

    const currentDeviceKey = getDeviceKey();

    function encryptPayload(rawText, dKey) {
      let result = '';
      for (let i = 0; i < rawText.length; i++) {
        const charCode = rawText.charCodeAt(i) ^ dKey.charCodeAt(i % dKey.length);
        result += String.fromCharCode(charCode);
      }
      return btoa(encodeURIComponent(result));
    }

    function decryptPayload(cipher, dKey) {
      try {
        const decoded = decodeURIComponent(atob(cipher));
        let result = '';
        for (let i = 0; i < decoded.length; i++) {
          const charCode = decoded.charCodeAt(i) ^ dKey.charCodeAt(i % dKey.length);
          result += String.fromCharCode(charCode);
        }
        return result;
      } catch (e) {
        return null;
      }
    }

    async function uploadFileToCloudinary(file) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, {
        method: "POST",
        body: formData
      });

      if (!res.ok) {
        throw new Error("Cloudinary upload failed with status " + res.status);

      const data = await res.json();
      return data.secure_url; // Direct CDN URL

    // Deletes messages older than 15 days from Firebase Firestore
    async function cleanOldServerMessages(roomId) {
      if (!roomId) return;
      const fifteenDaysInMs = 15 * 24 * 60 * 60 * 1000;
      const expiryTimestamp = Date.now() - fifteenDaysInMs;

      try {
        const oldSnap = await db.collection('chats').doc(roomId).collection('messages')
          .where('createdMillis', '<', expiryTimestamp)
          .get();

        const batch = db.batch();
        let count = 0;
        oldSnap.forEach(doc => {
          batch.delete(doc.ref);
          count++;
        });

        if (count > 0) {
          await batch.commit();
          console.log(`Auto-cleaned ${count} old server messages for room ${roomId}`);
        }
      } catch (err) {
        console.warn("Server auto-clean note:", err.message);
      }
    }

    function renderSingleMessageBubble(m, box) {
      const msgId = m.id;
      if (localDeletedMsgIds.includes(msgId)) return;

      let clearText = null;
      if (isMe) {
        if (m.deviceKey === currentDeviceKey) {
          clearText = decryptPayload(m.cipher, currentDeviceKey);
        }
      } else {
        clearText = decryptPayload(m.cipher, m.deviceKey);
      }

      let msgParsed = null;

      if (!clearText) {
        bubble.innerHTML = `<span style="font-size:0.75rem; color:#fca5a5;">🔒 Encrypted on another device</span>`;
      } else {
        try {
          const parsed = JSON.parse(clearText);

          } else if (parsed.type === 'image') {
            bubble.innerHTML = `<img src="${parsed.data}" class="chat-media-img" alt="Chat Photo" />`;
          } else if (parsed.type === 'video') {

            bubble.innerHTML = `<a href="${parsed.data}" target="_blank" style="color:#38bdf8; text-decoration:underline;">🔗 ${parsed.data}</a>`;

            const cardAvatar = card.photo || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

    function listenMessages() {
      if (msgListenerUnsub) msgListenerUnsub();
      isInitialLoad = true;

      const currentRoom = activeChatRoomId;
      const box = document.getElementById('messagesBox');

      // 1. First render existing local messages stored on device
      let localMessages = getLocalRoomMessages(currentRoom);

      box.innerHTML = `
        <div class="e2e-badge-wrap">
          <span class="e2e-badge">
            🛡️ Messages are end-to-end encrypted to this specific physical device only.
          </span>
        </div>
      `;

      localMessages.forEach(msg => renderSingleMessageBubble(msg, box));
      box.scrollTop = box.scrollHeight;

      // 2. Listen to Firestore messages
      msgListenerUnsub = db.collection('chats').doc(currentRoom).collection('messages')
        .orderBy('createdAt', 'asc')
        .onSnapshot((snap) => {
          let updatedList = [...localMessages];
          let hasNew = false;
          let lastDoc = null;

          snap.forEach((doc) => {
            const m = doc.data();
            const msgObj = {
              id: doc.id,
              sender: m.sender,
              senderId: m.senderId,
              receiver: m.receiver,
              cipher: m.cipher,
              deviceKey: m.deviceKey,
              createdMillis: m.createdMillis || Date.now()
            };

            lastDoc = m;

            // Check if already in local storage
            const idx = updatedList.findIndex(x => x.id === doc.id);
            if (idx === -1) {
              updatedList.push(msgObj);
              hasNew = true;
            } else {
              updatedList[idx] = msgObj;
            }
          });

          // Save combined list to device local memory
          saveLocalRoomMessages(currentRoom, updatedList);
          localMessages = updatedList;

          // Re-render UI with complete local list
          box.innerHTML = `
            <div class="e2e-badge-wrap">
              <span class="e2e-badge">
                🛡️ Messages are end-to-end encrypted to this specific physical device only.
              </span>
            </div>
          `;
          updatedList.forEach(msg => renderSingleMessageBubble(msg, box));

          if (!isInitialLoad && lastDoc && lastDoc.sender !== loggedAccount && lastDoc.senderId !== currentUser?.uid) {
            showNotification(targetUserData ? targetUserData.name : 'Incoming', 'New Encrypted Message');
          }
          isInitialLoad = false;
          box.scrollTop = box.scrollHeight;

          // Trigger server clean-up for messages older than 15 days
          cleanOldServerMessages(currentRoom);
        });
    }

    // 11. 3-SECOND TOUCH / MOUSE LONG-PRESS ENGINE
    function attachLongPressListener(element, meta) {
      const startPress = (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;

        pressTimer = setTimeout(() => {
          openActionModal(meta);
        }, 3000); // 3 seconds
      };

      const cancelPress = () => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      };

      element.addEventListener('touchstart', startPress, { passive: true });
      element.addEventListener('touchend', cancelPress);
      element.addEventListener('touchmove', cancelPress);

      element.addEventListener('mousedown', startPress);
      element.addEventListener('mouseup', cancelPress);
      element.addEventListener('mouseleave', cancelPress);
    }

    // ACTION 3: UNSEND (DELETE FOR EVERYONE)
    async function triggerActionUnsend() {
      if (!selectedMsgContext || !activeChatRoomId) return;
      if (!selectedMsgContext.isMe) {
        alert("You can only unsend messages sent by you.");
        return;
      }
      try {
        await db.collection('chats').doc(activeChatRoomId)
          .collection('messages').doc(selectedMsgContext.id).delete();

        // Also remove from local device memory
        let localMsgs = getLocalRoomMessages(activeChatRoomId);
        localMsgs = localMsgs.filter(m => m.id !== selectedMsgContext.id);
        saveLocalRoomMessages(activeChatRoomId, localMsgs);

        closeActionModal();
        listenMessages();
      } catch (err) {
        alert("Failed to unsend: " + err.message);
      }

    // 12. WEBRTC CALLING ENGINE
    let localStream = null;
    let peerConnection = null;
    let activeCallDocId = null;
    let callUnsub = null;
    let currentCallData = null;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function listenIncomingCalls() {
      if (!loggedAccount) return;
      db.collection('liveCalls')
        .where('receiver', '==', loggedAccount)
        .where('status', '==', 'calling')
        .onSnapshot((snap) => {
          if (snap.empty) {
            document.getElementById('incomingCallModal').style.display = 'none';
            return;
          }
          const callDoc = snap.docs[0];
          currentCallData = callDoc.data();
          activeCallDocId = callDoc.id;

          document.getElementById('incomingCallerName').innerText = `${currentCallData.callerName || currentCallData.caller} is calling...`;
          document.getElementById('incomingCallType').innerText = `${currentCallData.type} Call`;
          document.getElementById('incomingCallModal').style.display = 'flex';
          playBeepSound();
        });
    }

    async function startWebRTCCall(callType) {
      if (!targetUserData || !activeChatRoomId || !currentUser) return;

      activeCallDocId = activeChatRoomId;
      document.getElementById('callModal').style.display = 'flex';
      document.getElementById('callingStatusLabel').innerText = `Ringing (${callType})...`;
      document.getElementById('callingTargetLabel').innerText = targetUserData.name;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: callType === 'Video'
        });
        document.getElementById('localStreamVideo').srcObject = localStream;

        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => {
          document.getElementById('remoteStreamVideo').srcObject = event.streams[0];
          document.getElementById('callingStatusLabel').innerText = "Connected (Live)";
        };

        const callDocRef = db.collection('liveCalls').doc(activeCallDocId);
        const callerCandidates = callDocRef.collection('callerCandidates');

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            callerCandidates.add(event.candidate.toJSON());
          }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await callDocRef.set({
          caller: loggedAccount,
          callerName: currentUser.displayName || loggedAccount,
          callerUid: currentUser.uid,
          receiver: targetUserData.email,
          type: callType,
          status: 'calling',
          offer: { sdp: offer.sdp, type: offer.type },
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        callUnsub = callDocRef.onSnapshot(async (snap) => {
          if (!snap.exists) return;
          const data = snap.data();
          if (data.answer && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            document.getElementById('callingStatusLabel').innerText = "Connected (Live)";
          }
        });

        callDocRef.collection('calleeCandidates').onSnapshot((snap) => {
          snap.docChanges().forEach(async (change) => {
            if (change.type === 'added') {
              const candidate = new RTCIceCandidate(change.doc.data());
              await peerConnection.addIceCandidate(candidate).catch(() => {});
            }
          });
        });

      } catch (err) {
        alert("Camera/Mic Permission Required: " + err.message);
        endWebRTCCall();
      }
    }

    async function acceptIncomingCall() {
      if (!activeCallDocId || !currentCallData) return;
      document.getElementById('incomingCallModal').style.display = 'none';
      document.getElementById('callModal').style.display = 'flex';
      document.getElementById('callingStatusLabel').innerText = `Connecting...`;
      document.getElementById('callingTargetLabel').innerText = currentCallData.callerName || currentCallData.caller;

      try {
        const isVideo = currentCallData.type === 'Video';
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: isVideo
        });
        document.getElementById('localStreamVideo').srcObject = localStream;

        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => {
          document.getElementById('remoteStreamVideo').srcObject = event.streams[0];
          document.getElementById('callingStatusLabel').innerText = "Connected (Live)";
        };

        const callDocRef = db.collection('liveCalls').doc(activeCallDocId);
        const calleeCandidates = callDocRef.collection('calleeCandidates');

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            calleeCandidates.add(event.candidate.toJSON());
          }
        };

        await peerConnection.setRemoteDescription(new RTCSessionDescription(currentCallData.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        await callDocRef.update({
          status: 'connected',
          answer: { sdp: answer.sdp, type: answer.type }
        });

        callDocRef.collection('callerCandidates').onSnapshot((snap) => {
          snap.docChanges().forEach(async (change) => {
            if (change.type === 'added') {
              const candidate = new RTCIceCandidate(change.doc.data());
              await peerConnection.addIceCandidate(candidate).catch(() => {});
            }
          });
        });

      } catch (err) {
        alert("Call connection error: " + err.message);
        endWebRTCCall();
      }
    }

    async function rejectIncomingCall() {
      document.getElementById('incomingCallModal').style.display = 'none';
      if (activeCallDocId) {
        await db.collection('liveCalls').doc(activeCallDocId).delete().catch(() => {});
      }
    }

    async function endWebRTCCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      if (peerConnection) {
        peerConnection.close();
      }
      if (callUnsub) callUnsub();

      if (activeCallDocId) {
        await db.collection('liveCalls').doc(activeCallDocId).delete().catch(() => {});
      }

      document.getElementById('callModal').style.display = 'none';
      document.getElementById('remoteStreamVideo').srcObject = null;
      document.getElementById('localStreamVideo').srcObject = null;
    }

    // 13. BACKGROUND ANIMATION
    const colorfulMedicines = [
      `<svg viewBox="0 0 32 32"><g transform="rotate(-30 16 16)"><path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#ef4444" opacity="0.65"/><path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#ffffff" opacity="0.65"/><rect x="9.5" y="15" width="13" height="2" fill="#b91c1c" opacity="0.6" rx="1"/></g></svg>`,
      `<svg viewBox="0 0 32 32"><g transform="rotate(25 16 16)"><path d="M10 16 C10 11.5 12.5 8 16 8 C19.5 8 22 11.5 22 16 Z" fill="#0f172a" opacity="0.75"/><path d="M10 16 C10 20.5 12.5 24 16 24 C19.5 24 22 20.5 22 16 Z" fill="#10b981" opacity="0.7"/><rect x="9.5" y="15" width="13" height="2" fill="#34d399" opacity="0.7" rx="1"/></g></svg>`,
      `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="#0ea5e9" opacity="0.5" stroke="#38bdf8" stroke-width="1.5"/><line x1="8" y1="16" x2="24" y2="16" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8"/></svg>`
    ];

    const rainContainer = document.getElementById('rainContainer');
    for (let i = 0; i < 24; i++) {
      const drop = document.createElement('div');
      drop.className = 'medicine-drop';
      drop.innerHTML = colorfulMedicines[i % colorfulMedicines.length];
      const size = Math.floor(Math.random() * 20) + 24;
      drop.style.width = size + 'px';
      drop.style.height = size + 'px';
      drop.style.left = (i * 4 + Math.random() * 4) + '%';
      drop.style.animationDuration = (Math.random() * 6 + 10) + 's';
      drop.style.animationDelay = '-' + (Math.random() * 10) + 's';
      rainContainer.appendChild(drop);
    }

    // 14. DOUBLE-CLICK FULLSCREEN API
    document.addEventListener('dblclick', function(e) {
      if (['INPUT', 'BUTTON', 'TEXTAREA', 'A', 'VIDEO'].includes(e.target.tagName)) return;
      const doc = window.document;
      const docEl = doc.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen;
      const exit = doc.exitFullscreen || doc.webkitExitFullscreen;
      if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
        if (req) req.call(docEl).catch(() => {});
      } else {
        if (exit) exit.call(doc);
      }
    });
  </script>
</body>
</html>
